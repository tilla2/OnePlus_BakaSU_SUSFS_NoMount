name: upstream-sync-monitor

# Daily: detect new/changed devices in the WildKernels and Bouteillepleine
# trees and emit a CI action matrix (no writes, no PR). The sync branch is
# force-pushed only on a manual run with apply=true; open the PR manually
# from that branch - it is deleted automatically when the PR merges.
# Apply runs also regenerate the device_a14/a15/a16 dispatch menus in
# build-kernel-release.yml from configs/ onto the same sync branch.
# Upstream manifests are rewritten to our
# huangdihd AnyKernel3 (wild remote, gki-2.0) before they are saved, and
# configs are generated from the canonical template with upstream values -
# nothing under manifests/ or configs/ is hand-edited here.

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Base branch for the sync PR (default: the branch this run is dispatched from)"
        default: ""
        required: false
      apply:
        description: "Apply changes and force-push the sync branch (open the PR manually)"
        type: boolean
        default: false
      dry_run:
        description: "Detect and report only (no writes even with apply)"
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync-monitor
  cancel-in-progress: false

env:
  WD_REPO: WildKernels/OnePlus_KernelSU_SUSFS
  BP_REPO: Bouteillepleine/OnePlus-BakaSu_NMS
  BP_PATCHES_REPO: Bouteillepleine/kernel_patches
  WD_PATCHES_REPO: WildKernels/kernel_patches
  AK_REMOTE_URL: https://github.com/huangdihd
  AK_PROJECT: <project remote="wild" name="AnyKernel3" path="AnyKernel3" revision="gki-2.0"/>
  NOMOUNT_REPO: maxsteeel/nomount
  SYNC_BRANCH: upstream-sync/auto

jobs:
  sync-devices:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sync.outputs.matrix }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: 1

      - name: Detect upstream changes, pair & rewrite sources, emit CI matrix
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
          APPLY_FLAG: ${{ inputs.apply && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          AK_REMOTE_URL: ${{ env.AK_REMOTE_URL }}
          AK_PROJECT: ${{ env.AK_PROJECT }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, json, os, re, subprocess, time, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          TARGET = os.environ["TARGET_BRANCH"]
          APPLY = (os.environ["APPLY_FLAG"] == "true"
                   and os.environ["DRY_RUN"] != "true")
          WD_REPO, BP_REPO = os.environ["WD_REPO"], os.environ["BP_REPO"]
          AK_REMOTE_URL = os.environ["AK_REMOTE_URL"]
          AK_PROJECT = os.environ["AK_PROJECT"]

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "User-Agent": "upstream-sync-monitor",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def default_branch(repo):
              return api(f"https://api.github.com/repos/{repo}")["default_branch"]

          def tree(repo, ref):
              data = api(f"https://api.github.com/repos/{repo}/git/trees/{ref}?recursive=1")
              out, stack = [], [data["tree"]]
              while stack:
                  for e in stack.pop():
                      if e["type"] == "tree":
                          stack.append(api(e["url"])["tree"])
                      else:
                          out.append(e["path"])
              return sorted(set(out))

          def raw(repo, ref, path):
              req = urllib.request.Request(
                  f"https://raw.githubusercontent.com/{repo}/{ref}/{path}",
                  headers={"User-Agent": "upstream-sync-monitor"})
              with urllib.request.urlopen(req) as r:
                  return r.read().decode("utf-8")

          # canonical config template: identity -> toolchain -> features;
          # rekernel (patchset) above the blacklist block; naming/build-time
          # misc at the bottom, root_tag last.
          TEMPLATE = ["model", "soc", "branch", "manifest", "android_version",
              "kernel_version", "os_version", "lto", "zyc_compiler",
              "c_compiler", "rust_compiler", "bindgen", "rust_build",
              "disk_cleanup", "hmbird", "susfs", "opt", "ds", "bbg", "bbr",
              "bbr3", "bore", "lz4_upgrade", "zstd_upgrade", "rtmutex_cve",
              "adios", "ttl", "ip_set", "unicode", "ntsync", "sdp900ma",
              "usbadb_gate", "hide_adb_jdwp", "rekernel", "blacklist_apply",
              "blacklist_modules", "uname", "build_user", "build_host",
              "build_time", "root_tag"]
          # fleet policy: extras always on, bbr3 always on, bore always off
          DEFAULT_TRUE = ["rust_build", "disk_cleanup", "susfs", "opt", "ds",
              "bbg", "bbr", "lz4_upgrade", "zstd_upgrade", "rtmutex_cve",
              "adios", "ttl", "ip_set", "unicode", "ntsync", "rekernel"]
          FORCED = {"bbr3": True, "bore": False, "sdp900ma": True,
                    "usbadb_gate": True, "hide_adb_jdwp": True}
          TOOLCHAIN_DEFAULTS = {"zyc_compiler": "", "c_compiler": "",
                                "rust_compiler": "", "bindgen": ""}
          MISC_KEYS = ["uname", "build_user", "build_host", "build_time"]
          OSV = {"a14": "A14", "a15": "A15", "a16": "A16", "a17": "A17"}
          ANDV = {"a14": "android14", "a15": "android15",
                  "a16": "android16", "a17": "android17"}
          KVER_RE = re.compile(r"(?:6|5)\.\d+")
          # vendor-like unames only: a kernel release suffix always starts
          # with a digit ("5-gb2a876903b49-ab14541642-4k"); brand strings
          # like WD's "OP-WILD" are rejected and cleared
          UNAME_VENDOR_RE = re.compile(r"^\d")

          def vendor_uname(v):
              return v if (v and UNAME_VENDOR_RE.match(v)) else ""

          def order_config(cfg):
              return {k: cfg[k] for k in TEMPLATE if k in cfg}

          def dump(cfg):
              return json.dumps(cfg, indent=2, ensure_ascii=False) + "\n"

          def transform_manifest(text):
              # rewrite upstream sources to our anykernel implementation:
              # the org remote becomes wild -> huangdihd and the AnyKernel3
              # project is replaced by our canonical gki-2.0 entry; kernel,
              # aosp and CLO prebuilt projects stay untouched.
              text = re.sub(r'<remote[^>]*name="wild"[^>]*/>',
                            f'<remote fetch="{AK_REMOTE_URL}" name="wild"/>',
                            text)
              text = re.sub(
                  r'\n?[ \t]*<remote[^>]*fetch="https://github\.com/'
                  r'(?:WildKernels|Bouteillepleine)"[^>]*/>', "", text)
              text = re.sub(r'remote="(?:WildKernels|Bouteillepleine)"',
                            'remote="wild"', text)
              if 'name="wild"' not in text:
                  text = text.replace(
                      "  <default ",
                      f'  <remote fetch="{AK_REMOTE_URL}" name="wild"/>\n'
                      "  <default ", 1)
              text = re.sub(r'<project[^>]*name="AnyKernel3"[^>]*/>',
                            AK_PROJECT, text)
              if 'name="AnyKernel3"' not in text:
                  raise SystemExit("transform failed: no AnyKernel3 project")
              return text

          wd_ref, bp_ref = default_branch(WD_REPO), default_branch(BP_REPO)
          print(f"upstream heads: {WD_REPO}@{wd_ref}  {BP_REPO}@{bp_ref}")
          wd_paths, bp_paths = tree(WD_REPO, wd_ref), tree(BP_REPO, bp_ref)

          def inv(paths, kind):
              out = {}
              for p in paths:
                  m = re.match(rf"^{kind}/(a1[4-7])/([^/]+\.(?:xml|json))$", p)
                  if m:
                      out[(m.group(1), m.group(2))] = p
              return out

          wd_man, bp_man = inv(wd_paths, "manifests"), inv(bp_paths, "manifests")
          wd_cfgs, bp_cfgs = inv(wd_paths, "configs"), inv(bp_paths, "configs")

          our_man = subprocess.run(["git", "ls-files", "manifests/"],
                                   capture_output=True, text=True).stdout.split()
          our_cfgs = subprocess.run(["git", "ls-files", "configs/"],
                                    capture_output=True, text=True).stdout.split()
          our_man_set = {(p.split("/")[1], p.split("/", 2)[2])
                         for p in our_man if p.count("/") >= 2}
          our_cfg_set = {(p.split("/")[1], p.split("/", 2)[2])
                         for p in our_cfgs if p.count("/") >= 2}

          def ref_cfg_for(andir):
              pref = [p for p in our_cfgs if p.startswith(f"configs/{andir}/")]
              want = f"configs/{andir}/OP15.json"
              pick = want if want in pref else (pref[0] if pref else None)
              return json.load(open(pick)) if pick else {}

          added_man, upd_man, added_cfg, upd_cfg = [], [], [], []
          man_wo_cfg, orphan_cfg, up_manifest_fields = [], [], set()

          def gen_config(up, rcfg, andir, cfg_name, up_man_paths):
              mfield = up.get("manifest", "")
              if not mfield:
                  stem = re.sub(r"\.json$", "", cfg_name)
                  cand = [f for (_, f) in up_man_paths if f == stem + ".xml"]
                  mfield = cand[0] if cand else ""
              orphan = bool(mfield) and (andir, mfield) not in up_man_paths
              kv = up.get("kernel_version", "")
              if not kv and mfield:
                  mm = KVER_RE.search(mfield)
                  kv = mm.group(0) if mm else ""
              if not kv:
                  kv = rcfg.get("kernel_version", "")
              dropped = sorted(set(up) - set(TEMPLATE) - {"ktimestamp"})
              policy = dict(FORCED)
              policy.update({k: True for k in DEFAULT_TRUE})
              ignored = sorted(k for k, v in policy.items() if k in up and up[k] != v)
              cfg = {
                  "model": up.get("model", re.sub(r"\.json$", "", cfg_name)),
                  "soc": up.get("soc", rcfg.get("soc", "")),
                  "branch": up.get("branch", rcfg.get("branch", "")),
                  "manifest": mfield,
                  "android_version": ANDV.get(andir, andir),
                  "kernel_version": kv,
                  "os_version": up.get("os_version",
                                       OSV.get(andir, andir.upper())),
                  "lto": up.get("lto", rcfg.get("lto", "none")),
                  "hmbird": up.get("hmbird", rcfg.get("hmbird", False)),
                  "blacklist_apply": up.get("blacklist_apply",
                                            rcfg.get("blacklist_apply", True)),
                  "blacklist_modules": up.get("blacklist_modules",
                                              rcfg.get("blacklist_modules", "")),
                  "root_tag": up.get("root_tag", "ChimeraKernel"),
              }
              for k in DEFAULT_TRUE:
                  cfg[k] = True
              cfg.update(FORCED)
              for k, d in TOOLCHAIN_DEFAULTS.items():
                  cfg[k] = up.get(k, rcfg.get(k, d))
              for k in MISC_KEYS:
                  v = up.get(k, "")
                  if k == "uname":
                      if v and not UNAME_VENDOR_RE.match(v):
                          dropped.append(f"uname={v!r} "
                                         "(non-vendor-like, cleared)")
                      v = vendor_uname(v)
                  if k == "build_time" and not v:
                      v = up.get("ktimestamp", "")
                  cfg[k] = v
              return {k: cfg[k] for k in TEMPLATE}, dropped, ignored, orphan

          import xml.etree.ElementTree as ET

          def diff_manifest(old_text, new_text, width=12):
              # digest of what changed between the committed manifest and the
              # rewritten upstream one (attribute-level old -> new)
              def eat(text):
                  out = {}
                  for el in ET.fromstring(text.encode("utf-8")):
                      key = el.tag
                      if "name" in el.attrib:
                          key += ":" + el.attrib["name"]
                      elif "path" in el.attrib:
                          key += ":" + el.attrib["path"]
                      out[key] = dict(el.attrib)
                  return out

              try:
                  old_m, new_m = eat(old_text), eat(new_text)
              except ET.ParseError:
                  return f"content changed ({len(new_text.splitlines())} lines)"
              parts = []

              def show(v):
                  v = v or "(unset)"
                  return v[:width] + "..." if len(v) > width + 4 else v

              for key in sorted(set(old_m) | set(new_m)):
                  disp = key.replace(":", " ", 1)
                  if key not in old_m:
                      parts.append(f"+{disp}")
                      continue
                  if key not in new_m:
                      parts.append(f"-{disp}")
                      continue
                  for attr in sorted(set(old_m[key]) | set(new_m[key])):
                      ov, nv = old_m[key].get(attr, ""), new_m[key].get(attr, "")
                      if ov != nv:
                          parts.append(f"{disp}.{attr}: {show(ov)} -> {show(nv)}")
              return "; ".join(parts) if parts else "content changed"

          # pass 1: manifests - transform upstream sources, then sync content
          for andir, fname in sorted(set(wd_man) | set(bp_man)):
              key = (andir, fname)
              if key in bp_man:
                  src_repo, src_ref, src_path = BP_REPO, bp_ref, bp_man[key]
              else:
                  src_repo, src_ref, src_path = WD_REPO, wd_ref, wd_man[key]
              ours_path = f"manifests/{andir}/{fname}"
              up_text = transform_manifest(raw(src_repo, src_ref, src_path))
              if key not in our_man_set:
                  if APPLY:
                      os.makedirs(os.path.dirname(ours_path), exist_ok=True)
                      open(ours_path, "w").write(up_text)
                  added_man.append(ours_path)
              elif open(ours_path).read() != up_text:
                  digest = diff_manifest(open(ours_path).read(), up_text)
                  if APPLY:
                      open(ours_path, "w").write(up_text)
                  upd_man.append(f"{ours_path}: {digest}")

          # pass 1b: pair configs to manifests - a local config whose
          # manifest is missing locally but exists upstream gets it copied
          local_man_set = set(our_man_set) | {
              (p.split("/")[1], p.split("/", 2)[2]) for p in added_man}
          for andir, cfg_name in sorted(our_cfg_set):
              cfg = json.load(open(f"configs/{andir}/{cfg_name}"))
              m = cfg.get("manifest", "")
              if not m or (andir, m) in local_man_set:
                  continue
              if (andir, m) not in (set(wd_man) | set(bp_man)):
                  continue
              src_man = bp_man if (andir, m) in bp_man else wd_man
              repo, ref = ((BP_REPO, bp_ref) if (andir, m) in bp_man
                           else (WD_REPO, wd_ref))
              mpath = f"manifests/{andir}/{m}"
              up_text = transform_manifest(raw(repo, ref, src_man[(andir, m)]))
              if APPLY:
                  os.makedirs(os.path.dirname(mpath), exist_ok=True)
                  open(mpath, "w").write(up_text)
              added_man.append(mpath)
              local_man_set.add((andir, m))

          # pass 2: configs - paths and names come from upstream configs/,
          # values from the upstream counterpart (BP priority), our template
          for andir, cfg_name in sorted(set(wd_cfgs) | set(bp_cfgs)):
              key = (andir, cfg_name)
              bp_t = raw(BP_REPO, bp_ref, bp_cfgs[key]) if key in bp_cfgs else None
              wd_t = raw(WD_REPO, wd_ref, wd_cfgs[key]) if key in wd_cfgs else None
              up = json.loads(bp_t) if bp_t else (json.loads(wd_t) if wd_t else {})
              if up.get("manifest"):
                  up_manifest_fields.add((andir, up["manifest"]))
              ours_path = f"configs/{andir}/{cfg_name}"
              if key in our_cfg_set:
                  ours = json.load(open(ours_path))
                  changed = []
                  for k in ("uname", "build_time"):
                      nv = up.get(k, "")
                      if k == "uname":
                          nv = vendor_uname(nv)
                          ov = ours.get(k, "")
                          # a populated local uname is never cleared: an empty or
                          # non-vendor-like upstream value (e.g. WD's "OP-WILD")
                          # means "keep ours" - sync fills/replaces, never blanks
                          if nv and nv != ov:
                              changed.append(f"{k}: {ov!r} -> {nv!r}")
                              ours[k] = nv
                          continue
                      if k == "build_time" and not nv:
                          nv = up.get("ktimestamp", "")
                      if nv and ours.get(k) != nv:
                          changed.append(f"{k}: {ours.get(k)!r} -> {nv!r}")
                          ours[k] = nv
                  for k in ("soc", "branch", "root_tag"):
                      if not ours.get(k):
                          nv = up.get(k, "ChimeraKernel" if k == "root_tag" else "")
                          if nv:
                              changed.append(f"{k}: set {nv!r}")
                              ours[k] = nv
                  rekeyed = order_config(ours)
                  if changed:
                      if APPLY:
                          open(ours_path, "w").write(dump(rekeyed))
                      upd_cfg.append(f"{ours_path}: " + "; ".join(changed))
                  elif rekeyed != ours:
                      if APPLY:
                          open(ours_path, "w").write(dump(rekeyed))
                      upd_cfg.append(f"{ours_path}: key order normalized")
                  continue
              rcfg = ref_cfg_for(andir)
              ordered, dropped, ignored, orphan = gen_config(
                  up, rcfg, andir, cfg_name, set(wd_man) | set(bp_man))
              if orphan:
                  orphan_cfg.append(f"{ours_path} -> "
                                    f"manifests/{andir}/{ordered['manifest']}")
              if APPLY:
                  os.makedirs(os.path.dirname(ours_path), exist_ok=True)
                  open(ours_path, "w").write(dump(ordered))
              notes = []
              if dropped:
                  notes.append(f"dropped upstream-only: {', '.join(dropped)}")
              if ignored:
                  notes.append(f"extras kept on: {', '.join(ignored)}")
              added_cfg.append(ours_path
                               + (f" [{'; '.join(notes)}]" if notes else ""))

          # pass 2c: standardise EVERY local config that has no upstream
          # counterpart to the current template - canonical key order,
          # missing policy keys filled from fleet policy, unknown keys
          # preserved, existing device values never touched (locally-added
          # configs like the Myron pair have no upstream to sync from).
          std_cfg = []
          for andir, cfg_name in sorted(our_cfg_set
                                        - (set(wd_cfgs) | set(bp_cfgs))):
              ours_path = f"configs/{andir}/{cfg_name}"
              cfg = json.load(open(ours_path))
              missing = [k for k in TEMPLATE if k not in cfg]
              filled = []
              for k in missing:
                  if k in FORCED:
                      v = FORCED[k]
                  elif k in DEFAULT_TRUE:
                      v = True
                  elif k in TOOLCHAIN_DEFAULTS or k in MISC_KEYS:
                      v = ""
                  elif k == "lto":
                      v = "none"
                  elif k == "hmbird":
                      v = False
                  elif k == "blacklist_apply":
                      v = True
                  elif k == "root_tag":
                      v = "ChimeraKernel"
                  else:
                      v = ""
                  cfg[k] = v
                  filled.append(f"{k}={v}")
              extras = {k: cfg[k] for k in cfg if k not in TEMPLATE}
              rekeyed = order_config(cfg)
              rekeyed.update(extras)
              if filled or list(rekeyed) != list(cfg):
                  if APPLY:
                      open(ours_path, "w").write(dump(rekeyed))
                  std_cfg.append(f"{ours_path}: "
                                 + ("added " + ", ".join(filled) if filled
                                    else "key order normalized"))

          # pass 2b: pair manifests to configs - flag added manifests that
          # no upstream config references (copied, but not buildable alone)
          for mpath in added_man:
              andir, fname = mpath.split("/")[1], mpath.split("/", 2)[2]
              if (andir, fname) not in up_manifest_fields:
                  man_wo_cfg.append(mpath)

          # pass 2d: regenerate the device_a14/a15/a16 dispatch menus in
          # build-kernel-release.yml from configs/ - alphabetical, none
          # first; the a16 menu also offers the a17 tree. The rewrite
          # lands on the sync branch with everything else (PR merged
          # manually), never committed straight to the base branch.
          wf_path = ".github/workflows/build-kernel-release.yml"

          def wf_menu_entries(patterns):
              names = set()
              for pat in patterns:
                  names.update(os.path.splitext(os.path.basename(p))[0]
                               for p in glob.glob(pat))
              return sorted(names)

          WF_MENUS = (
              ("device_a14", ["configs/a14/*.json"]),
              ("device_a15", ["configs/a15/*.json"]),
              ("device_a16", ["configs/a16/*.json", "configs/a17/*.json"]),
          )

          def apply_menus(text):
              changed = []
              for key, patterns in WF_MENUS:
                  entries = wf_menu_entries(patterns)
                  m = re.search(
                      r"(?m)(^      " + re.escape(key) + r":\n"
                      r"(?:^        .*\n)*?^        options:\n)"
                      r"((?:^          - .*\n)+)", text)
                  if not m:
                      raise SystemExit("::error::options list for "
                                       f"{key} not found in {wf_path}")
                  old = [l.strip()[2:] for l in m.group(2).splitlines()]
                  new = ["none"] + entries
                  items = "".join(f"          - {e}\n" for e in new)
                  text = text[:m.start(2)] + items + text[m.end(2):]
                  if old != new:
                      changed.append(f"{key}: {len(entries)} device(s) "
                                     f"+ none (was {max(len(old) - 1, 0)})")
              return text, changed

          wf_new, regen = apply_menus(
              open(wf_path, encoding="utf-8").read())
          if apply_menus(wf_new)[1]:
              raise SystemExit("::error::device-menu regeneration is "
                               "not idempotent - aborting without writing")
          if regen and APPLY:
              open(wf_path, "w", encoding="utf-8").write(wf_new)
          elif not regen:
              print("device menus already canonical - nothing to regenerate")

          # CI action matrix: one buildable entry per synced config; updated
          # rows carry what changed (config values and/or manifest pin drift)
          man_changes = {}
          for mentry in upd_man:
              mpath, digest = mentry.split(": ", 1)
              man_changes[mpath] = digest

          entries = []
          for entry in added_cfg + upd_cfg + std_cfg:
              if entry in upd_cfg or entry in std_cfg:
                  p, changes = entry.split(": ", 1)  # "path: what changed"
              else:
                  p, changes = entry.split(" [")[0], ""
              andir, name = p.split("/")[1], p.split("/", 2)[2]
              # updated configs are committed, so they resolve even on dry runs
              cfg = json.load(open(p)) if (APPLY or entry in upd_cfg) else {}
              if cfg.get("manifest"):
                  mp = f"manifests/{andir}/{cfg['manifest']}"
                  if mp in man_changes:
                      changes = (f"{changes}; manifest {man_changes[mp]}"
                                 if changes else f"manifest {man_changes[mp]}")
              entries.append({
                  "model": cfg.get("model", re.sub(r"\.json$", "", name)),
                  "android": andir,
                  "config": p,
                  "manifest": (f"manifests/{andir}/{cfg['manifest']}"
                               if cfg.get("manifest") else ""),
                  "os": cfg.get("os_version", OSV.get(andir, "")),
                  "kernel": cfg.get("kernel_version", ""),
                  "changes": changes,
              })

          # manifest-only updates: give one paired config a matrix row so the
          # manifest drift shows up in the matrix (and gets a verify build)
          for mpath, digest in man_changes.items():
              andir, fname = mpath.split("/")[1], mpath.split("/", 2)[2]
              for ca, cn in sorted(our_cfg_set):
                  cp = f"configs/{ca}/{cn}"
                  if ca != andir or any(e["config"] == cp for e in entries):
                      continue
                  c = json.load(open(cp))
                  if c.get("manifest") != fname:
                      continue
                  entries.append({
                      "model": c.get("model", re.sub(r"\.json$", "", cn)),
                      "android": ca,
                      "config": cp,
                      "manifest": mpath,
                      "os": c.get("os_version", OSV.get(ca, "")),
                      "kernel": c.get("kernel_version", ""),
                      "changes": f"manifest {digest}",
                  })
                  break

          summary = ["## Upstream sync report", ""]
          for title, items in [
                  ("New manifests (rewritten to huangdihd anykernel)", added_man),
                  ("New configs", added_cfg),
                  ("Updated manifests", upd_man),
                  ("Updated configs", upd_cfg),
                  ("Standardised configs (template enforced)", std_cfg),
                  ("Regenerated device menus (build-kernel-release.yml)", regen),
                  ("Config references missing upstream manifest", orphan_cfg),
                  ("Manifests without upstream config counterpart "
                   "(copied, no build config)", man_wo_cfg)]:
              summary.append(f"### {title} ({len(items)})")
              if items:
                  summary.extend(f"- {i}" for i in items)
              else:
                  summary.append("_none_")
              summary.append("")
          summary.append(f"### CI matrix ({len(entries)} entries)")
          if entries:
              summary.extend(f"- `{e['config']}`"
                             + (f" - {e['changes']}" if e.get("changes") else "")
                             for e in entries)
          else:
              summary.append("_empty_")
          report = "\n".join(summary)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)

          with open("ci-matrix.json", "w") as f:
              json.dump({"include": entries}, f, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': entries})}\n")

          if not APPLY:
              print("Report/matrix only - no files written"
                    + (" (dry run)" if os.environ["DRY_RUN"] == "true" else ""))
              raise SystemExit(0)
          if not (added_man + added_cfg + upd_man + upd_cfg + std_cfg
                  + regen):
              print("No changes to apply")
              raise SystemExit(0)

          subprocess.run(["git", "config", "user.name", "upstream-sync-bot"],
                         check=True)
          subprocess.run(["git", "config", "user.email",
                          "actions@github.com"], check=True)
          # per-target sync branch: dispatches against different bases must
          # not force-push each other's open sync PR out from under it
          branch = os.environ["SYNC_BRANCH"] + "-" + re.sub(
              r"[^A-Za-z0-9._-]", "-", TARGET).strip("-")
          subprocess.run(["git", "checkout", "-b", branch], check=True)
          subprocess.run(["git", "add", "manifests/", "configs/", wf_path],
                         check=True)
          commit_msg = ("sync: upstream manifests (huangdihd anykernel) "
                        "& generated configs")
          if regen:
              commit_msg += "; regenerate device menus"
          subprocess.run(["git", "commit", "-m", commit_msg], check=True)
          subprocess.run(["git", "push", "-f", "origin", branch], check=True)

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          compare = f"https://github.com/{repo}/compare/{TARGET}...{branch}"
          note = (f"Sync branch ready: {branch}\n"
                  f"Open the PR manually: {compare}\n"
                  "Merging the PR deletes the branch automatically.")
          print(note)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n" + note + "\n")
          PYEOF

      - name: Upload CI matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-matrix
          path: ci-matrix.json
          if-no-files-found: ignore

  watch-pins:
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run != true }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: 1

      - name: Watch upstream pins vs last successful build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
          BP_PATCHES_REPO: Bouteillepleine/kernel_patches
          WD_PATCHES_REPO: WildKernels/kernel_patches
          NOMOUNT_REPO: maxsteeel/nomount
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io, json, os, subprocess, time, urllib.parse, urllib.request, zipfile

          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          TARGET_BRANCH = os.environ["TARGET_BRANCH"]

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "User-Agent": "upstream-sync-monitor"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # GitLab rejects foreign Authorization headers - call it anonymously
          def gitlab_api(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "upstream-sync-monitor"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # transient 429/5xx on the remotes must not red the nightly run
          def with_retries(fn, tries=4, delay=8.0):
              for attempt in range(tries):
                  try:
                      return fn()
                  except Exception:
                      if attempt == tries - 1:
                          raise
                      time.sleep(delay)

          def gh(*args):
              return subprocess.run(["gh"] + list(args),
                                    capture_output=True, text=True)

          # -- Anchor: last successful build-kernel-release run on this branch --
          runs = with_retries(lambda: api(
              "https://api.github.com/repos/"
              f"{REPO}/actions/workflows/build-kernel-release.yml/runs"
              f"?branch={urllib.parse.quote(TARGET_BRANCH)}"
              "&status=success&per_page=1"))
          run = (runs.get("workflow_runs") or [None])[0]
          if run is None:
              print(f"INFO: no successful build-kernel-release run on "
                    f"'{TARGET_BRANCH}' yet - nothing to compare pins against")
              raise SystemExit(0)

          # -- Pin store: newest non-expired 'last-success-pins' artifact --
          pins = {}
          try:
              arts = api("https://api.github.com/repos/"
                         f"{REPO}/actions/artifacts"
                         "?name=last-success-pins&per_page=100").get("artifacts", [])
              live = [a for a in arts if not a.get("expired")]
              if live:
                  aid = max(live, key=lambda x: x["id"])["id"]
                  dl = subprocess.run(
                      ["gh", "api",
                       f"repos/{REPO}/actions/artifacts/{aid}/zip"],
                      capture_output=True)
                  data = dl.stdout
                  if data[:2] == b"PK":
                      zf = zipfile.ZipFile(io.BytesIO(data))
                      data = zf.read(zf.namelist()[0])
                  try:
                      pins = json.loads(data.decode())
                  except Exception:
                      pins = {}
          except Exception as e:
              print(f"WARN: could not load last-success-pins artifact: {e}")
          if not pins:
              print("INFO: pin store empty/missing - no successful build has "
                    "recorded pins yet; skipping watch")
              raise SystemExit(0)

          drift = []
          notes = []

          def repo_state(repo, ref="HEAD"):
              d = with_retries(lambda: api(
                  f"https://api.github.com/repos/{repo}/commits/{ref}"))
              return d["sha"], d["commit"]["committer"]["date"]

          def advanced(repo, base, head):
              # True when the upstream branch moved past the pinned sha
              if not base or base == head:
                  return False
              try:
                  c = with_retries(lambda: api(
                      f"https://api.github.com/repos/{repo}/compare/{base}...{head}"))
                  return c.get("status") in ("ahead", "diverged")
              except Exception:
                  return True  # cannot prove still-current -> report, don't hide

          # -- kernel_patches repos (BP & WD) vs the heads recorded at build time --
          for label, repo, key in (
                  ("BP kernel_patches", os.environ["BP_PATCHES_REPO"],
                   "bp_patches_head"),
                  ("WD kernel_patches", os.environ["WD_PATCHES_REPO"],
                   "wd_patches_head")):
              pinned = pins.get(key, "")
              if not pinned:
                  notes.append(
                      f"- INFO **{label}**: no head recorded by the last "
                      "successful build (older pin store) - drift check "
                      "resumes after the next green build")
                  continue
              head, date = repo_state(repo)
              if head != pinned and advanced(repo, pinned, head):
                  drift.append(
                      f"- **{label}** drift: pinned `{pinned}` but upstream "
                      f"head is `{head}` ({date})")
              elif head != pinned:
                  notes.append(
                      f"- INFO **{label}**: pinned `{pinned}` is ahead of "
                      f"branch head `{head}` - left as is")

          # -- NoMount: pinned commit vs dev AND main heads --
          nm_repo = os.environ["NOMOUNT_REPO"]
          nm_pinned = pins.get("nomount_commit", "")
          if not nm_pinned:
              notes.append(
                  "- INFO **NoMount**: no commit recorded by the last "
                  "successful build (FinaSU builds embed NoMount in ksud)")
          else:
              for branch in ("dev", "main"):
                  head, date = repo_state(nm_repo, branch)
                  if head != nm_pinned and advanced(nm_repo, nm_pinned, head):
                      drift.append(
                          f"- **NoMount ({branch})** drift: pinned "
                          f"`{nm_pinned}` but `{branch}` head is `{head}` ({date})")

          # -- susfs4ksu: every GKI/KMI branch recorded in the pin store --
          for kmi in sorted(pins.get("susfs", {})):
              pinned = pins["susfs"][kmi]
              branch = f"gki-{kmi}"
              try:
                  c = with_retries(lambda: gitlab_api(
                      "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu"
                      f"/repository/commits?ref_name={branch}&per_page=1"),
                      tries=4, delay=10.0)
                  if not (isinstance(c, list) and c):
                      raise RuntimeError(f"no commits for ref {branch}")
                  head, date = c[0]["id"], c[0]["committed_date"]
                  if head != pinned:
                      moved = True
                      try:
                          cmp_ = with_retries(lambda: gitlab_api(
                              "https://gitlab.com/api/v4/projects/"
                              "simonpunk%2Fsusfs4ksu/repository/compare"
                              f"?from={pinned}&to={head}"))
                          moved = bool(cmp_.get("commits"))
                      except Exception:
                          pass
                      if moved:
                          drift.append(
                              f"- **susfs4ksu/{branch}** drift: pinned "
                              f"`{pinned}` but upstream head is `{head}` ({date})")
              except Exception as e:
                  notes.append(
                      f"- WARN **susfs4ksu/{branch}**: lookup failed ({e})")

          lines = drift + notes or [
              "- OK No drift - every watched ref matches the last successful build."]
          body = ("### Upstream pin watch\n\n"
                  "Compared against last successful **build-kernel-release** run on branch `"
                  + TARGET_BRANCH + "` (pins recorded "
                  + str(pins.get("recorded_at", "unknown")) + ") - "
                  + str(run.get("html_url", "")) + "\n\n"
                  + "\n".join(lines)
                  + "\n\n_Watched: BP kernel_patches, WD kernel_patches, "
                    "NoMount (dev + main), susfs4ksu (all GKI/KMI branches in "
                    "the pin store)._")

          title = "upstream-sync-monitor: susfs / kernel_patches pin drift"
          found = gh("issue", "list", "--state", "open",
                     "--search", f"{title} in:title",
                     "--json", "number", "--jq", ".[0].number").stdout.strip()
          if drift:
              if found:
                  gh("issue", "comment", found, "--body", body)
                  print(f"Updated issue #{found}")
              else:
                  gh("issue", "create", "--title", title, "--body", body)
                  print("Created new drift issue")
          elif found:
              gh("issue", "close", found,
                 "--comment", "All watched upstream refs now match the last "
                 "successful build - closing as resolved.")
              print(f"Closed issue #{found}: no drift")
          else:
              print("No drift, no open issue - nothing to do")
          print(body)
          PYEOF
  cleanup-branch:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'upstream-sync/')
    steps:
      - name: Delete merged sync branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" \
            || echo "sync branch already deleted"
