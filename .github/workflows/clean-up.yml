name: 🧹 Repo Cleanup

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to clean: all | cache | release | runs | artifacts"
        required: true
        type: choice
        default: all
        options: [all, cache, release, runs, artifacts]
      apply:
        description: "Delete for real. Unchecked = analysis only"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag holding cache assets (release scope)"
        required: true
        type: string
        default: ccache-cache
      key_filter:
        description: "Cache key must contain this, empty = all"
        required: false
        type: string
        default: ""
      prefix:
        description: "Asset name must contain this, empty = all"
        required: false
        type: string
        default: ""
      min_age_days:
        description: "Only delete older than N days, 0 = no age gate"
        required: false
        type: string
        default: "0"
      oldest_first:
        description: "Delete oldest first. Unchecked = newest first"
        required: true
        type: boolean
        default: true
      delete_count:
        description: "Stop after N deletions, 0 = unlimited"
        required: false
        type: string
        default: "0"
      keep_count:
        description: "Protect the N newest matches per store, 0 = off"
        required: false
        type: string
        default: "0"
      pin:
        description: "Never delete names containing this, empty = none"
        required: false
        type: string
        default: ""
      pin_purge:
        description: "Override protections (pin matches + last-success-pins)"
        required: true
        type: boolean
        default: false
      run_workflow:
        description: "Only runs of this workflow, or all (runs scope)"
        required: true
        type: choice
        default: all
        options:
          - all
          - build-kernel-release.yml
          - clean-up.yml
          - mirror-toolchains.yml
          - patch-hygiene.yml
          - sync-sanitize.yml
      run_status:
        description: "Which runs qualify: all | failed | unsuccessful"
        required: true
        type: choice
        default: unsuccessful
        options: [all, failed, unsuccessful]
      keep_successful:
        description: "Protect the last N successful runs per workflow, 0 = off"
        required: false
        type: string
        default: "3"

permissions:
  actions: write
  contents: write

concurrency:
  group: repo-cleanup
  cancel-in-progress: false

jobs:

  # ─────────────────────────── ANALYSE ───────────────────────────
  # One job per store: fetch the inventory, apply filters + pin/keep
  # protections, write the match set. Dry runs stop after this stage.
  analyse:
    name: 📊 Analyse (${{ matrix.store }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        store: [cache, release, runs, artifacts]
    env:
      GH_TOKEN: ${{ github.token }}
      STORE: ${{ matrix.store }}
      SCOPE: ${{ inputs.scope }}
      APPLY: ${{ inputs.apply }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      KEY_FILTER: ${{ inputs.key_filter }}
      PREFIX: ${{ inputs.prefix }}
      MIN_AGE_DAYS: ${{ inputs.min_age_days }}
      PIN: ${{ inputs.pin }}
      PIN_PURGE: ${{ inputs.pin_purge }}
      RUN_WORKFLOW: ${{ inputs.run_workflow }}
      RUN_STATUS: ${{ inputs.run_status }}
      KEEP_SUCCESSFUL: ${{ inputs.keep_successful }}
    steps:

      - name: 📊 Fetch & match — ${{ matrix.store }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ℹ️ analyse — $STORE"
          : > /tmp/matches.tsv
          : > /tmp/protected.txt

          in_scope=false
          if [ "$SCOPE" = "all" ] || [ "$SCOPE" = "$STORE" ]; then in_scope=true; fi
          if ! $in_scope; then
            echo "MATCHED=0"      > /tmp/meta.tsv
            echo "BYTES=0"       >> /tmp/meta.tsv
            echo "PROTECTED=0"   >> /tmp/meta.tsv
            echo "SCOPE_SKIP=1"  >> /tmp/meta.tsv
            echo "✅ $STORE not in scope (scope=$SCOPE) — skipped"
            exit 0
          fi

          for v in "$MIN_AGE_DAYS" "$KEEP_SUCCESSFUL"; do
            [[ "$v" =~ ^[0-9]+$ ]] || { echo "❌ numeric inputs must be integers, got: $v"; exit 1; }
          done

          cutoff=""
          if [ "$MIN_AGE_DAYS" != "0" ]; then
            cutoff="$(date -u -d "-${MIN_AGE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "ℹ️ age gate: ${cutoff:-none}"

          case "$STORE" in

            cache)
              page=1
              while :; do
                resp="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&page=${page}")" || { echo "❌ caches API call failed"; exit 1; }
                jq -e . >/dev/null 2>&1 <<<"$resp" || { echo "❌ caches API returned invalid JSON"; exit 1; }
                # NOTE: the caches endpoint returns "actions_caches", not "caches"
                jq -r '(.actions_caches // .caches // [])[] | ["cache", .id, .key, "", .size_in_bytes, .created_at, ""] | @tsv' <<<"$resp" >> /tmp/items.tsv
                n="$(jq '(.actions_caches // .caches // []) | length' <<<"$resp")"
                if [ "$n" -lt 100 ]; then break; fi
                page=$((page+1))
              done
              ;;

            release)
              rel_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null || true)"
              if [ -z "$rel_id" ]; then
                echo "ℹ️ release '${RELEASE_TAG}' not found — 0 assets"
                : > /tmp/items.tsv
              else
                : > /tmp/items.tsv
                page=1
                while :; do
                  resp="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets?per_page=100&page=${page}")" || { echo "❌ release assets API call failed"; exit 1; }
                  jq -e . >/dev/null 2>&1 <<<"$resp" || { echo "❌ release assets API returned invalid JSON"; exit 1; }
                  jq -r 'if type == "array" then .[] else empty end | ["release", .id, .name, "", .size, .created_at, ""] | @tsv' <<<"$resp" >> /tmp/items.tsv
                  n="$(jq 'if type == "array" then length else 0 end' <<<"$resp")"
                  if [ "$n" -lt 100 ]; then break; fi
                  page=$((page+1))
                done
              fi
              ;;

            artifacts)
              : > /tmp/items.tsv
              page=1
              while :; do
                resp="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")" || { echo "❌ artifacts API call failed"; exit 1; }
                jq -e . >/dev/null 2>&1 <<<"$resp" || { echo "❌ artifacts API returned invalid JSON"; exit 1; }
                # cleanup-* artifacts are this workflow's own plumbing — always ignored
                jq -r '(.artifacts // [])[] | select(.expired == false) | select(.name | startswith("cleanup-") | not) | ["artifact", .id, .name, "", .size_in_bytes, .created_at, ""] | @tsv' <<<"$resp" >> /tmp/items.tsv
                n="$(jq '(.artifacts // []) | length' <<<"$resp")"
                if [ "$n" -lt 100 ]; then break; fi
                page=$((page+1))
              done
              ;;

            runs)
              echo "${GITHUB_RUN_ID}" >> /tmp/protected.txt
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=last-success-pins&per_page=100" \
                --jq '(.artifacts // [])[] | select(.expired == false) | .workflow_run.id' >> /tmp/protected.txt 2>/dev/null || true
              : > /tmp/items.tsv
              wfs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")" || { echo "❌ workflows API call failed"; exit 1; }
              mapfile -t wf_ids < <(jq -r --arg f "$RUN_WORKFLOW" '(.workflows // [])[] | select(($f == "all") or (.path | endswith($f))) | .id' <<<"$wfs")
              for wfid in "${wf_ids[@]}"; do
                page=1
                while :; do
                  resp="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wfid}/runs?per_page=100&page=${page}")" || { echo "❌ workflow runs API call failed"; exit 1; }
                  jq -r '(.workflow_runs // [])[] | ["run", .id, ("#" + (.run_number | tostring) + " " + (.display_title // "")), (.conclusion // "null"), "0", .created_at, .path] | @tsv' <<<"$resp" >> /tmp/items.tsv
                  n="$(jq '(.workflow_runs // []) | length' <<<"$resp")"
                  if [ "$n" -lt 100 ]; then break; fi
                  page=$((page+1))
                done
              done
              if [ "$KEEP_SUCCESSFUL" != "0" ]; then
                awk -F '\t' -v n="$KEEP_SUCCESSFUL" '$1 == "run" && $4 == "success" { c[$7]++; if (c[$7] <= n) print $2 }' \
                  /tmp/items.tsv >> /tmp/protected.txt
              fi
              ;;

            *) echo "❌ unknown store: $STORE"; exit 1 ;;
          esac

          purge=0
          if [ "$PIN_PURGE" = "true" ]; then purge=1; fi

          # protected.txt holds bare ids (1 field per line); item rows have 7
          awk -F '\t' \
            -v cutoff="$cutoff" -v keyf="$KEY_FILTER" -v pre="$PREFIX" \
            -v pin="$PIN" -v purge="$purge" -v runstatus="$RUN_STATUS" '
            NF <= 1 { prot[$1] = 1; next }
            {
              store=$1; id=$2; name=$3; conc=$4; created=$6
              if (store == "cache" && keyf != "" && index(name, keyf) == 0) next
              if (store == "release" && pre != "" && index(name, pre) == 0) next
              if (cutoff != "" && created >= cutoff) next
              if (store == "run") {
                if (conc == "null" || conc == "") next
                if (runstatus == "failed" && conc != "failure") next
                if (runstatus == "unsuccessful" && conc != "failure" && conc != "cancelled" && conc != "timed_out") next
                if (id in prot) { p++; next }
              }
              if (purge != 1) {
                if (store == "artifact" && name == "last-success-pins") { p++; next }
                if (pin != "" && index(name, pin) > 0) { p++; next }
              }
              print > "/tmp/matches.tsv"
            }
            END { print p + 0 }' /tmp/protected.txt /tmp/items.tsv > /tmp/protcount.txt

          matched="$(wc -l < /tmp/matches.tsv)"
          bytes="$(awk -F '\t' '{ s += $5 } END { print s + 0 }' /tmp/matches.tsv)"
          protected="$(cat /tmp/protcount.txt)"
          gb="$(awk -v b="$bytes" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"

          {
            echo "MATCHED=${matched}"
            echo "BYTES=${bytes}"
            echo "PROTECTED=${protected}"
            echo "SCOPE_SKIP=0"
          } > /tmp/meta.tsv

          {
            echo "## 📊 Analyse — ${STORE}"
            echo ""
            echo "| id | item | size | created |"
            echo "|---|---|---|---|"
            awk -F '\t' '{ n = $3; gsub(/\|/, "/", n); item = ($1 == "run") ? n " [" $4 "] " $7 : n; printf "| %s | %s | %.2f MB | %s |\n", $2, item, $5 / 1048576, $6 }' /tmp/matches.tsv
            echo ""
            echo "Matched **${matched}** item(s), ${gb}. Protected: ${protected}."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ $STORE matched ${matched} item(s), ${gb}, protected ${protected}"

      - name: ⬆️ Upload match set — ${{ matrix.store }}
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-matches-${{ matrix.store }}
          path: |
            /tmp/matches.tsv
            /tmp/meta.tsv
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────── DELETE ───────────────────────────
  # Only with apply=true. Per store: order the plan, apply keep/cap,
  # delete, record exactly what succeeded and what did not.
  delete:
    name: 🗑️ Delete (${{ matrix.store }})
    needs: analyse
    if: ${{ inputs.apply }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: [cache, release, runs, artifacts]
    env:
      GH_TOKEN: ${{ github.token }}
      STORE: ${{ matrix.store }}
      OLDEST_FIRST: ${{ inputs.oldest_first }}
      DELETE_COUNT: ${{ inputs.delete_count }}
      KEEP_COUNT: ${{ inputs.keep_count }}
    steps:

      - name: ⬇️ Download match set — ${{ matrix.store }}
        uses: actions/download-artifact@v4
        with:
          name: cleanup-matches-${{ matrix.store }}
          path: /tmp/in

      - name: 🗑️ Delete matched — ${{ matrix.store }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ℹ️ delete — $STORE"
          src="/tmp/in/matches.tsv"

          if [ ! -s "$src" ]; then
            echo "✅ $STORE: nothing matched — nothing to delete"
            printf 'DELETED=0\nFREED=0\nFAILED=0\n' > /tmp/result.tsv
            exit 0
          fi

          if [ "$OLDEST_FIRST" = "true" ]; then
            sort -t $'\t' -k6,6 "$src" > /tmp/plan.tsv
          else
            sort -t $'\t' -k6,6r "$src" > /tmp/plan.tsv
          fi

          if [ "$KEEP_COUNT" != "0" ]; then
            if [ "$OLDEST_FIRST" = "true" ]; then
              # FNR == NR: correct file split even when both inputs are the same path
              awk -F '\t' -v n="$KEEP_COUNT" '
                FNR == NR { c[$1]++; next }
                { i[$1]++; if ($1 == "run" || i[$1] <= c[$1] - n) print }' /tmp/plan.tsv /tmp/plan.tsv > /tmp/plan2.tsv
            else
              awk -F '\t' -v n="$KEEP_COUNT" '
                FNR == NR { c[$1]++; next }
                { i[$1]++; if ($1 == "run" || i[$1] > n) print }' /tmp/plan.tsv /tmp/plan.tsv > /tmp/plan2.tsv
            fi
          else
            cp /tmp/plan.tsv /tmp/plan2.tsv
          fi

          if [ "$DELETE_COUNT" != "0" ]; then
            head -n "$DELETE_COUNT" /tmp/plan2.tsv > /tmp/planF.tsv
          else
            cp /tmp/plan2.tsv /tmp/planF.tsv
          fi

          planned="$(wc -l < /tmp/planF.tsv)"
          echo "ℹ️ $STORE: plan rows to delete: ${planned}"

          : > /tmp/deleted.tsv
          : > /tmp/failed.tsv
          deleted=0; freed=0; failed=0
          while IFS=$'\t' read -r store id name conc size created grp; do
            [ -n "${id:-}" ] || continue
            case "$store" in
              cache)    ep="repos/${GITHUB_REPOSITORY}/actions/caches/${id}" ;;
              release)  ep="repos/${GITHUB_REPOSITORY}/releases/assets/${id}" ;;
              artifact) ep="repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" ;;
              run)      ep="repos/${GITHUB_REPOSITORY}/actions/runs/${id}" ;;
              *) echo "❌ unknown store: ${store}"; exit 1 ;;
            esac
            if gh api -X DELETE "$ep" >/dev/null 2>&1; then
              printf '%s\t%s\t%s\n' "$id" "$name" "$size" >> /tmp/deleted.tsv
              deleted=$((deleted + 1))
              freed=$((freed + size))
              echo "🗑️ ${store} ${id} — ${name}"
            else
              printf '%s\t%s\t%s\n' "$id" "$name" "$store" >> /tmp/failed.tsv
              failed=$((failed + 1))
              echo "❌ ${store} ${id} — ${name}: delete failed"
            fi
          done < /tmp/planF.tsv

          gb="$(awk -v b="$freed" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"
          printf 'DELETED=%s\nFREED=%s\nFAILED=%s\n' "$deleted" "$freed" "$failed" > /tmp/result.tsv

          if [ "$failed" -gt 0 ]; then
            echo "❌ $STORE: ${failed} deletion(s) failed — deleted ${deleted}, freed ${gb}"
            exit 1
          fi
          echo "✅ $STORE: deleted ${deleted} item(s), freed ${gb}"

      - name: ⬆️ Upload result — ${{ matrix.store }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-result-${{ matrix.store }}
          path: |
            /tmp/result.tsv
            /tmp/deleted.tsv
            /tmp/failed.tsv
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────── REPORT ───────────────────────────
  # Per-store outcome matrix: matched vs deleted vs failed vs protected.
  # Runs even when the delete stage failed, and fails if any did.
  report:
    name: 📋 Report (${{ matrix.store }})
    needs: [analyse, delete]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        store: [cache, release, runs, artifacts]
    env:
      GH_TOKEN: ${{ github.token }}
      STORE: ${{ matrix.store }}
      APPLY: ${{ inputs.apply }}
    steps:

      - name: ⬇️ Download stage data — ${{ matrix.store }}
        uses: actions/download-artifact@v4
        with:
          pattern: cleanup-*-${{ matrix.store }}
          path: /tmp/in
          merge-multiple: true

      - name: 📋 Report — ${{ matrix.store }}
        shell: bash
        run: |
          set -uo pipefail
          echo "ℹ️ report — $STORE"

          if [ ! -f /tmp/in/meta.tsv ]; then
            {
              echo "## 📋 Report — ${STORE}"
              echo ""
              echo "❌ analysis stage did not produce data for this store"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ $STORE: analysis stage produced no data"
            exit 1
          fi

          matched="$(awk -F= '$1 == "MATCHED" { print $2 }' /tmp/in/meta.tsv)"
          bytes="$(awk -F= '$1 == "BYTES" { print $2 }' /tmp/in/meta.tsv)"
          protected="$(awk -F= '$1 == "PROTECTED" { print $2 }' /tmp/in/meta.tsv)"
          skip="$(awk -F= '$1 == "SCOPE_SKIP" { print $2 }' /tmp/in/meta.tsv)"
          mgb="$(awk -v b="$bytes" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"

          deleted=0; freed=0; failed=0; have_result=false
          [ "$APPLY" = "true" ] && [ -f /tmp/in/result.tsv ] && have_result=true
          if $have_result; then
            deleted="$(awk -F= '$1 == "DELETED" { print $2 }' /tmp/in/result.tsv)"
            freed="$(awk -F= '$1 == "FREED" { print $2 }' /tmp/in/result.tsv)"
            failed="$(awk -F= '$1 == "FAILED" { print $2 }' /tmp/in/result.tsv)"
          fi
          dgb="$(awk -v b="$freed" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"

          {
            echo "## 📋 Report — ${STORE}"
            echo ""
            if [ "$skip" = "1" ]; then
              echo "Not in scope — nothing analysed, nothing deleted."
            else
              echo "| matched | matched size | protected | deleted | freed | failed |"
              echo "|---|---|---|---|---|---|"
              echo "| ${matched} | ${mgb} | ${protected} | ${deleted} | ${dgb} | ${failed} |"
            fi
            if [ "$failed" -gt 0 ]; then
              echo ""
              echo "**Not deleted (failed):**"
              echo ""
              echo "| id | item | store |"
              echo "|---|---|---|"
              awk -F '\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }' /tmp/in/failed.tsv
            fi
            if [ "$APPLY" != "true" ] && [ "$skip" != "1" ]; then
              echo ""
              echo "Dry run — nothing was deleted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "❌ $STORE report: matched ${matched}, deleted ${deleted}, ${failed} failed, ${protected} protected"
            exit 1
          fi
          if [ "$APPLY" != "true" ]; then
            echo "✅ $STORE report: dry run — ${matched} matched, ${mgb}, nothing deleted"
          else
            echo "✅ $STORE report: matched ${matched}, deleted ${deleted}, freed ${dgb}, ${failed} failed, ${protected} protected"
          fi
