name: 🧹 Repo Cleanup

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to clean: all | cache | release | runs | artifacts"
        required: true
        type: choice
        default: all
        options: [all, cache, release, runs, artifacts]
      apply:
        description: "Delete for real. Unchecked = analysis only"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag holding cache assets (release scope)"
        required: true
        type: string
        default: ccache-cache
      key_filter:
        description: "Cache key must contain this, empty = all"
        required: false
        type: string
        default: ""
      prefix:
        description: "Asset name must contain this, empty = all"
        required: false
        type: string
        default: ""
      min_age_days:
        description: "Only delete older than N days, 0 = no age gate"
        required: false
        type: string
        default: "0"
      oldest_first:
        description: "Delete oldest first. Unchecked = newest first"
        required: true
        type: boolean
        default: true
      delete_count:
        description: "Stop after N deletions, 0 = unlimited"
        required: false
        type: string
        default: "0"
      keep_count:
        description: "Protect the N newest matches per store, 0 = off"
        required: false
        type: string
        default: "0"
      pin:
        description: "Never delete names containing this, empty = none"
        required: false
        type: string
        default: ""
      pin_purge:
        description: "Override protections (pin matches + last-success-pins)"
        required: true
        type: boolean
        default: false
      run_workflow:
        description: "Only runs of this workflow file, empty = all"
        required: false
        type: string
        default: ""
      run_status:
        description: "Which runs qualify: all | failed | unsuccessful"
        required: true
        type: choice
        default: unsuccessful
        options: [all, failed, unsuccessful]
      keep_successful:
        description: "Protect the last N successful runs per workflow, 0 = off"
        required: false
        type: string
        default: "3"

permissions:
  actions: write
  contents: write

concurrency:
  group: repo-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Fetch & delete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SCOPE: ${{ inputs.scope }}
      APPLY: ${{ inputs.apply }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      KEY_FILTER: ${{ inputs.key_filter }}
      PREFIX: ${{ inputs.prefix }}
      MIN_AGE_DAYS: ${{ inputs.min_age_days }}
      OLDEST_FIRST: ${{ inputs.oldest_first }}
      DELETE_COUNT: ${{ inputs.delete_count }}
      KEEP_COUNT: ${{ inputs.keep_count }}
      PIN: ${{ inputs.pin }}
      PIN_PURGE: ${{ inputs.pin_purge }}
      RUN_WORKFLOW: ${{ inputs.run_workflow }}
      RUN_STATUS: ${{ inputs.run_status }}
      KEEP_SUCCESSFUL: ${{ inputs.keep_successful }}
    steps:

      # ─────────────────────────── PHASE 1 ───────────────────────────
      # Build the full inventory, compute matches + protections, print
      # the analysis table. A dry run (apply=false) stops after this.
      - name: 📊 Phase 1 — Analyse & match (dry run stops here)
        shell: bash
        run: |
          set -euo pipefail
          echo "ℹ️ Phase 1 — analyse & match"
          : > /tmp/items.tsv
          : > /tmp/matches.tsv
          : > /tmp/protected.txt

          want_cache=false; want_release=false; want_runs=false; want_artifacts=false
          case "$SCOPE" in
            all)       want_cache=true; want_release=true; want_runs=true; want_artifacts=true ;;
            cache)     want_cache=true ;;
            release)   want_release=true ;;
            runs)      want_runs=true ;;
            artifacts) want_artifacts=true ;;
            *) echo "❌ unknown scope: $SCOPE"; exit 1 ;;
          esac

          for v in "$MIN_AGE_DAYS" "$DELETE_COUNT" "$KEEP_COUNT" "$KEEP_SUCCESSFUL"; do
            [[ "$v" =~ ^[0-9]+$ ]] || { echo "❌ numeric inputs must be integers, got: $v"; exit 1; }
          done

          cutoff=""
          if [ "$MIN_AGE_DAYS" != "0" ]; then
            cutoff="$(date -u -d "-${MIN_AGE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "ℹ️ scope: $SCOPE · apply: $APPLY · age gate: ${cutoff:-none}"

          if $want_cache; then
            page=1
            while :; do
              resp="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&page=${page}")" || { echo "❌ caches API call failed"; exit 1; }
              jq -e . >/dev/null 2>&1 <<<"$resp" || { echo "❌ caches API returned invalid JSON"; exit 1; }
              # NOTE: the caches endpoint returns "actions_caches", not "caches"
              jq -r '(.actions_caches // .caches // [])[] | ["cache", .id, .key, "", .size_in_bytes, .created_at, ""] | @tsv' <<<"$resp" >> /tmp/items.tsv
              n="$(jq '(.actions_caches // .caches // []) | length' <<<"$resp")"
              if [ "$n" -lt 100 ]; then break; fi
              page=$((page+1))
            done
            echo "✅ actions/cache entries: $(grep -c $'^cache\t' /tmp/items.tsv || true)"
          fi

          if $want_release; then
            rel_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null || true)"
            if [ -z "$rel_id" ]; then
              echo "ℹ️ release '${RELEASE_TAG}' not found — 0 assets"
            else
              page=1
              while :; do
                resp="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets?per_page=100&page=${page}")" || { echo "❌ release assets API call failed"; exit 1; }
                jq -e . >/dev/null 2>&1 <<<"$resp" || { echo "❌ release assets API returned invalid JSON"; exit 1; }
                jq -r 'if type == "array" then .[] else empty end | ["release", .id, .name, "", .size, .created_at, ""] | @tsv' <<<"$resp" >> /tmp/items.tsv
                n="$(jq 'if type == "array" then length else 0 end' <<<"$resp")"
                if [ "$n" -lt 100 ]; then break; fi
                page=$((page+1))
              done
              echo "✅ release ${RELEASE_TAG} assets: $(grep -c $'^release\t' /tmp/items.tsv || true)"
            fi
          fi

          if $want_artifacts; then
            page=1
            while :; do
              resp="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")" || { echo "❌ artifacts API call failed"; exit 1; }
              jq -e . >/dev/null 2>&1 <<<"$resp" || { echo "❌ artifacts API returned invalid JSON"; exit 1; }
              jq -r '(.artifacts // [])[] | select(.expired == false) | ["artifact", .id, .name, "", .size_in_bytes, .created_at, ""] | @tsv' <<<"$resp" >> /tmp/items.tsv
              n="$(jq '(.artifacts // []) | length' <<<"$resp")"
              if [ "$n" -lt 100 ]; then break; fi
              page=$((page+1))
            done
            echo "✅ live artifacts: $(grep -c $'^artifact\t' /tmp/items.tsv || true)"
          fi

          if $want_runs; then
            echo "${GITHUB_RUN_ID}" >> /tmp/protected.txt
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=last-success-pins&per_page=100" \
              --jq '(.artifacts // [])[] | select(.expired == false) | .workflow_run.id' >> /tmp/protected.txt 2>/dev/null || true
            wfs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100")" || { echo "❌ workflows API call failed"; exit 1; }
            mapfile -t wf_ids < <(jq -r --arg f "$RUN_WORKFLOW" '(.workflows // [])[] | select(.path | contains($f)) | .id' <<<"$wfs")
            for wfid in "${wf_ids[@]}"; do
              page=1
              while :; do
                resp="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wfid}/runs?per_page=100&page=${page}")" || { echo "❌ workflow runs API call failed"; exit 1; }
                jq -r '(.workflow_runs // [])[] | ["run", .id, ("#" + (.run_number | tostring) + " " + (.display_title // "")), (.conclusion // "null"), "0", .created_at, .path] | @tsv' <<<"$resp" >> /tmp/items.tsv
                n="$(jq '(.workflow_runs // []) | length' <<<"$resp")"
                if [ "$n" -lt 100 ]; then break; fi
                page=$((page+1))
              done
            done
            echo "✅ runs: $(grep -c $'^run\t' /tmp/items.tsv || true)"
            if [ "$KEEP_SUCCESSFUL" != "0" ]; then
              awk -F '\t' -v n="$KEEP_SUCCESSFUL" '$1 == "run" && $4 == "success" { c[$7]++; if (c[$7] <= n) print $2 }' \
                /tmp/items.tsv >> /tmp/protected.txt
            fi
          fi

          purge=0
          if [ "$PIN_PURGE" = "true" ]; then purge=1; fi

          # protections counted: p++ on every protection-driven skip
          prot="$(awk -F '\t' \
            -v cutoff="$cutoff" -v keyf="$KEY_FILTER" -v pre="$PREFIX" \
            -v pin="$PIN" -v purge="$purge" -v runstatus="$RUN_STATUS" '
            FILENAME == ARGV[1] { prot[$1] = 1; next }
            {
              store=$1; id=$2; name=$3; conc=$4; created=$6
              if (store == "cache" && keyf != "" && index(name, keyf) == 0) next
              if (store == "release" && pre != "" && index(name, pre) == 0) next
              if (cutoff != "" && created >= cutoff) next
              if (store == "run") {
                if (conc == "null" || conc == "") next
                if (runstatus == "failed" && conc != "failure") next
                if (runstatus == "unsuccessful" && conc != "failure" && conc != "cancelled" && conc != "timed_out") next
                if (id in prot) { p++; next }
              }
              if (purge != 1) {
                if (store == "artifact" && name == "last-success-pins") { p++; next }
                if (pin != "" && index(name, pin) > 0) { p++; next }
              }
              print > "/tmp/matches.tsv"
            }
            END { print p + 0 }' /tmp/protected.txt /tmp/items.tsv)"

          total_items="$(wc -l < /tmp/matches.tsv)"
          total_bytes="$(awk -F '\t' '{ s += $5 } END { print s + 0 }' /tmp/matches.tsv)"
          total_gb="$(awk -v b="$total_bytes" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"

          {
            echo "## 📊 Phase 1 — analysis"
            echo ""
            echo "Scope: ${SCOPE} · apply: ${APPLY} · age gate: ${cutoff:-none}"
            echo ""
            echo "| store | id | item | size | created |"
            echo "|---|---|---|---|---|"
            awk -F '\t' '{ n = $3; gsub(/\|/, "/", n); item = ($1 == "run") ? n " [" $4 "] " $7 : n; printf "| %s | %s | %s | %.2f MB | %s |\n", $1, $2, item, $5 / 1048576, $6 }' /tmp/matches.tsv
            echo ""
            echo "Matched **${total_items}** item(s), ${total_gb}. Protected by pin/keep rules: ${prot}."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ matched ${total_items} item(s), ${total_gb}, protected ${prot}"

          {
            echo "MATCHED_COUNT=${total_items}"
            echo "MATCHED_BYTES=${total_bytes}"
            echo "PROTECTED_COUNT=${prot}"
          } >> "$GITHUB_ENV"

          if [ "$APPLY" != "true" ]; then
            echo "✅ dry run (apply=false) — stopping before deletion"
          fi

      # ─────────────────────────── PHASE 2 ───────────────────────────
      # Only runs when apply=true. Orders the plan, applies keep/cap,
      # deletes and records exactly what succeeded and what did not.
      - name: 🗑️ Phase 2 — Delete matched items
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ℹ️ Phase 2 — apply deletions"
          if [ ! -s /tmp/matches.tsv ]; then
            echo "✅ nothing matched — nothing to delete"
            exit 0
          fi

          if [ "$OLDEST_FIRST" = "true" ]; then
            sort -t $'\t' -k6,6 /tmp/matches.tsv > /tmp/plan.tsv
          else
            sort -t $'\t' -k6,6r /tmp/matches.tsv > /tmp/plan.tsv
          fi

          if [ "$KEEP_COUNT" != "0" ]; then
            if [ "$OLDEST_FIRST" = "true" ]; then
              awk -F '\t' -v n="$KEEP_COUNT" '
                FILENAME == ARGV[1] { c[$1]++; next }
                { i[$1]++; if ($1 == "run" || i[$1] <= c[$1] - n) print }' /tmp/plan.tsv /tmp/plan.tsv > /tmp/plan2.tsv
            else
              awk -F '\t' -v n="$KEEP_COUNT" '
                FILENAME == ARGV[1] { c[$1]++; next }
                { i[$1]++; if ($1 == "run" || i[$1] > n) print }' /tmp/plan.tsv /tmp/plan.tsv > /tmp/plan2.tsv
            fi
          else
            cp /tmp/plan.tsv /tmp/plan2.tsv
          fi

          if [ "$DELETE_COUNT" != "0" ]; then
            head -n "$DELETE_COUNT" /tmp/plan2.tsv > /tmp/planF.tsv
          else
            cp /tmp/plan2.tsv /tmp/planF.tsv
          fi

          : > /tmp/deleted.tsv
          : > /tmp/failed.tsv
          deleted=0; freed=0; failed=0
          while IFS=$'\t' read -r store id name conc size created grp; do
            [ -n "${id:-}" ] || continue
            case "$store" in
              cache)    ep="repos/${GITHUB_REPOSITORY}/actions/caches/${id}" ;;
              release)  ep="repos/${GITHUB_REPOSITORY}/releases/assets/${id}" ;;
              artifact) ep="repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" ;;
              run)      ep="repos/${GITHUB_REPOSITORY}/actions/runs/${id}" ;;
              *) echo "❌ unknown store: ${store}"; exit 1 ;;
            esac
            if gh api -X DELETE "$ep" >/dev/null 2>&1; then
              printf '%s\t%s\t%s\n' "$id" "$name" "$size" >> /tmp/deleted.tsv
              deleted=$((deleted + 1))
              freed=$((freed + size))
              echo "🗑️ ${store} ${id} — ${name}"
            else
              printf '%s\t%s\t%s\n' "$id" "$name" "$store" >> /tmp/failed.tsv
              failed=$((failed + 1))
              echo "❌ ${store} ${id} — ${name}: delete failed"
            fi
          done < /tmp/planF.tsv

          gb="$(awk -v b="$freed" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"
          if [ "$failed" -gt 0 ]; then
            echo "❌ ${failed} deletion(s) failed — deleted ${deleted}, freed ${gb}"
            exit 1
          fi
          echo "✅ deleted ${deleted} item(s), freed ${gb}"

      # ─────────────────────────── PHASE 3 ───────────────────────────
      # Final report: what got deleted, what did not, and why.
      - name: 📋 Phase 3 — Final report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "ℹ️ Phase 3 — final report"
          if [ ! -f /tmp/matches.tsv ]; then
            echo "❌ phase 1 did not complete — no report data"
            exit 1
          fi

          matched="${MATCHED_COUNT:-$(wc -l < /tmp/matches.tsv)}"
          mbytes="${MATCHED_BYTES:-0}"
          mgb="$(awk -v b="$mbytes" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"
          protected="${PROTECTED_COUNT:-0}"
          mode="apply"
          [ "${APPLY:-false}" != "true" ] && mode="dry run"

          deleted=0; freed=0; failed=0
          [ -f /tmp/deleted.tsv ] && deleted="$(wc -l < /tmp/deleted.tsv)"
          [ -f /tmp/deleted.tsv ] && freed="$(awk -F '\t' '{ s += $3 } END { print s + 0 }' /tmp/deleted.tsv)"
          [ -f /tmp/failed.tsv ] && failed="$(wc -l < /tmp/failed.tsv)"
          dgb="$(awk -v b="$freed" 'BEGIN { printf "%.2f GB", b / 1073741824 }')"

          {
            echo "## 📋 Phase 3 — final report"
            echo ""
            echo "Mode: **${mode}**"
            echo ""
            echo "| outcome | count | size |"
            echo "|---|---|---|"
            echo "| matched | ${matched} | ${mgb} |"
            echo "| deleted | ${deleted} | ${dgb} |"
            echo "| failed | ${failed} | — |"
            echo "| protected (pin/keep rules) | ${protected} | — |"
            if [ "$failed" -gt 0 ]; then
              echo ""
              echo "**Not deleted (failed):**"
              echo ""
              echo "| id | item | store |"
              echo "|---|---|---|"
              awk -F '\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }' /tmp/failed.tsv
            fi
            if [ "$mode" = "dry run" ]; then
              echo ""
              echo "Dry run — the ${matched} matched item(s) above were left untouched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "❌ final report: ${deleted} deleted, ${dgb} freed, ${failed} failed, ${protected} protected"
            exit 1
          fi
          if [ "$mode" = "dry run" ]; then
            echo "✅ final report: dry run — ${matched} matched, ${mgb}, nothing deleted"
          else
            echo "✅ final report: ${deleted} deleted, ${dgb} freed, ${failed} failed, ${protected} protected"
          fi
