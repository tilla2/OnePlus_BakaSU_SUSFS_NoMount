name: Sync Sanitize (post-merge oos→a normalization)

# One-click post-merge normalization after an upstream (WildKernels) merge.
# Runs scripts/sync/sanitize.py, which only ever maps oos -> a, strips
# branded unames, enforces the ChimeraKernel root_tag and re-applies the
# fork transforms. This workflow NEVER pushes and never opens PRs: it
# reports (dry run) or shows the diff (apply) — the maintainer commits.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: report what would change, write nothing (uncheck to apply in the runner and publish the diff)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: sync-sanitize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanitize:
    name: 🧽 Sanitize tree (${{ inputs.dry_run && 'dry run' || 'apply' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🧽 Run sanitizer
        id: run
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if ! python3 scripts/sync/sanitize.py "${args[@]}" \
                --report sanitize-report.txt --diff sanitize-changes.diff; then
            echo "::error::Sanitizer failed — see the log above"
            exit 1
          fi
          if [ ! -s sanitize-report.txt ] || [ ! -s sanitize-report.json ]; then
            echo "::error::Sanitizer did not produce its report files"
            exit 1
          fi
          if [ -s sanitize-changes.diff ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi
          echo "✅ Sanitizer run complete (dry_run=${DRY_RUN})"

      - name: 🔍 Working-tree changes (apply mode)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git add -A -- . ':!sanitize-report.txt' ':!sanitize-report.json' ':!sanitize-changes.diff'
          echo "Files changed by the sanitizer (NOT committed — this workflow never pushes):"
          git diff --cached --stat || true
          echo "✅ Change listing complete — commit the published diff locally"

      - name: 📤 Upload report
        if: ${{ always() && hashFiles('sanitize-report.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sanitize-report
          path: sanitize-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload diff
        if: ${{ steps.run.outputs.has_diff == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sanitize-changes
          path: sanitize-changes.diff
          if-no-files-found: error
          retention-days: 30

      - name: 📝 Job summary
        if: ${{ always() && hashFiles('sanitize-report.json') != '' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          c() { jq -r --arg k "$1" '.[$k] // 0' sanitize-report.json; }
          total=$(jq '[.[]] | add // 0' sanitize-report.json)
          {
            echo "## 🧽 Sync sanitizer"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Mode | $([ "$DRY_RUN" = "true" ] && echo 'dry run (nothing written)' || echo 'apply (runner only, never pushed)') |"
            echo "| Direction | oos → a only |"
            echo
            echo "| Count | Value |"
            echo "|---|---:|"
            echo "| Paths renamed | $(c paths_renamed) |"
            echo "| Configs rewritten | $(c configs_rewritten) |"
            echo "| os_version values changed | $(c os_versions_changed) |"
            echo "| Unames stripped | $(c unames_stripped) |"
            echo "| root_tag set to ChimeraKernel | $(c root_tags_set) |"
            echo "| Manifests rewritten | $(c manifests_rewritten) |"
            echo "| Build action rewritten | $(c action_rewritten) |"
            echo "| Files deleted | $(c files_deleted) |"
            echo
            if [ "$total" -eq 0 ]; then
              echo "✅ **No changes needed** — the tree is already sanitized."
            else
              echo "⚠️ **${total} change(s)** — download the \`sanitize-changes\` artifact (diff) and \`sanitize-report\`, apply locally and commit on a working branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Summary written (total changes: ${total})"
