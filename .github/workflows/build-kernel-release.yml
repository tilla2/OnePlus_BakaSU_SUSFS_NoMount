name: Build and Release OnePlus Kernels (The-Big-One)

permissions:
  contents: write
  actions: write

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: "build" compiles and uploads artifacts; "build + release" also publishes a release; "build + release + bump increment" also bumps the -r tag increment; "patch dry run" applies every patch, uploads a verdict per device and skips compilation (never releases)'
        required: true
        type: choice
        options:
          - build
          - build + release
          - build + release + bump increment
          - patch dry run
        default: build
      op_model:
        description: 'Select the OnePlus kernels to build'
        required: true
        type: choice
        options:
          - A14+A15+A16
          - A15+A16
          - A14+A15
          - A16
          - A15
          - A14
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android12-5.10
        default: A14+A15+A16
      device_a14:
        description: 'Device menu (optional): pick ONE config from configs/a14/; "none" = unused. Any explicit device selection (menus and/or config_paths) overrides the op_model tree filter'
        required: false
        type: choice
        default: none
        options:
          - none
          - OP-ACE
          - OP-ACE-2V
          - OP-ACE-3-PRO
          - OP-ACE-RACE
          - OP-NORD-3
          - OP-PAD-GO
          - OP-PAD-MT6983
          - OP-PAD-PRO
          - OP10pro
          - OP10r
          - OP11
          - OP11r
          - OP12
      device_a15:
        description: 'Device menu (optional): pick ONE config from configs/a15/; "none" = unused. Any explicit device selection (menus and/or config_paths) overrides the op_model tree filter'
        required: false
        type: choice
        default: none
        options:
          - none
          - OP-ACE
          - OP-ACE-2
          - OP-ACE-2-5.10.209
          - OP-ACE-2-PRO
          - OP-ACE-2-PRO-5.15.149
          - OP-ACE-2V
          - OP-ACE-2V-5.10.209
          - OP-ACE-3
          - OP-ACE-3-5.15.149
          - OP-ACE-3-PRO
          - OP-ACE-3-PRO-6.1.75
          - OP-ACE-3V
          - OP-ACE-3V-6.1.75
          - OP-ACE-5
          - OP-ACE-5-6.1.75
          - OP-ACE-5-PRO
          - OP-ACE-5-PRO-6.6.30
          - OP-ACE-5-RACE
          - OP-ACE-5-ULTRA
          - OP-ACE-5-ULTRA-6.6.50
          - OP-ACE-5.10.209
          - OP-ACE-5.10.226
          - OP-ACE-RACE
          - OP-ACE-RACE-5.10.209
          - OP-ACE-RACE-5.10.226
          - OP-NORD-3
          - OP-NORD-3-5.10.209
          - OP-NORD-4
          - OP-NORD-4-6.1.75
          - OP-NORD-4-CE
          - OP-NORD-4-CE-5.15.149
          - OP-NORD-4-CE-5.15.167
          - OP-NORD-5
          - OP-NORD-CE-5
          - OP-NORD-CE4-LITE
          - OP-NORD-N30-SE
          - OP-OPEN
          - OP-OPEN-5.15.149
          - OP-PAD-2-PRO
          - OP-PAD-2-PRO-6.6.30
          - OP-PAD-2-SM8650
          - OP-PAD-2-SM8650-6.1.75
          - OP-PAD-3-MT6897
          - OP-PAD-3-MT6897-6.1.75
          - OP-PAD-3-SM8750
          - OP-PAD-3-SM8750-6.6.30
          - OP-PAD-LITE
          - OP-PAD-MT6983
          - OP-PAD-MT6983-5.10.209
          - OP-PAD-PRO
          - OP-PAD-PRO-6.1.75
          - OP10pro
          - OP10pro-5.10.209
          - OP10r
          - OP10t
          - OP10t-5.10.209
          - OP10t-5.10.226
          - OP11
          - OP11-5.15.149
          - OP11r
          - OP11r-5.10.209
          - OP12
          - OP12-6.1.75
          - OP12r
          - OP12r-5.15.149
          - OP13-6.6.30
          - OP13-CPH
          - OP13-CPH-6.6.56
          - OP13-PJZ
          - OP13S
          - OP13T
          - OP13T-6.6.56
          - OP13r
          - OP13r-6.1.75
      device_a16:
        description: 'Device menu (optional): pick ONE config from configs/a16/; "none" = unused. Any explicit device selection (menus and/or config_paths) overrides the op_model tree filter'
        required: false
        type: choice
        default: none
        options:
          - none
          - OP-ACE-2
