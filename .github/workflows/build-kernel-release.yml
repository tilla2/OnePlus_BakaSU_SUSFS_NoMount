          - OP12r
          - OP12r-5.15.167
          - OP13
          - OP13-6.6.89
          - OP13S
          - OP13T
          - OP13T-6.6.89
          - OP13r
          - OP13r-6.1.118
          - OP15
          - OP15-6.12.58
          - OP15T
          - OP15r
          - Myron
      config_paths:
        description: 'Optional extra device config path(s) for multi-device builds — comma, semicolon or space separated, e.g. a16/OP15.json, a15/OP13.json (full configs/… paths also accepted, .json optional). Deduplicated and combined with the device menus'
        required: false
        type: string
        default: ''
      ksu_type:
        description: 'Select KSU Type'
        required: true
        type: choice
        options:
          - KSUN
          - BakaSU
          - KSU
        default: BakaSU
      ksu_branch_or_hash:
        description: 'KSU branch or commit hash'
        type: string
        default: 'main'
      pin_last_success:
        description: 'Same as last successful run — uses the refs recorded by the last fully successful build and fails loudly if none exist yet. KSU: pin wins over ksu_branch_or_hash, but only when the stored pin was recorded for the same KSU type; susfs: per-KMI SUSFS commit for every KMI whose ref field is empty. NoMount is pinned via nomount_source=pin, not here (both = ksu+susfs)'
        required: false
        type: choice
        options:
          - none
          - ksu
          - susfs
          - both
        default: none
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      build_profile:
        description: 'Build profile: "standard" keeps ccache and quiet logs, "clean" disables ccache, "debug" dumps debug artifacts and verbose logs, "clean + debug" does both'
        required: true
        type: choice
        options:
          - standard
          - clean
          - debug
          - clean + debug
        default: standard
      mirror_toolchains:
        description: 'Do you want to sync toolchains before build? [99% runs not required]'
        required: false
        type: boolean
        default: false
      build_timestamp:
        description: 'Custom kernel build timestamp for uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty for current time.'
        type: string
        default: ''
      android12-5_10_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android12-5.10'
        type: string
        default: ''
      android13-5_15_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android13-5.15'
        type: string
        default: ''
      android14-6_1_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android14-6.1'
        type: string
        default: ''
      android15-6_6_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android15-6.6'
        type: string
        default: ''
      android16-6_12_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android16-6.12'
        type: string
        default: ''
      android12-5_10_custom_uname:
        description: 'Optional uname suffix override for android12-5.10 devices whose config has no uname (max 44 chars). Leave empty to use per-config uname, falling back to an OEM-like generated suffix.'
        required: false
        type: string
        default: ''
      android13-5_15_custom_uname:
        description: 'Optional uname suffix override for android13-5.15 devices whose config has no uname (max 44 chars). Leave empty to use per-config uname, falling back to an OEM-like generated suffix.'
        required: false
        type: string
        default: ''
      android14-6_1_custom_uname:
        description: 'Optional uname suffix override for android14-6.1 devices whose config has no uname (max 44 chars). Leave empty to use per-config uname, falling back to an OEM-like generated suffix.'
        required: false
        type: string
        default: ''
      android15-6_6_custom_uname:
        description: 'Optional uname suffix override for android15-6.6 devices whose config has no uname (max 44 chars). Leave empty to use per-config uname, falling back to an OEM-like generated suffix.'
        required: false
        type: string
        default: ''
      android16-6_12_custom_uname:
        description: 'Optional uname suffix override for android16-6.12 devices whose config has no uname (max 44 chars). Leave empty to use per-config uname, falling back to an OEM-like generated suffix.'
        required: false
        type: string
        default: ''
      nomount_source:
        description: 'NoMount source: HEAD of dev, HEAD of master, or the last-successful-run pin (ignored when nomount_commit is set)'
        type: choice
        options:
          - dev
          - master
          - pin
        default: 'dev'
      nomount_commit:
        description: 'Optional explicit NoMount commit SHA — wins over nomount_source, including pin'
        type: string
        default: ''

jobs:
  set-op-model:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix-final.outputs.matrix }}
      device_count: ${{ steps.set-matrix-final.outputs.count }}
      active_gki_keys: ${{ steps.set-matrix-final.outputs.active_gki_keys }}
      susfs_hash_android12_5_10: ${{ steps.set-matrix-final.outputs.susfs_hash_android12_5_10 }}
      susfs_hash_android13_5_15: ${{ steps.set-matrix-final.outputs.susfs_hash_android13_5_15 }}
      susfs_hash_android14_6_1:  ${{ steps.set-matrix-final.outputs.susfs_hash_android14_6_1 }}
      susfs_hash_android15_6_6:  ${{ steps.set-matrix-final.outputs.susfs_hash_android15_6_6 }}
      susfs_hash_android16_6_12: ${{ steps.set-matrix-final.outputs.susfs_hash_android16_6_12 }}
      ksu_resolved_hash:    ${{ steps.set-matrix-final.outputs.ksu_resolved_hash }}
      susfs_base_version: ${{ steps.set-matrix-final.outputs.susfs_base_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
            scripts/uname/
          sparse-checkout-cone-mode: false

      - name: 🔍 Select devices & filter configs
        id: select-devices
        shell: bash
        run: |
          set -euo pipefail
          echo "skip_build=false" >> "$GITHUB_ENV"
          echo "::group::Matrix generation"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "✅ Push event — build-kernel-release is dispatch-only, skipping with an empty matrix"
            echo "skip_build=true" >> "$GITHUB_ENV"
            echo "::endgroup::"
            exit 0
          fi

          input="${{ inputs.op_model }}"
          device_a14="${{ inputs.device_a14 }}"
          device_a15="${{ inputs.device_a15 }}"
          device_a16="${{ inputs.device_a16 }}"
          config_paths="${{ inputs.config_paths }}"
          ksu_type="${{ inputs.ksu_type }}"
          ksu_hash="${{ inputs.ksu_branch_or_hash }}"

          echo "[" > matrix.json

          declare -a selected=()
          for spec in "a14|${device_a14}" "a15|${device_a15}" "a16|${device_a16}"; do
            tree="${spec%%|*}"
            dev="${spec#*|}"
            if [ -z "$dev" ]; then dev="none"; fi
            if [ "$dev" != "none" ]; then
              selected+=("configs/${tree}/${dev}.json")
            fi
          done
          if [ -n "$config_paths" ]; then
            config_paths="${config_paths//$'\r'/ }"
            config_paths="${config_paths//$'\n'/ }"
            IFS=$',; \t' read -r -a extra_paths <<< "$config_paths"
            for p in "${extra_paths[@]}"; do
              if [ -z "$p" ]; then continue; fi
              p="${p#configs/}"
              if [[ "$p" != *.json ]]; then p="${p}.json"; fi
              selected+=("configs/${p}")
            done
          fi
          if [ "${#selected[@]}" -gt 0 ]; then
            mapfile -t selected < <(printf '%s\n' "${selected[@]}" | awk '!seen[$0]++')
            for f in "${selected[@]}"; do
              if [[ "$f" == *".."* || ! -f "$f" ]]; then
                echo "::error::Unknown device config '$f' — pick from the device menus or use an existing configs/a<NN>/<device>.json path. Valid configs:"
                find configs/ -name "*.json" | sort
                exit 1
              fi
            done
            all_json_files=("${selected[@]}")
            input="EXPLICIT_SELECTION"
            echo "✅ Explicit device selection: ${#selected[@]} device(s), op_model filter skipped"
            printf '  - %s\n' "${all_json_files[@]}"
          else
            mapfile -t all_json_files < <(find configs/ -name "*.json" -print0 | xargs -0 -n1)
          fi
          for i in "${!all_json_files[@]}"; do
            file="${all_json_files[$i]}"
            if [ -f "$file" ]; then
              jq -r '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json

          jq_filter="."

          case "$input" in
            EXPLICIT_SELECTION)
              ;;
            A14+A15+A16)
              ;;
            A15+A16)
              jq_filter="map(select(.os_version == \"A15\" or .os_version == \"A16\"))"
              ;;
            A14+A15)
              jq_filter="map(select(.os_version == \"A14\" or .os_version == \"A15\"))"
              ;;
            A16)
              jq_filter="map(select(.os_version == \"A16\"))"
              ;;
            A15)
              jq_filter="map(select(.os_version == \"A15\"))"
              ;;
            A14)
              jq_filter="map(select(.os_version == \"A14\"))"
              ;;
            android*-*.*)
              IFS='-' read -r av kv <<< "$input"

              jq_filter="map(select(.os_version == \"A15\" or .os_version == \"A16\")) | map(select(.android_version == \"$av\" and .kernel_version == \"$kv\"))"

              echo "ℹ️  Android-Kernel filter applied: $av-$kv"
              echo "   Restricted to: A15 and A16 only"
              ;;
            *)
              echo "::warning::Unknown input '$input'. Using empty filter."
              jq_filter="map(select(false))"
              ;;
          esac

          filtered=$(jq -c "$jq_filter" matrix.json)
          count=$(jq 'length' <<<"$filtered")

          filtered=$(echo "$filtered" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber) * -1,
              .model
            )
          ')

          if [ "$count" -eq 0 ]; then
            echo "::error::No config files found for input '$input' after applying filters!"
            echo ""
            echo "Available configurations:"
            jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version))"' matrix.json
            exit 1
          fi

          merged_matrix=$(jq \
            --arg ksu_type "$ksu_type" \
            --arg ksu_hash "$ksu_hash" \
            '[.[] | . + {ksu_type: $ksu_type, ksu_hash: $ksu_hash}]' \
            <<<"$filtered")
          final_count=$(echo "$merged_matrix" | jq 'length')

          echo "✅ Found $final_count device(s) to build"
          echo ""
          echo "Selected devices:"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<<"$merged_matrix"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$merged_matrix" > filtered_matrix.json
          echo "::endgroup::"
          echo "✅ Device selection complete: $final_count device(s) saved to filtered_matrix.json"

      - name: 📌 Resolve pins, SUSFS & unames → final matrix
        id: set-matrix-final
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Pin store, SUSFS & uname resolution"

          if [ "${{ env.skip_build }}" = "true" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            echo "✅ Push event — empty matrix emitted, downstream jobs will skip"
            exit 0
          fi

          merged_matrix="$(cat filtered_matrix.json)"
          echo "count=$(jq length <<<"$merged_matrix")" >> "$GITHUB_OUTPUT"

          ksu_type="${{ inputs.ksu_type }}"
          ksu_ref="${{ inputs.ksu_branch_or_hash }}"

          # ── Load "last successful run" pin store (artifact 'last-success-pins') ──
          PINS_JSON="{}"
          if [ "${{ inputs.pin_last_success }}" != "none" ]; then
            pins_art="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=last-success-pins&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty' 2>/dev/null || true)"
            if [ -z "$pins_art" ]; then
              pins_art="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pins.json&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty' 2>/dev/null || true)"
            fi
            if [ -n "$pins_art" ]; then
              rm -rf pins_store && mkdir -p pins_store
              gh api "repos/${{ github.repository }}/actions/artifacts/$pins_art/zip" > pins_store/dl.bin 2>/dev/null || true
              if [ "$(head -c 2 pins_store/dl.bin 2>/dev/null)" = "PK" ]; then
                unzip -oq pins_store/dl.bin -d pins_store || true
              else
                mv pins_store/dl.bin pins_store/last-success-pins 2>/dev/null || true
              fi
              pins_raw="$(cat pins_store/last-success-pins 2>/dev/null || true)"
              [ -n "$pins_raw" ] || pins_raw="$(cat pins_store/pins.json 2>/dev/null || true)"
              if [ -n "$pins_raw" ] && echo "$pins_raw" | jq -e . >/dev/null 2>&1; then
                PINS_JSON="$pins_raw"
                echo "📌 Pin store loaded from artifact $pins_art: $(jq -c . <<<"$pins_raw")"
              fi
              rm -rf pins_store
            else
              echo "ℹ️  No pins stored yet (no live 'last-success-pins' artifact) — pin toggles fail loudly until a first successful build records one"
            fi
          else
            echo "ℹ️  pin_last_success=none — pin store not read"
          fi

          # ── Root manager: pin (type-locked to the stored KSU type) > dispatch ref > auto (HEAD of the type default branch) ──
          if [ "${{ (inputs.pin_last_success == 'both' || inputs.pin_last_success == 'ksu') }}" = "true" ]; then
            stored_ksu_type="$(jq -r '.ksu_type // empty' <<<"$PINS_JSON")"
            stored_ksu_sha="$(jq -r '.ksu_sha // empty' <<<"$PINS_JSON")"
            if [ -z "$stored_ksu_sha" ]; then
              echo "::error::KSU pin requested but no last-successful Root-manager pin exists yet (pin store missing/empty). Run once with explicit refs to seed it."
              exit 1
            fi
            if [ "$stored_ksu_type" != "$ksu_type" ]; then
              echo "⚠️  KSU pin ignored: stored pin is for $stored_ksu_type, this run selects $ksu_type — pin is type-locked, falling back to dispatch/auto"
            else
              echo "📌 KSU pin: $ksu_type → $stored_ksu_sha (last successful run)"
              [ -z "$ksu_ref" ] || echo "   ksu_branch_or_hash '$ksu_ref' is moot while the pin applies"
              ksu_ref="$stored_ksu_sha"
            fi
          fi
          if [ -z "$ksu_ref" ]; then
            ksu_ref="main"
            echo "ℹ️  No KSU ref at dispatch and no applicable pin — auto: HEAD of 'main' for $ksu_type"
          fi

          if [ "$ksu_type" == "BakaSU" ]; then
            KSU_REPO_OWNER="Baka-SU"
            KSU_REPO_NAME="BakaSU"
          elif [ "$ksu_type" == "KSUN" ]; then
            KSU_REPO_OWNER="KernelSU-Next"
            KSU_REPO_NAME="KernelSU-Next"
          else
            KSU_REPO_OWNER="tiann"
            KSU_REPO_NAME="KernelSU"
          fi

          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"

          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5 # Seconds to wait between retries

          echo "Resolving $ksu_type hash ($ksu_ref)..."

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            RESULT=$(gh api graphql -f query="$QUERY" -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" -f headRef="$HEAD_REF" -f tagRef="$TAG_REF" -f objRef="$ksu_ref" 2>/dev/null)
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ] && [ ! -z "$RESULT" ]; then
              echo "  ✅ API Success"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "::error::GitHub API unreachable. Cannot validate $ksu_ref"
            exit 1
          fi

          resolved_sha=$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")')

          if [ "$resolved_sha" == "unknown" ]; then
            echo "::error::Ref/Hash '$ksu_ref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
            exit 1
          fi

          echo "  ✅ Resolved: $ksu_type/$ksu_ref → $resolved_sha"
          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"

          merged_matrix=$(echo "$merged_matrix" | jq  --arg resolved_sha "$resolved_sha" 'map(.ksu_resolved_hash = $resolved_sha)')

          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"

          declare -A default_branches=(
            ["android12-5.10"]="gki-android12-5.10"
            ["android13-5.15"]="gki-android13-5.15"
            ["android14-6.1"]="gki-android14-6.1"
            ["android15-6.6"]="gki-android15-6.6"
            ["android16-6.12"]="gki-android16-6.12"
          )

          declare -A user_inputs=(
            ["android12-5.10"]="${{ inputs.android12-5_10_susfs_branch_or_commit }}"
            ["android13-5.15"]="${{ inputs.android13-5_15_susfs_branch_or_commit }}"
            ["android14-6.1"]="${{ inputs.android14-6_1_susfs_branch_or_commit }}"
            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"
            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"
          )

          mapfile -t active_keys < <(
            echo "$merged_matrix" \
              | jq -r '.[] | select(.susfs == true) | "\(.android_version)-\(.kernel_version)"' \
              | sort -u
          )

          echo "🔍 Resolving SUSFS hashes for: ${active_keys[*]:-none}"

          declare -A susfs_hashes
          declare -A susfs_versions_per_key
          SUSFS_CLONE_REPO=""

          for key in "${active_keys[@]}"; do
            default_val="${default_branches[$key]}"
            user_val="${user_inputs[$key]:-$default_val}"
            # ── SUSFS: "same as last successful run" for this GKI/KMI ──
            if [ "${{ (inputs.pin_last_success == 'both' || inputs.pin_last_success == 'susfs') }}" = "true" ] && [ -z "${user_inputs[$key]}" ]; then
              stored_susfs="$(jq -r --arg k "$key" '.susfs[$k] // empty' <<<"$PINS_JSON")"
              if [ -z "$stored_susfs" ]; then
                echo "::error::SUSFS pin requested but no last-successful pin exists for $key (pin store empty or this KMI never built successfully). Type a ref for this KMI or seed the store with one successful build."
                exit 1
              fi
              echo "  📌 SUSFS pin: $key → $stored_susfs (last successful run)"
              user_val="$stored_susfs"
            fi

            HASH_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } } } }"
            RELEASE_QUERY="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${user_val}\") { sha } blobs(paths: [\"kernel_patches/include/linux/susfs.h\"], ref: \"${user_val}\") { nodes { rawBlob } } } } }"

            if [ "${{ contains(inputs.run_mode, 'release') }}" = "true" ]; then
              GL_QUERY="$RELEASE_QUERY"
            else
              GL_QUERY="$HASH_QUERY"
            fi

            MAX_RETRIES=3
            RETRY_COUNT=0
            RETRY_DELAY=5
            resolved=""

            until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
              RESPONSE=$(curl -s --fail -G "https://gitlab.com/api/graphql" --data-urlencode "query=$GL_QUERY")
              EXIT_CODE=$?

              if [ $EXIT_CODE -eq 0 ] && [ -n "$RESPONSE" ]; then
                resolved=$(echo "$RESPONSE" | jq -r '.data.project.repository.ch.sha // empty')
                if [ -n "$resolved" ] && [ "$resolved" != "null" ]; then
                  echo "  ✅ Query for $key Success"

                  if [ "${{ contains(inputs.run_mode, 'release') }}" = "true" ]; then
                    extracted=$(echo "$RESPONSE" | jq -r '.data.project.repository.blobs.nodes[0].rawBlob // empty' | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}')
                    susfs_versions_per_key[$key]="${extracted:-unknown}"
                    echo "  ✅ $key → SUSFS_VERSION = ${extracted:-unknown}"
                  fi

                  break
                fi
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "::warning::GitLab GraphQL API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying..."
              sleep $RETRY_DELAY
            done

            if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
              echo "::warning::GitLab GraphQL unreachable for '$key'; falling back to git clone of susfs4ksu"
              if [ -z "$SUSFS_CLONE_REPO" ]; then
                SUSFS_CLONE_DIR="$(mktemp -d)"
                if git clone --no-checkout --filter=blob:none "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_CLONE_DIR/repo" 2>/dev/null \
                   || git clone --no-checkout "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_CLONE_DIR/repo"; then
                  SUSFS_CLONE_REPO="$SUSFS_CLONE_DIR/repo"
                fi
              fi
              FALLBACK_SHA=""
              if [ -n "$SUSFS_CLONE_REPO" ] && git -C "$SUSFS_CLONE_REPO" checkout -q --detach "$user_val"; then
                FALLBACK_SHA="$(git -C "$SUSFS_CLONE_REPO" rev-parse HEAD)"
                if [ "${{ contains(inputs.run_mode, 'release') }}" = "true" ]; then
                  SUSFS_VER_FALLBACK="$(git -C "$SUSFS_CLONE_REPO" show "HEAD:kernel_patches/include/linux/susfs.h" 2>/dev/null | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}' || true)"
                  if [ -n "$SUSFS_VER_FALLBACK" ]; then
                    susfs_versions_per_key["$key"]="$SUSFS_VER_FALLBACK"
                  fi
                fi
              fi
              if [ -n "$FALLBACK_SHA" ]; then
                resolved="$FALLBACK_SHA"
                echo "  ✅ $key → resolved via clone fallback: $resolved"
              fi
            fi

            if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
              echo "::error::Could not resolve SUSFS ref '$user_val' for $key on GitLab (GraphQL and git-clone fallback both failed)."
              exit 1
            fi

            if [ "${{ contains(inputs.run_mode, 'release') }}" = "true" ] && [ "${susfs_versions_per_key[$key]:-unknown}" = "unknown" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for '$key' after $MAX_RETRIES attempts. Cannot proceed with release."
              exit 1
            fi

            susfs_hashes["$key"]="$resolved"
            echo "  ✅ Resolved: $key → $resolved"
          done

          active_gki_keys_csv=$(IFS=','; echo "${active_keys[*]:-}")
          echo "active_gki_keys=$active_gki_keys_csv" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android12_5_10=${susfs_hashes[android12-5.10]:-unknown}" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android13_5_15=${susfs_hashes[android13-5.15]:-unknown}" >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android14_6_1=${susfs_hashes[android14-6.1]:-unknown}"   >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android15_6_6=${susfs_hashes[android15-6.6]:-unknown}"   >> "$GITHUB_OUTPUT"
          echo "susfs_hash_android16_6_12=${susfs_hashes[android16-6.12]:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "${{ contains(inputs.run_mode, 'release') }}" = "true" ]; then
            susfs_base_version="unknown"
            for key in "${active_keys[@]}"; do
              ver="${susfs_versions_per_key[$key]:-unknown}"
              if [ "$ver" != "unknown" ]; then
                susfs_base_version="$ver"
                break
              fi
            done

            if [ "$susfs_base_version" = "unknown" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for any active GKI key. Cannot proceed with release."
              exit 1
            fi

            for key in "${active_keys[@]}"; do
              key_ver="${susfs_versions_per_key[$key]:-unknown}"
              if [ "$key_ver" != "$susfs_base_version" ]; then
                echo "::error::SUSFS version mismatch: '$key' has '$key_ver', expected '$susfs_base_version'. Align refs before releasing."
                exit 1
              fi
            done

            echo "susfs_base_version=$susfs_base_version" >> "$GITHUB_OUTPUT"
          fi

          susfs_hashes_json=$(jq -n \
            --arg a12 "${susfs_hashes[android12-5.10]:-unknown}" \
            --arg a13 "${susfs_hashes[android13-5.15]:-unknown}" \
            --arg a14 "${susfs_hashes[android14-6.1]:-unknown}" \
            --arg a15 "${susfs_hashes[android15-6.6]:-unknown}" \
            --arg a16 "${susfs_hashes[android16-6.12]:-unknown}" \
            '{
              "android12-5.10": $a12,
              "android13-5.15": $a13,
              "android14-6.1":  $a14,
              "android15-6.6":  $a15,
              "android16-6.12": $a16
            }')

          echo "$susfs_hashes_json" > susfs_lookup_temp.json
          merged_matrix=$(echo "$merged_matrix" | jq \
            --slurpfile hashes_array susfs_lookup_temp.json \
            '
              ($hashes_array[0]) as $hashes |
              [.[] | . + {susfs_resolved_hash: ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")}]
            ')

          rm susfs_lookup_temp.json

          merged_matrix=$(echo "$merged_matrix" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber? // 0) * -1,
              .model
            )
          ')

          # ── uname resolution: config uname > per-KMI dispatch override > generated (one per kernel line) ──
          declare -A uname_override=(
            ["android12-5.10"]="${{ inputs.android12-5_10_custom_uname }}"
            ["android13-5.15"]="${{ inputs.android13-5_15_custom_uname }}"
            ["android14-6.1"]="${{ inputs.android14-6_1_custom_uname }}"
            ["android15-6.6"]="${{ inputs.android15-6_6_custom_uname }}"
            ["android16-6.12"]="${{ inputs.android16-6_12_custom_uname }}"
          )
          for kmi in android12-5.10 android13-5.15 android14-6.1 android15-6.6 android16-6.12; do
            ov="${uname_override[$kmi]}"
            if [ -n "$ov" ] && jq -e --arg k "$kmi" 'any(.[]; "\(.android_version)-\(.kernel_version)" == $k)' <<<"$merged_matrix" >/dev/null; then
              if [[ ! "$ov" =~ ^[A-Za-z0-9._+-]{1,44}$ ]]; then
                echo "❌ custom_uname_$kmi '$ov' is invalid (charset A-Za-z0-9._+- , max 44 chars)"
                exit 1
              fi
              echo "✅ custom_uname_$kmi valid: $ov (applies only where the config uname is empty)"
            fi
          done
          # gen key = KMI + kernel line; trailing -X.Y.Z in model name pins the sublevel
          declare -A gen_cache=()
          uname_rows=()
          resolved_json="[]"
          while IFS=$'\t' read -r idx model osv av kv cfg_uname; do
            ov="${uname_override[${av}-${kv}]:-}"
            if [ -n "$cfg_uname" ]; then
              val="$cfg_uname"; src="config"
            elif [ -n "$ov" ]; then
              val="$ov"; src="override"
            else
              gkv="$kv"
              [[ "$model" =~ -([0-9]+\.[0-9]+\.[0-9]+)$ ]] && gkv="${BASH_REMATCH[1]}"
              gkey="${av}-${kv}|${gkv}"
              if [ -z "${gen_cache[$gkey]:-}" ]; then
                seed="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${gkv}"
                gen_cache[$gkey]="$(bash scripts/uname/gen-oem-uname.sh --kernel-version "$gkv" --kmi "${av}-${kv}" --seed "$seed")" \
                  || { echo "❌ uname generation failed for ${av}-${kv} ($gkv)"; exit 1; }
              fi
              val="${gen_cache[$gkey]}"; src="generated"; kv="$gkv"
            fi
            [ -n "$val" ] || { echo "❌ uname resolution produced an empty value for $model"; exit 1; }
            resolved_json="$(jq -c --argjson i "$idx" --arg u "$val" '. + [{i: $i, u: $u}]' <<<"$resolved_json")"
            uname_rows+=("| $model | $osv | ${av}-$(cut -d. -f1-2 <<<"$kv") | $kv | $src | \`$val\` |")
          done < <(jq -r 'to_entries[] | [.key, .value.model, .value.os_version, .value.android_version, .value.kernel_version, (.value.uname // "")] | @tsv' <<<"$merged_matrix")
          merged_matrix="$(jq --argjson r "$resolved_json" '[to_entries[] | .key as $k | .value + {resolved_uname: (first($r[] | select(.i == $k) | .u) // "")}]' <<<"$merged_matrix")"
          if jq -e 'any(.[]; (.resolved_uname // "") == "")' <<<"$merged_matrix" >/dev/null; then
            echo "❌ at least one matrix entry has no resolved_uname"; exit 1
          fi
          {
            echo "### 🏷️ uname resolution"
            echo ""
            echo "| Device | OS | KMI | Kernel line | Source | Value |"
            echo "|---|---|---|---|---|---|"
            printf '%s\n' "${uname_rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${uname_rows[@]}"
          echo "✅ uname resolved for $(jq length <<<"$merged_matrix") device(s) (config > override > generated)"
          echo "$merged_matrix" > final_matrix_temp.json

          wrapped=$(jq --slurp '{ include: .[] }' final_matrix_temp.json)
          echo "matrix=$(echo "$wrapped" | jq -c .)" >> "$GITHUB_OUTPUT"
          rm -f final_matrix_temp.json filtered_matrix.json

          echo "::endgroup::"
          echo "✅ Build matrix generated"

      - name: Upload build matrix
        if: ${{ env.skip_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7

      - name: 📊 Build plan summary
        if: ${{ env.skip_build != 'true' }}
        run: |
          ksu_type="${{ inputs.ksu_type }}"
          ksu_ref="${{ inputs.ksu_branch_or_hash }}"

          ksu_display=""
          if [ "$ksu_type" = "BakaSU" ] || [ "$ksu_type" = "KSU" ] || [ "$ksu_type" = "KSUN" ]; then
            if [[ "$ksu_ref" =~ ^[0-9a-f]{40}$ ]]; then
              ksu_display+="📌 \`$ksu_type\`, \`$ksu_ref\`"
            else
              ksu_display+="🔀 \`$ksu_type\`, \`$ksu_ref\` (\`${{ steps.set-matrix-final.outputs.ksu_resolved_hash }}\`)"
            fi
          fi

          build_ts_input="${{ inputs.build_timestamp }}"
          if [ -z "$build_ts_input" ]; then
            build_ts_display="⏱️ auto (current build time)"
          else
            build_ts_display="📌 \`$build_ts_input\`"
          fi

          {
            cat << 'EOF'
          ## 🎯 Build Plan

          **Target:** ${{ inputs.op_model }}  
          **Devices:** ${{ steps.set-matrix-final.outputs.count }}  

          **Configuration:**
          EOF

            echo "- KSU Config: $ksu_display"
            echo "- Build Timestamp: $build_ts_display"
          echo "- Pin mode (same as last successful run): KSU ${{ (inputs.pin_last_success == 'both' || inputs.pin_last_success == 'ksu') && 'ON' || 'off' }} · SUSFS ${{ (inputs.pin_last_success == 'both' || inputs.pin_last_success == 'susfs') && 'ON' || 'off' }} · NoMount pin ${{ inputs.nomount_source == 'pin' && 'ON' || 'off' }}" >> "$GITHUB_STEP_SUMMARY"

            cat << 'EOF'
          - Optimization: ${{ inputs.optimize_level }}
          - Run mode: ${{ inputs.run_mode }}
          - Build profile: ${{ inputs.build_profile }}
          - Create Release: ${{ contains(inputs.run_mode, 'release') && '✅ Yes' || '❌ No' }}
          - Sync toolchains: ${{ inputs.mirror_toolchains && '✅ Yes' || '❌ No' }}

          **SUSFS Configuration:**
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

          declare -A susfs_inputs=(
            ["android12-5.10"]="${{ inputs.android12-5_10_susfs_branch_or_commit }}"
            ["android13-5.15"]="${{ inputs.android13-5_15_susfs_branch_or_commit }}"
            ["android14-6.1"]="${{ inputs.android14-6_1_susfs_branch_or_commit }}"
            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"
            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"
          )

          declare -A step_hashes=(
            ["android12-5.10"]="${{ steps.set-matrix-final.outputs.susfs_hash_android12_5_10 }}"
            ["android13-5.15"]="${{ steps.set-matrix-final.outputs.susfs_hash_android13_5_15 }}"
            ["android14-6.1"]="${{ steps.set-matrix-final.outputs.susfs_hash_android14_6_1 }}"
            ["android15-6.6"]="${{ steps.set-matrix-final.outputs.susfs_hash_android15_6_6 }}"
            ["android16-6.12"]="${{ steps.set-matrix-final.outputs.susfs_hash_android16_6_12 }}"
          )

          IFS=',' read -ra active_keys_display \
            <<< "${{ steps.set-matrix-final.outputs.active_gki_keys }}"

          for key in "${active_keys_display[@]}"; do
            value="${susfs_inputs[$key]:-}"
            fetched_hash="${step_hashes[$key]:-unknown}"

            if [ -z "$value" ]; then
              echo "- $key: 🔄 auto (\`$fetched_hash\`)" >> $GITHUB_STEP_SUMMARY
            elif [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "- $key: 📌 \`$value\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $key: 🔀 \`$value\` (\`$fetched_hash\`)" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **💡 Note:** Hashes are resolved at run time via API calls before builds start." >> $GITHUB_STEP_SUMMARY

          if [[ "${{ inputs.op_model }}" == android*-*.* ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **⚠️ Android-Kernel Filter:** Only A15 and A16 devices will be built for \`${{ inputs.op_model }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "✅ Build plan summary written"

  resolve-nomount:
    name: Resolve NoMount commit (locked for all kernels)
    runs-on: ubuntu-24.04
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      nomount_source: ${{ steps.resolve.outputs.nomount_source }}
      nomount_module_name: ${{ steps.resolve.outputs.nomount_module_name }}
      nomount_artifact_id: ${{ steps.resolve.outputs.nomount_artifact_id }}
      nomount_run_url: ${{ steps.resolve.outputs.nomount_run_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 🔍 Resolve NoMount commit and matching CI module
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Resolve NoMount commit"
          commit="${{ inputs.nomount_commit }}"
          nm_source="${{ inputs.nomount_source }}"
          case "$nm_source" in
            master) branch="master" ;;
            *)      branch="dev" ;;   # dev, or pin (branch only used for the informational HEAD probe)
          esac

          # ── NoMount: "same as last successful run" ──
          PINS_JSON="{}"
          if [ "${{ inputs.pin_last_success }}" != "none" ] || [ "$nm_source" = "pin" ]; then
            pins_art="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=last-success-pins&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty' 2>/dev/null || true)"
            if [ -z "$pins_art" ]; then
              pins_art="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pins.json&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty' 2>/dev/null || true)"
            fi
            if [ -n "$pins_art" ]; then
              rm -rf pins_store && mkdir -p pins_store
              gh api "repos/${{ github.repository }}/actions/artifacts/$pins_art/zip" > pins_store/dl.bin 2>/dev/null || true
              if [ "$(head -c 2 pins_store/dl.bin 2>/dev/null)" = "PK" ]; then
                unzip -oq pins_store/dl.bin -d pins_store || true
              else
                mv pins_store/dl.bin pins_store/last-success-pins 2>/dev/null || true
              fi
              pins_raw="$(cat pins_store/last-success-pins 2>/dev/null || true)"
              [ -n "$pins_raw" ] || pins_raw="$(cat pins_store/pins.json 2>/dev/null || true)"
              if [ -n "$pins_raw" ] && echo "$pins_raw" | jq -e . >/dev/null 2>&1; then
                PINS_JSON="$pins_raw"
                echo "📌 NoMount pin store loaded from artifact $pins_art"
              fi
              rm -rf pins_store
            fi
          else
            echo "ℹ️  pin_last_success=none and nomount_source!=pin — pin store not read"
          fi
          # ── NoMount: explicit commit > pin (nomount_source=pin) > auto (HEAD of chosen branch) ──
          if [ -n "$commit" ]; then
            if [ "$nm_source" = "pin" ]; then
              echo "ℹ️  nomount_commit set at dispatch — nomount_source=pin is moot for this run"
            fi
          elif [ "$nm_source" = "pin" ]; then
            stored_nm="$(jq -r '.nomount_commit // empty' <<<"$PINS_JSON")"
            if [ -z "$stored_nm" ]; then
              echo "::error::NoMount pin requested (nomount_source=pin) but no last-successful commit exists yet (pin store missing/empty). Seed it with one successful build."
              exit 1
            fi
            echo "📌 NoMount pin: $stored_nm (last successful run)"
            commit="$stored_nm"
            src="pin"
          fi

          # find_module_for <sha>: upstream CI run + live module artifact for this SHA
          find_module_for() {
            local sha="$1" short7 run_id art
            short7="${sha:0:7}"
            MODULE_ID=""; MODULE_NAME=""; NM_RUN_URL=""
            run_id=$(gh api "repos/maxsteeel/nomount/actions/runs?head_sha=$sha&status=success&per_page=10" \
              --jq '[.workflow_runs[] | select(.path | endswith("build.yml"))][0].id // empty' 2>/dev/null || true)
            [ -n "$run_id" ] || return 1
            NM_RUN_URL=$(gh api "repos/maxsteeel/nomount/actions/runs/$run_id" --jq '.html_url')
            art=$(gh api "repos/maxsteeel/nomount/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .name != "module-base" and (.name | contains("-'"$short7"'")))][0] | "\(.id)|\(.name)"' 2>/dev/null || true)
            [ -n "$art" ] || return 1
            MODULE_ID="${art%%|*}"
            MODULE_NAME="${art#*|}"
            return 0
          }

          module_name=""; module_id=""; run_url=""

          if [ -n "$commit" ]; then
            # ── Mode 1: explicit commit ──
            if ! [[ "$commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::nomount_commit must be a full 40-char SHA, got: '$commit'"
              exit 1
            fi
            if ! gh api "repos/maxsteeel/nomount/commits/$commit" --jq '.sha' >/dev/null 2>&1; then
              echo "::error::nomount_commit '$commit' does not exist in maxsteeel/nomount"
              exit 1
            fi
            if [ "${src:-}" != "pin" ]; then
              echo "📌 Explicit NoMount commit: $commit"
              src="explicit-commit"
              head_now="$(gh api "repos/maxsteeel/nomount/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)"
              if [ -z "$head_now" ]; then
                head_now="$(git ls-remote "https://github.com/maxsteeel/nomount.git" "refs/heads/$branch" 2>/dev/null | cut -f1 || true)"
              fi
              if [ -n "$head_now" ] && [ "$commit" != "$head_now" ]; then
                echo "::warning::Pinned NoMount commit ${commit:0:7} is not HEAD (${head_now:0:7}) of branch '$branch'. If you did not intend a rollback, clear the pre-filled nomount_commit field in the dispatch form and re-run."
              fi
            else
              echo "📌 NoMount commit from pin: $commit"
            fi
            if find_module_for "$commit"; then
              module_name="$MODULE_NAME"; module_id="$MODULE_ID"; run_url="$NM_RUN_URL"
              echo "✅ Exact CI-built module found: $module_name (informational — the module is built from source in this run)"
            else
              echo "::warning::No live NoMount module artifact for commit $commit — the module will be built from source in this run instead."
            fi
          else
            # ── Mode 2: auto — absolute HEAD of <branch> on maxsteeel/nomount ──
            commit="$(gh api "repos/maxsteeel/nomount/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)"
            if [ -z "$commit" ]; then
              commit="$(git ls-remote "https://github.com/maxsteeel/nomount.git" "refs/heads/$branch" 2>/dev/null | cut -f1 || true)"
            fi
            if [ -z "$commit" ]; then
              echo "::error::Could not resolve HEAD of branch '$branch' on maxsteeel/nomount (API and ls-remote both failed)"
              exit 1
            fi
            src="branch-head-$branch"
            echo "🔀 HEAD of '$branch': $commit"
            if find_module_for "$commit"; then
              module_name="$MODULE_NAME"; module_id="$MODULE_ID"; run_url="$NM_RUN_URL"
              echo "   Upstream CI module (informational): $module_name"
            else
              echo "   No upstream CI module for HEAD yet — the module will be built from source in this run"
            fi
          fi

          {
            echo "nomount_commit=$commit"
            echo "nomount_source=$src"
            echo "nomount_module_name=$module_name"
            echo "nomount_artifact_id=$module_id"
            echo "nomount_run_url=$run_url"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🚫 NoMount Resolution"
            echo ""
            echo "**Commit:** \`$commit\` ($src) — locked for **all** matrix builds in this run."
            echo ""
            echo "**Userspace module:** built from source in this run (zig cc) — exact match for \`$commit\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

  build-nomount-module:
    name: Build NoMount module from source
    needs: resolve-nomount
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.decide.outputs.built }}
      module_name: ${{ steps.package.outputs.module_name }}
    env:
      NM_SHA: ${{ needs.resolve-nomount.outputs.nomount_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Decide build strategy
        id: decide
        run: |
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "Building the userspace module from source for NoMount $NM_SHA — commit-exact by construction."

      - name: Set up Zig
        if: steps.decide.outputs.built == 'true'
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Build and package metamodule
        id: package
        if: steps.decide.outputs.built == 'true'
        run: |
          set -euo pipefail
          expected_commit="$NM_SHA"
          if ! [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "NoMount commit must be a full 40-character SHA." >&2
            exit 2
          fi

          source_dir="${RUNNER_TEMP}/nomount-module-source"
          module_dir="${RUNNER_TEMP}/nomount-metamodule"
          git clone --no-checkout https://github.com/maxsteeel/nomount.git "$source_dir"
          git -C "$source_dir" fetch origin "$expected_commit"
          git -C "$source_dir" checkout --detach "$expected_commit"
          actual_commit="$(git -C "$source_dir" rev-parse HEAD)"
          if [ "$actual_commit" != "$expected_commit" ]; then
            echo "NoMount module source mismatch: expected $expected_commit, got $actual_commit." >&2
            exit 1
          fi

          NM_COMMIT_COUNT="$(git -C "$source_dir" rev-list --count HEAD)"
          NM_UP_BRANCH="$(gh api "repos/maxsteeel/nomount/commits/${actual_commit}/branches-where-head" --jq '.[0].name' 2>/dev/null || true)"
          if [ -z "$NM_UP_BRANCH" ]; then
            case "${{ inputs.nomount_source }}" in
              master) NM_UP_BRANCH="master" ;;
              *)      NM_UP_BRANCH="dev" ;;
            esac
          fi
          if [ "$NM_UP_BRANCH" = "master" ]; then NM_TAG="release"; else NM_TAG="dev"; fi

          mkdir -p "$source_dir/bin"
          (
            cd "$source_dir/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib \
              -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -Wl,--entry=_start nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding \
              -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -Wl,--entry=_start nm.c -o ../../bin/nm-arm
          )

          cp -a "$source_dir/module" "$module_dir"
          mkdir -p "$module_dir/bin"
          install -m 0755 "$source_dir/bin/nm-arm64" "$module_dir/bin/nm-arm64"
          install -m 0755 "$source_dir/bin/nm-arm" "$module_dir/bin/nm-arm"
          sed -i "s/^versionCode=.*/versionCode=${NM_COMMIT_COUNT}/" "$module_dir/module.prop"
          printf '%s\n' "$actual_commit" > "$module_dir/NOMOUNT_SOURCE_COMMIT"

          NAME="$(sed -n 's/^name=//p' "$module_dir/module.prop" | tr -d '\r' | tr -d ' ')"
          BASE_VERSION="$(sed -n 's/^version=//p' "$module_dir/module.prop" | tr -d '\r' | tr -d ' ')"
          SHORT7="${actual_commit:0:7}"
          MODULE_BASE="${NAME}-${BASE_VERSION}-${NM_TAG}-${SHORT7}-${NM_COMMIT_COUNT}"
          if [ "$NM_TAG" = "release" ]; then
            sed -i "s/^version=\(.*\)/version=\1 (${NM_COMMIT_COUNT})/" "$module_dir/module.prop"
          else
            sed -i "s/^version=\(.*\)/version=\1 (${NM_COMMIT_COUNT}-${SHORT7}-dev)/" "$module_dir/module.prop"
          fi
          module_zip="${RUNNER_TEMP}/${MODULE_BASE}.zip"
          (
            cd "$module_dir"
            zip -qr "$module_zip" .
          )
          printf '%s  %s\n' "$(sha256sum "$module_zip" | cut -d' ' -f1)" "${MODULE_BASE}.zip" > "${module_zip}.sha256"

          echo "module_name=${MODULE_BASE}" >> "$GITHUB_OUTPUT"
          {
            echo "### NoMount module built from source"
            echo "- Commit: \`$actual_commit\`"
            echo "- Zip: \`$MODULE_BASE.zip\`"
            echo "- sha256: \`$(cut -d' ' -f1 "${module_zip}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$module_zip"

      - name: Upload built module for the release job (raw, not re-zipped)
        if: steps.decide.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nomount-module-built
          path: ${{ runner.temp }}/NoMount-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload built module checksum (raw, not re-zipped)
        if: steps.decide.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nomount-module-sha256
          path: ${{ runner.temp }}/NoMount-*.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7

  mirror_toolchain:
    needs: set-op-model
    if: ${{ inputs.mirror_toolchains }}
    uses: ./.github/workflows/mirror-toolchains.yml
    secrets: inherit

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-24.04
    steps:
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/ccache/ccache-x86-64"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 -H "User-Agent: Mozilla/5.0" "$url" -o ccache && [ -s ccache ]; then
              ok=1; break
            fi
            echo "attempt $attempt failed (GitHub raw 504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            chmod +x ccache
            echo "✅ downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ccache
          fi
          echo "::endgroup::"
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  build:
    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})
    needs: [set-op-model, resolve-nomount, mirror_toolchain, prepare_ccache]
    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      needs.resolve-nomount.result == 'success' &&
      (needs.mirror_toolchain.result == 'success' || needs.mirror_toolchain.result == 'skipped')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}
    outputs:
      ksu_ver: ${{ steps.build-stat.outputs.ksu_version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        uses: ./.github/actions/disk-cleanup

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        uses: actions/download-artifact@v8
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache (ECS by cctv18, shared via artifact)
        run: |
          set -uo pipefail
          echo "::group::Install ccache"
          if [ -s ccache-dl/ccache ]; then
            sudo cp -f ccache-dl/ccache /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
            echo "✅ installed custom ccache from shared artifact"
          else
            echo "::warning::shared ccache artifact unavailable; using apt ccache"
          fi
          rm -rf ccache-dl
          echo "[DEBUG] Ccache version : $(ccache --version | head -1)"
          echo "::endgroup::"

      - name: ♻️ Configure ccache (bounded)
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"
            mkdir -p "$CACHE_DIR"

            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_LOGFILE=${CCACHE_LOG}"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )

            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done

            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi

            echo "✅ ccache configured successfully"
            echo "Current ccache configuration:"
            ccache -p
          else
            echo "ccache not found, skipping configuration."
          fi
          echo "::endgroup::"

      - name: 🧹 Prepare op_config_json (without KSU fields)
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash, .resolved_uname)')" >> "$GITHUB_OUTPUT"

      - name: 🔨 Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          nomount_commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}
          optimize_level: ${{ inputs.optimize_level }}
          build_timestamp: ${{ inputs.build_timestamp }}
          resolved_uname: ${{ matrix.resolved_uname }}
          clean: ${{ contains(inputs.build_profile, 'clean') }}
          debug: ${{ contains(inputs.build_profile, 'debug') }}
          patch_dry_run: ${{ contains(inputs.run_mode, 'patch') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload patch failure forensics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-faillogs-${{ matrix.model }}
          path: |
            patch-faillogs/
            kernel_workspace/kernel_platform/common/block/*.rej
            kernel_workspace/kernel_platform/common/net/ipv4/*.rej
            kernel_workspace/kernel_platform/common/kernel/*.rej
            kernel_workspace/kernel_platform/common/kernel/sched/*.rej
          if-no-files-found: ignore

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        run: |
          echo "::group::Build Statistics"

          echo "Device: ${{ matrix.model }}"
          echo "OS Version: ${{ matrix.os_version }}"
          echo "Kernel: ${{ matrix.android_version }}-${{ matrix.kernel_version }}"
          if [ "${{ matrix.susfs }}" = true ]; then
            echo "SUSFS Hash: ${{ matrix.susfs_resolved_hash }}"
          fi
          echo "Status: ${{ job.status }}"

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully"
            echo ""
            echo "Outputs:"
            echo "  - Kernel: ${{ steps.build.outputs.kernel_version }}"
            if [ "${{ matrix.ksu_type }}" = "BakaSU" ]; then
              echo "  - BakaSU: v${{ steps.build.outputs.ksu_version }}"
            elif [ "${{ matrix.ksu_type }}" = "KSUN" ]; then
              echo "  - KernelSU Next: v${{ steps.build.outputs.ksu_version }}"
            else
              echo "  - KSU: v${{ steps.build.outputs.ksu_version }}"
            fi

            echo "ksu_ver=${{ steps.build.outputs.ksu_version }}" >> "$GITHUB_OUTPUT"

            if [ "${{ matrix.susfs }}" = true ]; then
              echo "  - SUSFS: ${{ steps.build.outputs.susfs_version }}"
            fi
            echo "  - NoMount dev: ${{ steps.build.outputs.nomount_commit }}"
            echo "  - Build time: ${{ steps.build.outputs.build_time }}s"

            if [ "${{ contains(inputs.build_profile, 'clean') }}" != "true" ]; then
              echo "  - ccache hit rate: ${{ steps.build.outputs.ccache_hit_rate }}"
              echo "  - ccache direct rate: ${{ steps.build.outputs.ccache_direct_rate }}"
            else
              echo "  - ccache: disabled (clean build)"
            fi

            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "  - Warnings: ${{ steps.build.outputs.warnings }}"
            fi
          else
            echo "❌ Build failed"
          fi

          echo "::endgroup::"

      - name: 📝 Job summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF

          ### ${{ matrix.model }} (${{ matrix.os_version }}) - ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}

          **Kernel:** ${{ matrix.android_version }}-${{ matrix.kernel_version }}
          EOF

          if [ "${{ matrix.susfs }}" = true ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          **SUSFS Hash:** \`${{ matrix.susfs_resolved_hash }}\`
          EOF
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
          | Metric | Value |
          |--------|-------|
          | **Kernel** | ${{ steps.build.outputs.kernel_version }} |
          EOF
            if [ "${{ matrix.ksu_type }}" = "BakaSU" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **BakaSU** | v${{ steps.build.outputs.ksu_version }} |
          EOF
                      elif [ "${{ matrix.ksu_type }}" = "KSUN" ]; then
                        cat >> $GITHUB_STEP_SUMMARY << EOF
                    | **KernelSU Next** | v${{ steps.build.outputs.ksu_version }} |
          EOF
                      else
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **KSU** | v${{ steps.build.outputs.ksu_version }} |
          EOF
            fi

            if [ "${{ matrix.susfs }}" = true ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **SUSFS** | ${{ steps.build.outputs.susfs_version }} |
          EOF
            fi
          echo "| **NoMount dev** | \`${{ steps.build.outputs.nomount_commit }}\` |" >> "$GITHUB_STEP_SUMMARY"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          | **Build Time** | ${{ steps.build.outputs.build_time }}s |
          EOF

            if [ "${{ contains(inputs.build_profile, 'clean') }}" != "true" ]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF
          | **ccache Hit Rate** | ${{ steps.build.outputs.ccache_hit_rate }} |
          | **ccache Direct Rate** | ${{ steps.build.outputs.ccache_direct_rate }} |
          EOF
            fi

            if [ -n "${{ steps.build.outputs.warnings }}" ]; then
              echo "| **Warnings** | ${{ steps.build.outputs.warnings }} |" >> $GITHUB_STEP_SUMMARY
            fi

            cat >> $GITHUB_STEP_SUMMARY << EOF

          **Image SHA256:** \`${{ steps.build.outputs.image_sha256 }}\`
          **AnyKernel3 Zip SHA256:** \`${{ steps.build.outputs.zip_sha256 }}\`
          EOF
          fi

      - name: 🧹 Final cleanup and space report
        if: always()
        run: |
          echo "::group::Cleanup"

          sudo rm -rf "$GITHUB_WORKSPACE/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/build" || true
          sudo rm -rf "$GITHUB_WORKSPACE/kernel/out" || true
          sudo rm -rf "$GITHUB_WORKSPACE/.repo" || true
          sudo rm -rf /tmp/* || true

          if command -v ccache >/dev/null 2>&1; then
            echo ""
            echo "📊 ccache statistics after build:"
            ccache -s
            echo ""
            echo "💾 ccache preserved for next build"
          fi

          echo ""
          echo "💽 Final disk usage:"
          df -h /

          cleanup_failed=0
          for p in "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/kernel/out" "$GITHUB_WORKSPACE/.repo"; do
            if [ -e "$p" ]; then
              echo "::error::cleanup verification failed: $p still exists"
              cleanup_failed=1
            fi
          done
          if [ "$cleanup_failed" -ne 0 ]; then
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ Final cleanup verified — removed build trees gone, ccache untouched, disk reported"
          echo "::endgroup::"

  fetch-manager-apks:
    name: Fetch manager APKs (artifact, no release)
    needs: [set-op-model]
    if: |
      !cancelled() &&
      !contains(inputs.run_mode, 'release') &&
      needs.set-op-model.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KSU_SHA: ${{ needs.set-op-model.outputs.ksu_resolved_hash }}
    outputs:
      manager_repo: ${{ steps.apk-manifest.outputs.manager_repo }}
      apk_names: ${{ steps.apk-manifest.outputs.apk_names }}
      apk_sources: ${{ steps.apk-manifest.outputs.apk_sources }}
    steps:
      - name: 📦 Fetch commit-matched manager apps
        run: |
          set -euo pipefail
          mkdir -p ./manager-apks
          cd ./manager-apks
          case "${{ inputs.ksu_type }}" in
            KSUN)      MANAGER_REPO="KernelSU-Next/KernelSU-Next" ;;
            BakaSU)  MANAGER_REPO="Baka-SU/BakaSU" ;;
            KSU)       MANAGER_REPO="tiann/KernelSU" ;;
          esac
          echo "MANAGER_REPO=${MANAGER_REPO}" >> "$GITHUB_ENV"
          echo "Manager repo: $MANAGER_REPO — resolving commit-exact build for ${KSU_SHA}"

          MANAGER_RUN_ID=""
          MANAGER_RUN_ID=$(gh api "repos/${MANAGER_REPO}/actions/runs?head_sha=${KSU_SHA}&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.path | test("build-manager(-ci)?\\.yml$"))][0].id // empty' || true)

          if [ -n "$MANAGER_RUN_ID" ]; then
            echo "✅ Commit-exact manager CI run found: ${MANAGER_RUN_ID}"
            echo "MANAGER_RUN_URL=https://github.com/${MANAGER_REPO}/actions/runs/${MANAGER_RUN_ID}" >> "$GITHUB_ENV"
            ART_ROWS=$(gh api "repos/${MANAGER_REPO}/actions/runs/${MANAGER_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | select(.name | test("release"; "i")) | "\(.id) \(.name)"' || true)
            while read -r aid aname; do
              [ -z "$aid" ] && continue
              ls -1 *.apk 2>/dev/null | sort > /tmp/apks-before.txt || true
              gh api "repos/${MANAGER_REPO}/actions/artifacts/${aid}/zip" > "${aname}.zip"
              unzip -o -j "${aname}.zip" '*.apk' -d ./ >/dev/null || true
              rm -f "${aname}.zip"
              ls -1 *.apk 2>/dev/null | sort > /tmp/apks-after.txt || true
              comm -13 /tmp/apks-before.txt /tmp/apks-after.txt | while read -r new_apk; do
                [ -z "$new_apk" ] && continue
                printf '%s\tartifact\t%s\n' "$new_apk" "$aid" >> apk-map.tsv
              done
            done <<< "$ART_ROWS"
          fi

          if ! ls ./*.apk >/dev/null 2>&1; then
            echo "::warning::No live commit-exact manager build for ${KSU_SHA} (artifact expired or CI absent) — falling back to the latest upstream release"
            LATEST_TAG="$(gh api "repos/${MANAGER_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::No manager APK could be fetched from ${MANAGER_REPO} for ${KSU_SHA}"
              exit 1
            fi
            echo "MANAGER_RUN_URL=https://github.com/${MANAGER_REPO}/releases/tag/${LATEST_TAG}" >> "$GITHUB_ENV"
            for asset_url in $(gh api "repos/${MANAGER_REPO}/releases/latest" \
              --jq '.assets[] | select(.name | endswith(".apk")) | .browser_download_url'); do
              case "$asset_url" in
                *release*.apk|*release-*.apk)
                  curl --fail --location --retry 3 --retry-delay 5 -O "$asset_url" || true
                  if [ -f "${asset_url##*/}" ]; then
                    printf '%s\turl\t%s\n' "${asset_url##*/}" "$asset_url" >> apk-map.tsv
                  fi
                  ;;
              esac
            done
          fi

          if ! ls ./*.apk >/dev/null 2>&1; then
            echo "::error::No manager APK could be fetched from ${MANAGER_REPO} for ${KSU_SHA}"
            exit 1
          fi

          echo "Manager APKs fetched:"
          ls -l ./*.apk
          echo "✅ Manager APKs fetched (${MANAGER_REPO} @ ${KSU_SHA:0:12})"

      - name: 📃 Emit APK manifest for per-file upload
        id: apk-manifest
        if: always()
        run: |
          set -euo pipefail
          MAP=./manager-apks/apk-map.tsv
          touch "$MAP"
          if [ -s "$MAP" ]; then
            sed -i 's|^\./||' "$MAP"
            awk -F'\t' '!seen[$1]++' "$MAP" > "${MAP}.tmp" && mv "${MAP}.tmp" "$MAP"
            echo "✅ APK manifest normalized to bare basenames"
          fi
          while IFS=$'\t' read -r apk kind ref; do
            [ -z "$apk" ] && continue
            case "$apk" in
              *[!A-Za-z0-9._-]*)
                echo "::error::Unsafe APK filename for artifact naming: ${apk}"
                exit 1
                ;;
            esac
          done < "$MAP"
          for f in ./manager-apks/*.apk; do
            if [ ! -e "$f" ]; then continue; fi
            b=$(basename "$f")
            if ! cut -f1 "$MAP" | grep -Fxq "$b"; then
              echo "::error::${b} exists in ./manager-apks but is missing from the APK manifest"
              exit 1
            fi
          done
          APK_COUNT=$(cut -f1 "$MAP" | sort -u | grep -c . || true)
          if [ "${APK_COUNT:-0}" -eq 0 ]; then
            echo "::error::APK manifest is empty — no APKs were mapped during fetch"
            exit 1
          fi
          NAMES_JSON=$(cut -f1 "$MAP" | sort -u | jq -R . | jq -sc .)
          {
            printf '{'
            first=1
            while IFS=$'\t' read -r apk kind ref; do
              [ -z "$apk" ] && continue
              if [ $first -eq 0 ]; then printf ','; fi
              first=0
              printf '"%s": {"kind": "%s", "ref": "%s"}' "$apk" "$kind" "$ref"
            done < "$MAP"
            printf '}'
          } > sources.json
          jq -e . sources.json >/dev/null
          {
            echo "apk_names=${NAMES_JSON}"
            echo "apk_sources=$(jq -c . sources.json)"
            echo "manager_repo=${MANAGER_REPO}"
          } >> "$GITHUB_OUTPUT"
          echo "APK manifest: $NAMES_JSON"
          echo "✅ APK manifest emitted (${APK_COUNT} APK(s) from ${MANAGER_REPO})"

  upload-manager-apks:
    name: Upload manager APK (${{ matrix.apk }})
    needs: [fetch-manager-apks]
    if: |
      !cancelled() &&
      !contains(inputs.run_mode, 'release') &&
      needs.fetch-manager-apks.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APK_NAME: ${{ matrix.apk }}
      MANAGER_REPO: ${{ needs.fetch-manager-apks.outputs.manager_repo }}
      APK_SOURCES: ${{ needs.fetch-manager-apks.outputs.apk_sources }}
    strategy:
      fail-fast: false
      matrix:
        apk: ${{ fromJson(needs.fetch-manager-apks.outputs.apk_names) }}
    steps:
      - name: ⬇️ Retrieve ${{ matrix.apk }} from upstream
        run: |
          set -euo pipefail
          KIND=$(printf '%s' "$APK_SOURCES" | jq -r --arg apk "$APK_NAME" '.[$apk].kind // empty')
          REF=$(printf '%s' "$APK_SOURCES" | jq -r --arg apk "$APK_NAME" '.[$apk].ref // empty')
          mkdir -p ./apk-out
          case "$KIND" in
            artifact)
              gh api "repos/${MANAGER_REPO}/actions/artifacts/${REF}/zip" > ./src.zip
              unzip -o -j ./src.zip "$APK_NAME" -d ./apk-out >/dev/null 2>&1 || \
                unzip -o -j ./src.zip "*/$APK_NAME" -d ./apk-out >/dev/null
              rm -f ./src.zip
              ;;
            url)
              curl --fail --location --retry 3 --retry-delay 5 -o "./apk-out/$APK_NAME" "$REF"
              ;;
            *)
              echo "::error::No source recorded for ${APK_NAME} — APK manifest incomplete"
              exit 1
              ;;
          esac
          if [ ! -f "./apk-out/$APK_NAME" ]; then
            echo "::error::${APK_NAME} missing after retrieval"
            exit 1
          fi
          echo "Retrieved: $(ls -l "./apk-out/$APK_NAME")"
          echo "✅ Retrieved ${APK_NAME} from ${MANAGER_REPO}"

      - name: ⬆️ Upload ${{ matrix.apk }} as unzipped artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.apk }}
          path: apk-out/${{ matrix.apk }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  trigger-release:
    needs: [set-op-model, resolve-nomount, build-nomount-module, build]
    runs-on: ubuntu-24.04
    if: |
      !cancelled() &&
      contains(inputs.run_mode, 'release') &&
      needs.set-op-model.result == 'success' &&
      needs.resolve-nomount.result == 'success' &&
      needs.build-nomount-module.result == 'success'
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUSFS_BASE_VERSION: ${{ needs.set-op-model.outputs.susfs_base_version }}
      KSU_SHA: ${{ needs.set-op-model.outputs.ksu_resolved_hash }}
      NM_SHA: ${{ needs.resolve-nomount.outputs.nomount_commit }}
      NM_MODE: ${{ needs.resolve-nomount.outputs.nomount_source }}
      NM_BUILT: ${{ needs.build-nomount-module.outputs.built }}
      NM_MODULE_NAME: ${{ needs.build-nomount-module.outputs.module_name || needs.resolve-nomount.outputs.nomount_module_name }}
      NM_ARTIFACT_ID: ${{ needs.resolve-nomount.outputs.nomount_artifact_id }}
      NM_RUN_URL: ${{ needs.resolve-nomount.outputs.nomount_run_url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Configure root-specific release metadata
        run: |
          case "${{ inputs.ksu_type }}" in
            KSUN)
              root_display="KernelSU Next"
              ;;
            BakaSU)
              root_display="BakaSU"
              ;;
            KSU)
              root_display="KernelSU"
              ;;
            *)
              echo "::error::Unsupported root implementation '${{ inputs.ksu_type }}'."
              exit 1
              ;;
          esac
          echo "ROOT_DISPLAY=$root_display" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=OnePlus Kernels With $root_display, SUSFS $SUSFS_BASE_VERSION, and NoMount" >> "$GITHUB_ENV"

      - name: 🏷️ Generate and Create New Tag
        run: |
          PREV_R=$(git ls-remote --tags origin "${SUSFS_BASE_VERSION}-r*" \
            | awk '{print $2}' \
            | sed "s|.*${SUSFS_BASE_VERSION}-r||" \
            | grep -E '^[0-9]+$' \
            | sort -n | tail -n 1 || true)
          if [ -z "$PREV_R" ]; then
            NEXT_R=1
          elif [ "${{ contains(inputs.run_mode, 'bump increment') }}" = "true" ]; then
            NEXT_R=$((PREV_R + 1))
          else
            NEXT_R="$PREV_R"
          fi
          TAG_TS=$(date -u +%Y-%m-%d-%H-%M-%S)
          NEW_TAG="${SUSFS_BASE_VERSION}-r${NEXT_R}-${TAG_TS}"
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true
          pattern: "{AK3_*,NoMount-*,nomount-*,matrix.json,patch-status-*}"
          digest-mismatch: warn

      - name: 🧹 Prepare release staging
        run: |
          mkdir -p ./downloaded-artifacts
          find ./downloaded-artifacts -mindepth 2 -type f -exec mv -f {} ./downloaded-artifacts/ \; 2>/dev/null || true
          find ./downloaded-artifacts -mindepth 1 -type d -empty -delete 2>/dev/null || true
          rm -f ./downloaded-artifacts/ccache*
          rm -f ./downloaded-artifacts/*.rej ./downloaded-artifacts/*.log
          for z in ./downloaded-artifacts/*.zip; do
            [ -f "$z" ] || continue
            case "$(basename "$z")" in
              AK3_*|NoMount-*) continue ;;
            esac
            echo "Unwrapping containerized artifact: $(basename "$z")"
            if unzip -o -q "$z" -d ./downloaded-artifacts 2>/dev/null; then
              rm -f "$z"
            else
              echo "::warning::Could not unwrap $(basename "$z"); leaving it untouched"
            fi
          done
          find ./downloaded-artifacts -mindepth 2 -type f -exec mv -f {} ./downloaded-artifacts/ \; 2>/dev/null || true
          find ./downloaded-artifacts -mindepth 1 -type d -empty -delete 2>/dev/null || true
          ls -A ./downloaded-artifacts
          echo "✅ Release staging prepared"

      - name: 📦 Fetch commit-matched manager apps
        run: |
          set -euo pipefail
          cd ./downloaded-artifacts
          kernel_count="$(find . -type f -name "AK3_*.zip" | wc -l)"
          if [ "$kernel_count" -eq 0 ]; then
            echo "::error::No kernel artifacts were produced; refusing to create a release."
            echo "::group::Staging diagnostics"
            find . -maxdepth 3 -print | head -80
            echo "::endgroup::"
            exit 1
          fi

          case "${{ inputs.ksu_type }}" in
            KSUN)      MANAGER_REPO="KernelSU-Next/KernelSU-Next" ;;
            BakaSU)  MANAGER_REPO="Baka-SU/BakaSU" ;;
            KSU)       MANAGER_REPO="tiann/KernelSU" ;;
          esac
          echo "Manager repo: $MANAGER_REPO — resolving commit-exact build for ${KSU_SHA}"

          MANAGER_RUN_ID=""
          MANAGER_RUN_ID=$(gh api "repos/${MANAGER_REPO}/actions/runs?head_sha=${KSU_SHA}&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.path | test("build-manager(-ci)?\\.yml$"))][0].id // empty' || true)

          if [ -n "$MANAGER_RUN_ID" ]; then
            echo "✅ Commit-exact manager CI run found: ${MANAGER_RUN_ID}"
            echo "MANAGER_RUN_URL=https://github.com/${MANAGER_REPO}/actions/runs/${MANAGER_RUN_ID}" >> "$GITHUB_ENV"
            mkdir -p /tmp/mgr
            ART_ROWS=$(gh api "repos/${MANAGER_REPO}/actions/runs/${MANAGER_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | select(.name | test("release"; "i")) | "\(.id) \(.name)"' || true)
            while read -r aid aname; do
              [ -z "$aid" ] && continue
              gh api "repos/${MANAGER_REPO}/actions/artifacts/${aid}/zip" > "/tmp/mgr/${aname}.zip"
              unzip -o -j "/tmp/mgr/${aname}.zip" '*.apk' -d ./ >/dev/null || true
            done <<< "$ART_ROWS"
          fi

          if ! ls ./*.apk >/dev/null 2>&1; then
            echo "::warning::No live commit-exact manager build for ${KSU_SHA} (artifact expired or CI absent) — falling back to the latest upstream release"
            LATEST_TAG="$(gh api "repos/${MANAGER_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::No manager APK could be fetched from ${MANAGER_REPO} for ${KSU_SHA}"
              exit 1
            fi
            echo "MANAGER_RUN_URL=https://github.com/${MANAGER_REPO}/releases/tag/${LATEST_TAG}" >> "$GITHUB_ENV"
            for asset_url in $(gh api "repos/${MANAGER_REPO}/releases/latest" \
              --jq '.assets[] | select(.name | endswith(".apk")) | .browser_download_url'); do
              case "$asset_url" in
                *release*.apk|*release-*.apk) curl --fail --location --retry 3 --retry-delay 5 -O "$asset_url" || true ;;
              esac
            done
          fi

          if ! ls ./*.apk >/dev/null 2>&1; then
            echo "::error::No manager APK could be fetched from ${MANAGER_REPO} for ${KSU_SHA}"
            exit 1
          fi

          echo "Manager APKs bundled into this release:"
          ls -l ./*.apk
          MANAGER_APK_NAMES="$(ls ./*.apk | xargs -n1 basename | paste -sd',' -)"
          echo "MANAGER_APK_NAMES=${MANAGER_APK_NAMES}" >> "$GITHUB_ENV"

          echo "NoMount resolved to $NM_SHA ($NM_MODE) — using the module built from source in this run"
          MODULE_ZIP="$(find . -type f -name 'NoMount-*.zip' | head -n1)"
          if [ -z "$MODULE_ZIP" ]; then
            echo "::error::Built NoMount module zip was not found in ./downloaded-artifacts (build-nomount-module job)"
            echo "::group::Staging diagnostics"
            find . -maxdepth 2 -print | head -80
            echo "::endgroup::"
            exit 1
          fi
          if [ -f "${MODULE_ZIP}.sha256" ]; then
            sha256sum --check --status "${MODULE_ZIP}.sha256" || { echo "::error::NoMount module zip failed its SHA256 sidecar check"; exit 1; }
            echo "✅ Built module SHA256 verified (sidecar)"
          fi
          unzip -t "$MODULE_ZIP" > /dev/null || { echo "::error::Built NoMount module zip is corrupt"; exit 1; }
          echo "module.prop name/version line:"
          unzip -p "$MODULE_ZIP" module.prop | grep -E '^(name|version)='
          unzip -l "$MODULE_ZIP" | grep -E 'bin/nm-arm64|bin/nm-arm' || { echo "::error::Built module zip is missing the nm binaries"; exit 1; }
          UNZIP_SHA="$(unzip -p "$MODULE_ZIP" NOMOUNT_SOURCE_COMMIT | tr -d '[:space:]')"
          if [ "$UNZIP_SHA" != "$NM_SHA" ]; then
            echo "::error::Provenance mismatch: module was built from $UNZIP_SHA but kernels integrated $NM_SHA"
            exit 1
          fi
          echo "✅ Provenance verified: module source commit == kernel-integrated commit ($NM_SHA)"
          sha256sum ./AK3_*.zip ./NoMount-*.zip ./*.apk > SHA256SUMS.txt

      - name: 📝 Generate Device List and Final Release Notes
        id: generate-notes
        run: |
          echo "=== Start building the release notes ==="

          declare -A device_info

          for file in $(find downloaded-artifacts -maxdepth 1 -name "AK3_*.zip" -type f | sort); do
            if [ -f "$file" ]; then
              zipname=$(basename "$file" .zip)
              rest="${zipname#AK3_}"
              IFS='_' read -ra parts <<< "$rest"
              model="${parts[0]}"
              os_version="${parts[1]}"
              kernel_version="${parts[2]}"
              ksu_type="${parts[3]}"
              ksu_ver="${parts[4]}"
              if [ "${parts[5]:-}" = "SuSFS" ]; then
                susfs_ver="${parts[6]:-unknown}"
              else
                susfs_ver="none"
              fi
              full_model="${model}_${os_version}_${kernel_version}"
              device_info["$full_model"]="$model|$os_version|$kernel_version|$ksu_type|$ksu_ver|$susfs_ver|$zipname"
            fi
          done

          ksu_type="${{ inputs.ksu_type }}"
          ksu_ref="${{ inputs.ksu_branch_or_hash }}"
          ksu_resolved_hash="${{ needs.set-op-model.outputs.ksu_resolved_hash }}"

          OPTIMIZE_LEVEL="${{ inputs.optimize_level }}"
          CLEAN_BUILD="${{ contains(inputs.build_profile, 'clean') }}"

          declare -A susfs_map=(
            ["android12-5.10"]="${{ needs.set-op-model.outputs.susfs_hash_android12_5_10 }}"
            ["android13-5.15"]="${{ needs.set-op-model.outputs.susfs_hash_android13_5_15 }}"
            ["android14-6.1"]="${{ needs.set-op-model.outputs.susfs_hash_android14_6_1 }}"
            ["android15-6.6"]="${{ needs.set-op-model.outputs.susfs_hash_android15_6_6 }}"
            ["android16-6.12"]="${{ needs.set-op-model.outputs.susfs_hash_android16_6_12 }}"
          )

          IFS=',' read -ra active_gki_keys \
            <<< "${{ needs.set-op-model.outputs.active_gki_keys }}"

          cat << EOF > release_notes.md
          # 🎯 OnePlus Kernels with $ROOT_DISPLAY, SUSFS $SUSFS_BASE_VERSION, and NoMount

          > **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')  
          > **Build ID:** \`${{ github.run_id }}\`  
          > **Workflow:** [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ## 📦 Built Devices (${#device_info[@]} total)

          | Model | OS Version | Kernel Version | Features |
          |-------|------------|----------------|----------|
          EOF

          while IFS= read -r full_key; do
            [ -z "$full_key" ] && continue

            IFS='|' read -r model os_ver kernel_ver _ _ _ zipfile <<< "${device_info["$full_key"]}"

            features=()
            status_file="./downloaded-artifacts/patch-status-${model}_${os_ver}.txt"
            if [[ ! -f "$status_file" ]]; then
              status_file="$(find ./downloaded-artifacts -maxdepth 2 -name "patch-status-${model}_${os_ver}.txt" 2>/dev/null | head -n1 || true)"
            fi
            if [[ ! -f "$status_file" ]]; then
              status_file="./downloaded-artifacts/patch-status-${model}-${kernel_ver}_${os_ver}.txt"
            fi
            if [[ ! -f "$status_file" && -f "./downloaded-artifacts/patch-status-${model}_${os_ver}.zip" ]]; then
              echo "::warning::patch-status-${model}_${os_ver} arrived as a zip container; unwrapping"
              unzip -o -q "./downloaded-artifacts/patch-status-${model}_${os_ver}.zip" -d ./downloaded-artifacts 2>/dev/null || true
              status_file="$(find ./downloaded-artifacts -maxdepth 2 -name "patch-status-${model}_${os_ver}.txt" 2>/dev/null | head -n1 || true)"
            fi
            if [[ -f "$status_file" ]]; then
              while IFS='|' read -r patch_key patch_status; do
                [[ "$patch_status" == "applied" || "$patch_status" == "already" ]] || continue
                case "$patch_key" in
                  hmbird) features+=("🐦 HMBIRD") ;;
                  susfs) features+=("ඞ SusFS") ;;
                  bbr) features+=("🚀 BBR") ;;
                  bbg) features+=("🛡️ BBG") ;;
                  ttl) features+=("🌐 TTL") ;;
                  ip_set) features+=("🧱 IP_SET & IPv6 NAT") ;;
                  unicode) features+=("🔧 Unicode Fix") ;;
                  ds) features+=("💻 Droidspaces") ;;
                  ntsync) features+=("🔃 NTSync") ;;
                  bbrv3) features+=("🚀 BBRv3") ;;
                  bore) features+=("🌀 BoRE") ;;
                  lz4) features+=("⚡ LZ4 1.10.0 + ARMv8 NEON") ;;
                  zstd-upgrade) features+=("🗜️ zstd 1.5.7 + tunable level") ;;
                  rtmutex-cve) features+=("🔒 CVE-2026-43499 fix") ;;
                  adios) features+=("🧭 ADIOS") ;;
                esac
              done < "$status_file"
            else
              echo "::warning::patch status file missing for ${model}_${os_ver}; Features column will show N/A"
            fi

            total=${#features[@]}
            if [ "$total" -eq 0 ]; then
              features_str="N/A"
            else
              features_str=""
              count=0
              for item in "${features[@]}"; do
                count=$((count + 1))
                features_str+="$item"
                if [ "$count" -lt "$total" ]; then
                  if [ $((count % 3)) -eq 0 ]; then
                    features_str+="<br>"
                  else
                    features_str+="   "
                  fi
                fi
              done
            fi

            if [[ "$os_ver" =~ ^A[0-9]+$ ]]; then
              os_display_version="OxygenOS ${os_ver#A}"
            else
              os_display_version=$os_ver
            fi

            download_url="https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/${NEW_TAG}/${zipfile}.zip"
            model_link="[$model]($download_url)"
            printf "| %s | %-10s | %-16s | %-48s |\n" \
              "$model_link" "$os_display_version" "$kernel_ver" "$features_str" >> release_notes.md
          done < <(printf '%s\n' "${!device_info[@]}" | sort)

          if [ ${#device_info[@]} -gt 0 ]; then
            first_entry=$(printf '%s\n' "${!device_info[@]}" | sort | head -n1)
            IFS='|' read -r _ _ _ _ ksu_ver_global _ _ <<< "${device_info["$first_entry"]}"
          else
            echo "::error::No device info found!" >&2
            exit 1
          fi
          MANAGER_SRC="${MANAGER_RUN_URL:-}"

          cat << EOF >> release_notes.md

          ---

          ## 🔧 Build Configuration

          | Component | Version/Setting |
          |-----------|----------------|
          EOF
          ksu_display_value() {
            local input="$1"
            local resolved="$2"
            if [[ "$input" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$input"
            else
              echo "$input ($resolved)"
            fi
          }

          ksu_display=$(ksu_display_value "$ksu_ref" "$ksu_resolved_hash")
          if [ "$ksu_type" = "KSUN" ]; then
            cat << EOF >> release_notes.md
          | **KernelSU Next Branch/Hash** | \`$ksu_display\` |
          | **KernelSU Next Version** | \`$ksu_ver_global\` |
          EOF
          elif [ "$ksu_type" = "BakaSU" ]; then
            cat << EOF >> release_notes.md
          | **BakaSU Branch/Hash** | \`$ksu_display\` |
          | **BakaSU Version** | \`$ksu_ver_global\` |
          EOF
          elif [ "$ksu_type" == "KSU" ]; then
            cat << EOF >> release_notes.md
          | **KernelSU Branch** | \`$ksu_display\` |
          | **KernelSU Version** | \`$ksu_ver_global\` |
          EOF
          fi

          cat << EOF >> release_notes.md
          | **SUSFS Version** | \`$SUSFS_BASE_VERSION\` |
          | **Optimization Level** | \`$OPTIMIZE_LEVEL\` |
          | **Clean Build** | $( [ "$CLEAN_BUILD" = "true" ] && echo "✅ Yes (no ccache)" || echo "❌ No (ccache enabled)" ) |
          | **Compiler** | Clang (version varies by device) |

          ### 📌 SUSFS Branch Mapping

          | Kernel Version | SUSFS Commit |
          |----------------|--------------|
          $(for key in "${active_gki_keys[@]}"; do
            echo "| $key | \`${susfs_map[$key]:-unknown}\` |"
          done)
          EOF
          cat << EOF >> release_notes.md

          ---

          ## ✨ Features & Capabilities

          ### 🔐 Root Management
          EOF
          if [ "$ksu_type" == "KSUN" ]; then
            cat << EOF >> release_notes.md
          - **KernelSU Next** - Kernel-level root integration
          EOF
          elif [ "$ksu_type" == "BakaSU" ]; then
            cat << EOF >> release_notes.md
          - **BakaSU** - Kernel-based Android root integration
          EOF
          elif [ "$ksu_type" == "KSU" ]; then
            cat << EOF >> release_notes.md
          - **KernelSU** - Kernel-level root solution
          EOF
          fi
          cat << EOF >> release_notes.md
          - **SUSFS** - Advanced hiding and security features
          - **NoMount** - Kernel-side integration from [`$NM_SHA`](https://github.com/maxsteeel/nomount/commit/$NM_SHA) ($NM_MODE)
          EOF
          if [[ "${ksu_ver_global:-0}" =~ ^[0-9]+$ ]] && [ "${ksu_ver_global}" -lt 12884 ]; then
            cat << EOF >> release_notes.md
          - **Manual Hooks** - scope_min_manual_hooks_v1.4 for better compatibility
          EOF
          fi
          cat << EOF >> release_notes.md

          ### 🛡️ Security & Privacy
          - **Baseband Guard (BBG)** - LSM-based baseband security
          - **SUSFS Hide Features**:
            - ✅ SUS_PATH - Hide suspicious paths
            - ✅ SUS_MOUNT - Hide mount points (No Cli Support)
            - ✅ SUS_KSTAT - Spoof kernel statistics
            - ✅ SPOOF_UNAME - Kernel version spoofing
            - ✅ SPOOF_CMDLINE - Boot parameters spoofing
            - ✅ OPEN_REDIRECT - File access redirection
            - ✅ SUS_MAP - Memory mapping protection
            - ✅ AVC_SPOOF - Spoof Procfs avc denial logs
          - **Ptrace Leak Fix** - For kernels < 5.16
          - **Unicode Fix** - Prevent path traversal and other detections using non-printable Unicode codepoints [Experimental]

          ### 🚀 Performance & Networking
          - **BBR with FQ/FQ-CoDel** - TCP congestion-control and queueing support
          - **IPSet & IPv6 NAT** - IP set matching, IPv6 masquerading, and NAT support
          - **TTL / hop-limit targets** - IPv4 TTL and IPv6 hop-limit Netfilter targets
          - **Per-device LTO** - Enabled only where the device configuration supports it
          - **Performance tuning** - Memory, I/O, CPU-frequency, scheduler, storage, network, and log-spam improvements

          ### 🔧 System Features
          - **TMPFS_XATTR** - Extended attributes for tmpfs (Mountify support)
          - **TMPFS_POSIX_ACL** - POSIX ACLs for tmpfs
          - **Module intercept and overlay mechanism** - Device-specific module overlay support
          - **Droidspaces** - Portable Linux container prerequisites
          - **NTSync** - Windows NT synchronization primitives for compatible userspace
          - **USB DWC3 / OTG** - Dual-role USB, gadget, Type-C, and device-specific PHY support

          ---

          ## 📱 ${ROOT_DISPLAY:-$ksu_type} Manager

          - Commit-exact manager build for this release: [`${KSU_SHA:0:12}`](${MANAGER_SRC})
          - Required SUSFS module: [sidex15/ksu_module_susfs](https://github.com/sidex15/ksu_module_susfs/releases)
          - Recommended flasher: [Kernel Flasher](https://github.com/fatalcoder524/KernelFlasher/releases)

          ---

          ## 📥 Installation Instructions

          ### Prerequisites
          - Unlocked bootloader.
          - Backup your current boot image.
          - Have root access using Magisk / KernelSU / Apatch (Any forks).

          ### Via Kernel Flasher
          1. Download the appropriate ZIP for your device.
          2. Flash the ZIP file using Kernel Flasher.
          3. Reboot system.
          4. Install the ${ROOT_DISPLAY:-$ksu_type} manager.

          ---

          ## 📜 Changelog

          ### This Release
          - Per-device Features in the table above reflect only what actually applied in this build.

          ### Previous Releases
          See [Releases Page](${{ github.server_url }}/${{ github.repository }}/releases)

          ---

          ## 🙏 Credits

          EOF
          if [ "$ksu_type" == "KSUN" ]; then
            cat << EOF >> release_notes.md
          - **[KernelSU Next Team](https://github.com/KernelSU-Next/KernelSU-Next)** - Root solution
          EOF
          elif [ "$ksu_type" == "BakaSU" ]; then
            cat << EOF >> release_notes.md
          - **[BakaSU Team](https://github.com/Baka-SU/BakaSU)** - Root solution
          EOF
          elif [ "$ksu_type" == "KSU" ]; then
            cat << EOF >> release_notes.md
          - **[KernelSU / tiann](https://github.com/tiann/KernelSU)** - Root solution
          EOF
          fi
          cat << EOF >> release_notes.md
          - **[simonpunk](https://gitlab.com/simonpunk/susfs4ksu)** - SUSFS development
          - **[MaxSteel](https://github.com/maxsteeel/nomount)** - NoMount integration
          - **[OnePlus](https://github.com/OnePlusOSS)** - Kernel source code
          - **[Community Contributors](https://github.com/${{ github.repository }}/graphs/contributors)** - Testing and feedback

          ---

          **⚡ RealS3S Kernel Lab**

          EOF

          echo "--- Final Release Notes ---"
          cat release_notes.md
          echo "✅ Release notes generated"

      - name: 🚀 Create GitHub Release
        run: |
          gh release create "${{ env.NEW_TAG }}" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_notes.md \
            --draft

      - name: 📤 Upload Release Assets Dynamically
        run: |
          shopt -s nullglob
          for file in ./downloaded-artifacts/AK3_*.zip ./downloaded-artifacts/NoMount-*.zip; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "${{ env.NEW_TAG }}" "$file" --clobber
            fi
          done
          for file in ./downloaded-artifacts/*.apk ./downloaded-artifacts/NoMount-*.zip.sha256 ./downloaded-artifacts/SHA256SUMS.txt; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "${{ env.NEW_TAG }}" "$file" --clobber
            fi
          done

      - name: ✅ Publish complete release
        run: |
          gh release edit "${{ env.NEW_TAG }}" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --draft=false

      - name: 📊 Release summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF

          ---

          ## 🎉 Release Created Successfully

          **Tag:** [\`${{ env.NEW_TAG }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }})  
          **Kernels:** $(find ./downloaded-artifacts -maxdepth 1 -name "AK3_*.zip" -type f | wc -l)

          ### 📦 Assets
          EOF

          shopt -s nullglob
          for zip in ./downloaded-artifacts/AK3_*.zip ./downloaded-artifacts/NoMount-*.zip; do
            if [ -f "$zip" ]; then
              name=$(basename "$zip")
              size=$(stat -c%s "$zip")
              size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
              echo "- \`$name\` (${size_mb} MB)" >> $GITHUB_STEP_SUMMARY
            fi
          done

  record-last-successful-pins:
    name: 📌 Record refs as "last successful run" pins
    needs: [set-op-model, resolve-nomount, build]
    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      needs.resolve-nomount.result == 'success' &&
      needs.build.result == 'success' &&
      !contains(inputs.run_mode, 'patch') &&
      needs.set-op-model.outputs.device_count != '0'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PINS_ARTIFACT: last-success-pins
    steps:
      - name: 📌 Store effective refs (Root manager / SUSFS per GKI / NoMount)
        shell: bash
        env:
          MATRIX_JSON: ${{ needs.set-op-model.outputs.matrix }}
        run: |
          set -euo pipefail
          echo "::group::Record last-successful pins"

          new_pins=$(jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg ksu_type "${{ inputs.ksu_type }}" \
            --arg ksu_sha "${{ needs.set-op-model.outputs.ksu_resolved_hash }}" \
            --arg nomount "${{ needs.resolve-nomount.outputs.nomount_commit }}" \
            --arg a12 "${{ needs.set-op-model.outputs.susfs_hash_android12_5_10 }}" \
            --arg a13 "${{ needs.set-op-model.outputs.susfs_hash_android13_5_15 }}" \
            --arg a14 "${{ needs.set-op-model.outputs.susfs_hash_android14_6_1 }}" \
            --arg a15 "${{ needs.set-op-model.outputs.susfs_hash_android15_6_6 }}" \
            --arg a16 "${{ needs.set-op-model.outputs.susfs_hash_android16_6_12 }}" \
            '{
              recorded_at: $ts,
              run_id: $run_id,
              run_url: $run_url,
              ksu_type: $ksu_type,
              ksu_sha: $ksu_sha,
              nomount_commit: $nomount,
              susfs: (
                {}
                + (if ($a12 | test("^[0-9a-f]{40}$")) then {"android12-5.10": $a12} else {} end)
                + (if ($a13 | test("^[0-9a-f]{40}$")) then {"android13-5.15": $a13} else {} end)
                + (if ($a14 | test("^[0-9a-f]{40}$")) then {"android14-6.1":  $a14} else {} end)
                + (if ($a15 | test("^[0-9a-f]{40}$")) then {"android15-6.6":  $a15} else {} end)
                + (if ($a16 | test("^[0-9a-f]{40}$")) then {"android16-6.12": $a16} else {} end)
              )
            }')

          old_pins="{}"
          old_art="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${PINS_ARTIFACT}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty' 2>/dev/null || true)"
          if [ -z "$old_art" ]; then
            old_art="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pins.json&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty' 2>/dev/null || true)"
          fi
          if [ -n "$old_art" ]; then
            rm -rf pins_prev && mkdir -p pins_prev
            gh api "repos/${{ github.repository }}/actions/artifacts/$old_art/zip" > pins_prev/dl.bin 2>/dev/null || true
            if [ "$(head -c 2 pins_prev/dl.bin 2>/dev/null)" = "PK" ]; then
              unzip -oq pins_prev/dl.bin -d pins_prev || true
            else
              mv pins_prev/dl.bin pins_prev/last-success-pins 2>/dev/null || true
            fi
            raw="$(cat pins_prev/last-success-pins 2>/dev/null || true)"
            [ -n "$raw" ] || raw="$(cat pins_prev/pins.json 2>/dev/null || true)"
            if [ -n "$raw" ] && echo "$raw" | jq -e . >/dev/null 2>&1; then
              old_pins="$raw"
              echo "  📥 Previous pin artifact $old_art loaded"
            fi
            rm -rf pins_prev
          fi

          merged=$(jq -n --argjson new "$new_pins" --argjson old "$old_pins" \
            '$new + {susfs: (($old.susfs // {}) + ($new.susfs // {}))}')

          printf '%s' "$merged" > last-success-pins
          jq -e . last-success-pins >/dev/null || { echo "::error::Generated pin store is not valid JSON"; exit 1; }
          echo "  ✅ last-success-pins ready: $(jq -c . last-success-pins)"

          {
            echo "## 📌 Last-successful pins recorded"
            echo ""
            echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "**Devices covered by this success:**"
            jq -r '(.include // [])[] | "- \(.os_version)/\(.model) (\(.android_version)-\(.kernel_version))"' <<<"$MATRIX_JSON"
            echo ""
            echo "**Root manager:** \`${{ inputs.ksu_type }}\` → \`${{ needs.set-op-model.outputs.ksu_resolved_hash }}\`"
            echo "**NoMount:** → \`${{ needs.resolve-nomount.outputs.nomount_commit }}\`"
            echo ""
            echo "**SUSFS pins in store (per GKI/KMI):**"
            echo '\`\`\`'
            jq -r '.susfs | to_entries[] | "\(.key) → \(.value)"' <<<"$merged"
            echo '\`\`\`'
            echo ""
            echo "> Next run with a **\"Same as last successful run\"** toggle ON reuses exactly these refs."
            echo "> Store location: single rolling artifact \`${PINS_ARTIFACT}\` (always overwritten, 90-day retention — no git history, no branches)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"
          echo "✅ Pins recorded"

      - name: ⬆️ Publish pin store (single rolling artifact, 90-day retention)
        id: upload-pins
        uses: actions/upload-artifact@v7
        with:
          name: last-success-pins
          path: last-success-pins
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: 🧹 Prune superseded pin artifacts (keep only the latest)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Prune old pin artifacts"
          keep="${{ steps.upload-pins.outputs.artifact-id }}"
          if [ -z "$keep" ]; then
            keep="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${PINS_ARTIFACT}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | last | .id // empty')"
          fi
          if [ -z "$keep" ]; then
            echo "::error::No live ${PINS_ARTIFACT} artifact found after upload"
            exit 1
          fi
          deleted=0
          while read -r art_id; do
            if [ -z "$art_id" ]; then continue; fi
            if [ "$art_id" = "$keep" ]; then continue; fi
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$art_id" >/dev/null 2>&1; then
              echo "  🗑️  deleted superseded pin artifact $art_id"
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete superseded pin artifact $art_id — 90-day retention will reap it"
            fi
          done < <(gh api "repos/${{ github.repository }}/actions/artifacts?name=${PINS_ARTIFACT}&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          while read -r art_id; do
            if [ -z "$art_id" ]; then continue; fi
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$art_id" >/dev/null 2>&1; then
              echo "  🗑️  deleted legacy pin artifact $art_id (name 'pins.json')"
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete legacy pin artifact $art_id — 90-day retention will reap it"
            fi
          done < <(gh api "repos/${{ github.repository }}/actions/artifacts?name=pins.json&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          echo "  ✅ Pin store is singular: kept artifact $keep, pruned $deleted superseded"
          echo "::endgroup::"
