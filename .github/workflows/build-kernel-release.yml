          - OP-OPEN-5.15.167
          - OP-PAD-2-MT6991
          - OP-PAD-2-PRO
          - OP-PAD-2-PRO-6.6.89
          - OP-PAD-2-SM8650
          - OP-PAD-3-MT6897
          - OP-PAD-3-PRO
          - OP-PAD-3-SM8750
          - OP-PAD-3-SM8750-6.6.89
          - OP-PAD-4
          - OP-PAD-GO-2
          - OP-PAD-LITE
          - OP-PAD-MT6983
          - OP-PAD-PRO
          - OP-TURBO-6
          - OP-TURBO-6V
          - OP-TURBO-6V-6.1.118
          - OP-TURBO-6X
          - OP10pro
          - OP11
          - OP11-5.15.167
          - OP11r
          - OP12
