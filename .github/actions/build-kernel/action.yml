name: 'Build OnePlus Kernel with KernelSU Next / KernelSU / BakaSU'
description: 'GitHub Action to build OnePlus kernels with KernelSU Next, KernelSU, or BakaSU plus SUSFS and NoMount integration'
inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  ksu_type:
    description: 'Select KSU Type'
    required: true
    type: choice
    options:
      - KSU
      - BakaSU
      - KSUN
  ksu_branch_or_hash:
    description: 'KSU branch or commit hash (empty = auto-detect by ksu_type)'
    required: false
    type: string
    default: ""
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash (empty = auto-detect by kernel version)'
    required: false
    type: string
    default: ""
  nomount_commit:
    description: 'NoMount commit SHA to pin (empty = built-in known-good fallback pin)'
    required: false
    type: string
    default: ""
  use_rekernel:
    description: 'Integrate the Re-Kernel driver in-tree (CONFIG_REKERNEL, netlink freeze/kill notifier, manager-agnostic)'
    required: false
    type: boolean
    default: false
  resolved_uname:
    description: 'uname suffix resolved by the workflow (dispatch override > config uname > generated). Empty = resolve here: config uname, else scripts/uname/gen-oem-uname.sh. Never compiles without a suffix'
    required: false
    type: string
    default: ''
  build_timestamp:
    description: 'Custom kernel build timestamp shown in uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty to use the current build time.'
    required: false
    type: string
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    type: string
    default: O2
  clean:
    description: 'Force clean build without ccache acceleration'
    required: false
    type: boolean
    default: false
  debug:
    description: 'Enable dumping debug related artifacts'
    required: false
    type: boolean
    default: false
  patch_dry_run:
    description: 'Apply all patches and stop before compilation (verification mode)'
    required: false
    type: boolean
    default: false
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'KernelSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'KernelSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    description: 'SUSFS version string'
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  nomount_commit:
    description: 'NoMount dev commit integrated into the kernel'
    value: ${{ steps.save_metadata.outputs.nomount_commit }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.save_metadata.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    description: 'Number of compiler warnings'
    value: ${{ steps.collect_stats.outputs.warnings_count }}
  build_time:
    description: 'Total build time in seconds'
    value: ${{ steps.collect_stats.outputs.build_time }}
  ccache_hit_rate:
    description: 'ccache hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    description: 'ccache direct hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.direct_rate }}
  zip_name:
    description: 'Name of the generated flashable ZIP'
    value: ${{ steps.create_zip.outputs.zip_name }}

runs:
  using: 'composite'
  steps:
    - name: Get Action info
      shell: bash
      env:
        ACTION_REPO_VAL: ${{ github.action_repository }}
        ACTION_REF_VAL: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        echo "ACTION_REPO=$ACTION_REPO_VAL" >> $GITHUB_ENV
        echo "ACTION_REF=$ACTION_REF_VAL" >> $GITHUB_ENV
        if [ -n "$ACTION_REPO_VAL" ] && [ -n "$ACTION_REF_VAL" ]; then
          echo "✅ Action info resolved (remote action: $ACTION_REPO_VAL @ $ACTION_REF_VAL)"
        else
          echo "✅ Action info resolved (local composite action — repo/ref empty by design, checkout falls back to self)"
        fi

    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      with:
        repository: ${{ env.ACTION_REPO }}
        ref: ${{ env.ACTION_REF }}
        path: action-source
        fetch-depth: 1

    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        P_MODEL="$(jq -r '.model // "unknown"' /tmp/config.json)"
        P_OSVER="$(jq -r '.os_version // "unknown"' /tmp/config.json)"
        # Keep the full model string (including any -X.Y.Z kernel-version suffix):
        # versioned configs must not share patch-status artifacts with base configs.
        PS_BASE="${P_MODEL}_${P_OSVER}"
        echo "PS_BASE=$PS_BASE" >> "$GITHUB_ENV"
        echo "PS_FILE=$GITHUB_WORKSPACE/patch-status-$PS_BASE.txt" >> "$GITHUB_ENV"
        # Default only when the config omits the key. Do NOT test ${OP_BORE:-} here:
        # the to_entries export above only lands in LATER steps, so OP_BORE is always
        # unset in this same step and an unconditional default would clobber a parsed
        # bore:false (last GITHUB_ENV write wins).
        # BoRE is experimental: by owner decision it defaults to OFF when the key is missing
        # (explicit exception to the default-on rule). Re-enable per config with "bore": true.
        if ! jq -e 'has("bore")' /tmp/config.json >/dev/null; then
          echo "OP_BORE=false" >> "$GITHUB_ENV"
        fi
        # Same defaulting rule for the WildKernels' optimisations bundle: when the
        # config omits "opt", keep the historical always-apply behaviour.
        if ! jq -e 'has("opt")' /tmp/config.json >/dev/null; then
          echo "OP_OPT=true" >> "$GITHUB_ENV"
        fi
        # Same defaulting rule for the zstd 1.5.7 upgrade (cctv18 6.12 port): when
        # the config omits "zstd_upgrade", keep it enabled (step is 6.12-gated).
        if ! jq -e 'has("zstd_upgrade")' /tmp/config.json >/dev/null; then
          echo "OP_ZSTD_UPGRADE=true" >> "$GITHUB_ENV"
        fi
        # Same defaulting rule for the CVE-2026-43499 rtmutex fix: when the config
        # omits "rtmutex_cve", keep it enabled (step is 6.12-gated).
        if ! jq -e 'has("rtmutex_cve")' /tmp/config.json >/dev/null; then
          echo "OP_RTMUTEX_CVE=true" >> "$GITHUB_ENV"
        fi
        echo "Parsed config:"
        jq '.' /tmp/config.json
        jq -e . /tmp/config.json >/dev/null
        echo "✅ op_config.json parsed (model=$P_MODEL, os=$P_OSVER, PS_BASE=$PS_BASE)"

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Validate inputs"
        model="$OP_MODEL"
        soc="$OP_SOC"
        branch="$OP_BRANCH"
        manifest="$OP_MANIFEST"
        android_version="$OP_ANDROID_VERSION"
        kernel_version="$OP_KERNEL_VERSION"
        os_version="$OP_OS_VERSION"
        hmbird="$OP_HMBIRD"
        susfs="$OP_SUSFS"
        bbg="$OP_BBG"
        bbr="$OP_BBR"
        ttl="$OP_TTL"
        ip_set="$OP_IP_SET"
        rust_build="$OP_RUST_BUILD"
        lto="$OP_LTO"
        uname="${{ inputs.resolved_uname }}"
        uname="${uname:-${OP_UNAME:-}}"
        unicode="$OP_UNICODE"
        c_compiler="$OP_C_COMPILER"
        rust_compiler="$OP_RUST_COMPILER"
        zyc_compiler="$OP_ZYC_COMPILER"
        bindgen="$OP_BINDGEN"
        ds="$OP_DS"
        ntsync="$OP_NTSYNC"
        optimize='${{ inputs.optimize_level }}'
        
        errors=()
        
        if [[ -z "$model" ]]; then
          errors+=("Input 'model' cannot be empty")
        elif [[ ! "$model" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          errors+=("Input 'model' contains invalid characters. Allowed: letters, digits, ., _, - (starting with a letter or digit). Got: '$model'")
        fi
        
        if [[ -z "$soc" ]]; then
          errors+=("Input 'soc' cannot be empty")
        elif [[ ! "$soc" =~ ^[A-Za-z0-9_-]+$ ]]; then
          errors+=("Input 'soc' contains invalid characters. Allowed: letters, digits, underscore, dash. Got: '$soc'")
        fi
        
        if [[ -z "$branch" ]]; then
          errors+=("Input 'branch' cannot be empty")
        elif [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          errors+=("Input 'branch' contains invalid characters. Allowed: letters, digits, ., _, -, /. Got: '$branch'")
        fi
        
        if [[ -z "$manifest" ]]; then
          errors+=("Input 'manifest' cannot be empty")
        elif [[ "$manifest" == http*://* ]]; then
          if [[ ! "$manifest" =~ ^https:// ]]; then
            errors+=("Manifest URL must be HTTPS. Got: '$manifest'")
          fi
          if [[ ! "$manifest" =~ \.xml($|\?) ]]; then
            errors+=("Manifest URL should point to an XML file (.xml). Got: '$manifest'")
          fi
        else
          if [[ ! "$manifest" =~ \.xml$ ]]; then
            errors+=("Manifest filename must end with .xml. Got: '$manifest'")
          fi
          if [[ "$manifest" =~ [[:space:]] ]]; then
            errors+=("Manifest filename cannot contain spaces. Got: '$manifest'")
          fi
        fi
        
        if [[ -z "$android_version" ]]; then
          errors+=("Input 'android_version' cannot be empty")
        elif [[ ! "$android_version" =~ ^android[0-9]+$ ]]; then
          errors+=("Input 'android_version' contains invalid characters. Allowed: android followed by a number. Got: '$android_version'")
        fi
        
        if [[ -z "$kernel_version" ]]; then
          errors+=("Input 'kernel_version' cannot be empty")
        elif [[ ! "$kernel_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
          errors+=("Input 'kernel_version' contains invalid characters. Allowed: number in X.Y format. Got: '$kernel_version'")
        fi
        
        if [[ -z "$os_version" ]]; then
          errors+=("Input 'os_version' cannot be empty")
        elif [[ ! "$os_version" =~ ^A[0-9]+$ ]]; then
          errors+=("Input 'os_version' must match A<number> (A14, A15, A16). Got: '$os_version'")
        fi
        
        if [[ -z "$hmbird" ]]; then
          errors+=("Input 'hmbird' cannot be empty")
        elif [[ "$hmbird" != "true" && "$hmbird" != "false" ]]; then
          errors+=("Input 'hmbird' contains invalid characters. Allowed: 'true' or 'false'. Got: '$hmbird'")
        fi
        
        if [[ -z "$susfs" ]]; then
          errors+=("Input 'susfs' cannot be empty")
        elif [[ "$susfs" != "true" && "$susfs" != "false" ]]; then
          errors+=("Input 'susfs' contains invalid characters. Allowed: 'true' or 'false'. Got: '$susfs'")
        fi
        
        if [[ -z "$bbg" ]]; then
          errors+=("Input 'bbg' cannot be empty")
        elif [[ "$bbg" != "true" && "$bbg" != "false" ]]; then
          errors+=("Input 'bbg' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbg'")
        fi
        
        if [[ -z "$bbr" ]]; then
          errors+=("Input 'bbr' cannot be empty")
        elif [[ "$bbr" != "true" && "$bbr" != "false" ]]; then
          errors+=("Input 'bbr' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr'")
        fi
        
        if [[ -z "$ttl" ]]; then
          errors+=("Input 'ttl' cannot be empty")
        elif [[ "$ttl" != "true" && "$ttl" != "false" ]]; then
          errors+=("Input 'ttl' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ttl'")
        fi
        
        if [[ -z "$ip_set" ]]; then
          errors+=("Input 'ip_set' cannot be empty")
        elif [[ "$ip_set" != "true" && "$ip_set" != "false" ]]; then
          errors+=("Input 'ip_set' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ip_set'")
        fi
        
        if [[ -z "$rust_build" ]]; then
          errors+=("Input 'rust_build' cannot be empty")
        elif [[ "$rust_build" != "true" && "$rust_build" != "false" ]]; then
          errors+=("Input 'rust_build' contains invalid characters. Allowed: 'true' or 'false'. Got: '$rust_build'")
        fi
        
        if [[ -z "$lto" ]]; then
          errors+=("Input 'lto' cannot be empty")
        elif [[ "$lto" != "none" && "$lto" != "thin" && "$lto" != "full" ]]; then
          errors+=("Input 'lto' contains invalid characters. Allowed: 'thin', 'full' or 'none'. Got: '$lto'")
        fi
        
        # Empty uname here means "generate at the branding step" (gen-oem-uname.sh) — never "compile bare".
        if [[ -n "$uname" && ${#uname} -gt 44 ]]; then
          errors+=("Input 'uname' too long. Maximum length: 44. Got: '$uname'")
        elif [[ -n "$uname" && ! "$uname" =~ ^[A-Za-z0-9._+-]+$ ]]; then
          errors+=("Input 'uname' contains invalid characters. Allowed: A-Z a-z 0-9 . _ + -. Got: '$uname'")
        fi
        
        if [[ -z "$unicode" ]]; then
          errors+=("Input 'unicode' cannot be empty")
        elif [[ "$unicode" != "true" && "$unicode" != "false" ]]; then
          errors+=("Input 'unicode' contains invalid characters. Allowed: 'true' or 'false'. Got: '$unicode'")
        fi
        
        # OP_C_COMPILER currently has no checks!
        
        # OP_RUST_COMPILER currently has no checks!
        
        # OP_ZYC_COMPILER currently has no checks!
        
        # OP_BINDGEN currently has no checks!
        
        if [[ -z "$ds" ]]; then
          errors+=("Input 'ds' cannot be empty")
        elif [[ "$ds" != "true" && "$ds" != "false" ]]; then
          errors+=("Input 'ds' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ds'")
        fi
        
        if [[ -z "$ntsync" ]]; then
          errors+=("Input 'ntsync' cannot be empty")
        elif [[ "$ntsync" != "true" && "$ntsync" != "false" ]]; then
          errors+=("Input 'ntsync' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ntsync'")
        fi
        
        case "$optimize" in
          O2|O3) ;;
          *) errors+=("optimize_level must be O2 or O3. Got: '$optimize'"); ;;
        esac
        
        for bool_opt in OP_LZ4_UPGRADE OP_ZSTD_UPGRADE OP_ADIOS OP_RTMUTEX_CVE OP_BBR3 OP_BORE; do
          val="${!bool_opt:-}"
          if [[ -n "$val" && "$val" != "true" && "$val" != "false" ]]; then
            errors+=("$bool_opt must be true or false if set. Got: '$val'")
          fi
        done
        if [ ${#errors[@]} -ne 0 ]; then
          echo "Found ${#errors[@]} validation error(s):" >&2
          for error in "${errors[@]}"; do
            echo "  - $error" >&2
          done
          echo "::error::Input validation failed. See logs for details."
          exit 1
        else
          echo "✅ Input validation passed"
        fi
        echo "::endgroup::"

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="$OP_MODEL"
        echo "Creating folder for configuration: $CONFIG"
        mkdir -p "$CONFIG"
        echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
        REPO="/usr/local/bin/repo"
        if [ ! -x "$REPO" ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$REPO"
          chmod +x "$REPO"
        fi
        echo "REPO=$REPO" >> "$GITHUB_ENV"
        [ -x "$REPO" ] || { echo "::error::repo tool not executable at $REPO"; exit 1; }
        [ -d "$CONFIG" ] || { echo "::error::config folder $CONFIG missing"; exit 1; }
        echo "✅ Base environment ready (repo tool installed, config folder: $CONFIG)"

    - name: Optimize Global Git for Repo Tool
      shell: bash
      run: |
        set -euo pipefail
        git config --global feature.manyFiles true
        git config --global core.fsmonitor true
        git config --global pack.sparse true
        [ "$(git config --global feature.manyFiles)" = "true" ] && [ "$(git config --global core.fsmonitor)" = "true" ] && [ "$(git config --global pack.sparse)" = "true" ] || { echo "::error::global git optimizations not applied"; exit 1; }
        echo "✅ Global git optimizations applied (manyFiles, fsmonitor, sparse-pack)"

    - name: Sync Kernel Source
      id: sync-kernel-source
      uses: ./action-source/.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG }}
        github_token: ${{ inputs.github_token }}
        debug: ${{ inputs.debug }}

    - name: Set Dir Paths
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
        COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
        MSM_KERNEL_DIR="$KERNEL_PLATFORM_DIR/msm-kernel"
        AK3_DIR="$CONFIG_DIR/AnyKernel3"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
        SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"
        NOMOUNT_DIR="$GITHUB_WORKSPACE/nomount"
        KSU_DIR="$KERNEL_PLATFORM_DIR/KernelSU"
        KSUN_DIR="$KERNEL_PLATFORM_DIR/KernelSU-Next"
        mkdir -p "$ARTIFACTS_DIR"
        mkdir -p "$DEBUG_ARTIFACTS_DIR"
        
        # Save to environment for later steps
        echo "CONFIG_FOLDER=$CONFIG_DIR" >> "$GITHUB_ENV"
        echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR" >> "$GITHUB_ENV"
        echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "MSM_KERNEL_FOLDER=$MSM_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "AK3_FOLDER=$AK3_DIR" >> "$GITHUB_ENV"
        echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "DEBUG_ARTIFACTS_DIR=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR" >> "$GITHUB_ENV"
        echo "SUSFS_FOLDER=$SUSFS_DIR" >> "$GITHUB_ENV"
        echo "NOMOUNT_FOLDER=$NOMOUNT_DIR" >> "$GITHUB_ENV"
        echo "KSU_FOLDER=$KSU_DIR" >> "$GITHUB_ENV"
        echo "KSUN_FOLDER=$KSUN_DIR" >> "$GITHUB_ENV"
        
        DEBUG_ZIP_NAME="debug_${OP_MODEL}_${OP_OS_VERSION}.zip"
        echo "DEBUG_ZIP_NAME=$DEBUG_ZIP_NAME" >> "$GITHUB_ENV"

        SYNC_INFO_FILE="$COMMON_KERNEL_DIR/.sync-info.json"
        [ -f "$SYNC_INFO_FILE" ] || { echo "::error::.sync-info.json sidecar missing in $COMMON_KERNEL_DIR — kernel-source-sync did not record sync provenance"; exit 1; }
        SYNC_REPO="$(python3 -c "import json;print(json.load(open('$SYNC_INFO_FILE')).get('repo',''))")"
        SYNC_REV="$(python3 -c "import json;print(json.load(open('$SYNC_INFO_FILE')).get('rev',''))")"
        SYNC_COMMIT="$(python3 -c "import json;print(json.load(open('$SYNC_INFO_FILE')).get('commit','') or '')")"
        [ -n "$SYNC_REV" ] || { echo "::error::.sync-info.json carries no rev — refusing to guess kernel provenance"; exit 1; }
        KERNEL_SYNC_SHA="${SYNC_COMMIT:-$SYNC_REV}"
        echo "KERNEL_SYNC_SHA=$KERNEL_SYNC_SHA" >> "$GITHUB_ENV"
        echo "KERNEL_SYNC_REPO=$SYNC_REPO" >> "$GITHUB_ENV"
        echo "Kernel tree: $SYNC_REPO @ $SYNC_REV (resolved commit: ${SYNC_COMMIT:-unavailable in archive header; using manifest rev})"
        for d in "$CONFIG_DIR" "$ARTIFACTS_DIR" "$DEBUG_ARTIFACTS_DIR"; do
          [ -d "$d" ] || { echo "::error::required directory missing: $d"; exit 1; }
        done
        echo "✅ Directory layout prepared (kernel tree $SYNC_REPO @ $KERNEL_SYNC_SHA)"

    - name: Prepare patch generation harness
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/patchgen" "$GITHUB_WORKSPACE/patch-faillogs"
        cat > "$GITHUB_WORKSPACE/patchgen/gen_patch.sh" <<'GEN_PATCH_EOF'

        split_hunks() {
          local patch_file="$1" out_dir="$2"
          rm -rf "$out_dir" && mkdir -p "$out_dir"
          awk -v out="$out_dir" '
            BEGIN { inh = 0; nh = 0; orem = 0; nrem = 0; sawd = 0; sawp = 0; hdr = "" }
            !inh && /^diff |^Index: / { hdr = $0 "\n"; sawd = 0; sawp = 0; next }
            !inh && /^--- / && !sawd { hdr = hdr $0 "\n"; sawd = 1; next }
            !inh && /^\+\+\+ / && sawd && !sawp { hdr = hdr $0 "\n"; sawp = 1; next }
            !inh && /^--- / && sawd && sawp { hdr = $0 "\n"; sawd = 1; sawp = 0; next }
            !inh && /^@@ / {
              split($0, a, " ")
              split(a[2], o, ","); split(a[3], n, ",")
              orem = (length(o[2]) ? o[2]+0 : 1); nrem = (length(n[2]) ? n[2]+0 : 1)
              if (sawp) {
                nh++; hf = sprintf("%s/h%03d.hunk", out, nh)
                printf "%s", hdr > hf; print $0 >> hf; inh = 1
              }
              next
            }
            inh {
              print $0 >> hf
              if ($0 ~ /^\\/) next
              c = substr($0, 1, 1)
              if (c == "-") orem--
              else if (c == "+") nrem--
              else { orem--; nrem-- }
              if (orem <= 0 && nrem <= 0) { close(hf); inh = 0 }
              next
            }
          ' "$patch_file"
        }
        regen_hunk() {
          # Exact drift-tolerant hunk regeneration (diff @ generate).
          # Locates the hunk's core change in the sandbox copy of the live tree by
          # exact line matching only - no fuzz, no anchor sidecars, no 3-way merge.
          # Edits the sandbox copy in place; the caller regenerates the final diff
          # from the sandbox, so the live-tree apply stays fuzz=0.
          # rc: 0 = edited exactly, 2 = change already present, 1 = not placeable.
          local hunk="$1" root="$2" tgt f src errf tmp_out rc diag
          tgt=$( { grep -m1 -E '^\+\+\+ ' "$hunk" || true; } | awk '{print $2}' | sed 's#^b/##;s#^a/##' )
          src=$( { grep -m1 -E '^--- ' "$hunk" || true; } | awk '{print $2}' | sed 's#^a/##;s#^b/##' )
          if [ -z "$tgt" ] || [ "$tgt" = "/dev/null" ]; then
            echo "hunk has no file target"
            return 1
          fi
          f="$root/$tgt"
          if [ ! -f "$f" ]; then
            if [ "$src" = "/dev/null" ]; then
              echo "file-creation hunk; handled by verbatim staging"
            else
              echo "target missing from sandbox"
            fi
            return 1
          fi
          errf=$(mktemp); tmp_out=$(mktemp); rc=0
          awk '
            function fail2(msg) { printf "FAIL %s\n", msg > "/dev/stderr"; exit 1 }
            function nonblank(s) { return s !~ /^[ \t]*$/ }
            function sufmatch(i, maxk,   k) {
              k = 0
              while (k < maxk && i - k - 1 >= 1 && fl[i - k - 1] == lctx[maxk - k]) k++
              return k
            }
            function prefmatch(i, maxk,   t) {
              t = 0
              while (t < maxk && i + t <= n && fl[i + t] == tctx[t + 1]) t++
              return t
            }
            function anchored(j, len,   k, t, ok, m) {
              k = sufmatch(j, nl); t = prefmatch(j + len, nt)
              if (k + t == 0) return 0
              ok = 0
              for (m = 1; m <= k && !ok; m++) if (nonblank(lctx[nl - k + m])) ok = 1
              for (m = 1; m <= t && !ok; m++) if (nonblank(tctx[m])) ok = 1
              return ok ? (k + t) : 0
            }
            function remeq(j,   m) { for (m = 1; m <= nrem; m++) if (fl[j + m - 1] != rem[m]) return 0; return 1 }
            function addeq(j,   m) { for (m = 1; m <= nadd; m++) if (fl[j + m - 1] != add[m]) return 0; return 1 }
            FNR == NR {
              if (!inh) { if ($0 ~ /^@@ /) inh = 1; next }
              if ($0 ~ /^\\/) { noeno = 1; next }
              b[++nb] = $0
              next
            }
            { fl[++n] = $0 }
            END {
              if (noeno) fail2("no-newline marker in hunk; not regenerating")
              firstchg = 0; lastchg = 0
              for (i = 1; i <= nb; i++) {
                c = substr(b[i], 1, 1)
                if (c == "+" || c == "-") { if (firstchg == 0) firstchg = i; lastchg = i }
              }
              if (firstchg == 0) fail2("hunk carries no changes")
              for (i = 1; i < firstchg; i++) if (substr(b[i], 1, 1) == " ") lctx[++nl] = substr(b[i], 2)
              for (i = lastchg + 1; i <= nb; i++) if (substr(b[i], 1, 1) == " ") tctx[++nt] = substr(b[i], 2)
              state = ""
              for (i = firstchg; i <= lastchg; i++) {
                c = substr(b[i], 1, 1); ln = substr(b[i], 2)
                if (c == "+") { if (state != "add") naddrun++; state = "add"; add[++nadd] = ln }
                else if (c == "-") { if (state != "rem") nremrun++; state = "rem"; rem[++nrem] = ln }
                else state = "ctx"
              }
              adjacent = 1
              if (nrem > 0 && nadd > 0) {
                lastminus = 0; firstplus = 0
                for (i = firstchg; i <= lastchg; i++) {
                  if (substr(b[i], 1, 1) == "-") lastminus = i
                  if (substr(b[i], 1, 1) == "+" && firstplus == 0) firstplus = i
                }
                if (lastminus + 1 != firstplus) adjacent = 0
              }
              if (nremrun > 1 || naddrun > 1 || !adjacent)
                fail2("complex hunk shape; needs rebase")
              if (nadd > 0) {
                for (j = 1; j <= n - nadd + 1; j++)
                  if (addeq(j) && anchored(j, nadd) > 0) { printf "ALREADY\n" > "/dev/stderr"; exit 2 }
              }
              if (nrem == 0) {
                best = 0; ties = 0; bestpos = 0
                for (i = 1; i <= n + 1; i++) {
                  k = sufmatch(i, nl); t = prefmatch(i, nt)
                  score = k + t
                  if (score == 0) continue
                  ok = 0
                  for (m = 1; m <= k && !ok; m++) if (nonblank(lctx[nl - k + m])) ok = 1
                  for (m = 1; m <= t && !ok; m++) if (nonblank(tctx[m])) ok = 1
                  if (!ok) continue
                  if (score > best) { best = score; bestpos = i; ties = 1 }
                  else if (score == best) ties++
                }
                if (best == 0) fail2("no recognizable anchor context in target")
                if (ties > 1) fail2("ambiguous anchor (" ties " equally-good sites)")
                for (i = 1; i < bestpos; i++) print fl[i]
                for (m = 1; m <= nadd; m++) print add[m]
                for (i = bestpos; i <= n; i++) print fl[i]
                printf "inserted %d line(s) after line %d (anchor score %d)\n", nadd, bestpos - 1, best > "/dev/stderr"
                exit 0
              }
              nsites = 0
              for (j = 1; j <= n - nrem + 1; j++) if (remeq(j)) site[++nsites] = j
              if (nsites == 0) fail2("removed lines not found verbatim (semantic drift; needs rebase)")
              best = -1; ties = 0; bestj = 0
              for (s = 1; s <= nsites; s++) {
                j = site[s]
                k = sufmatch(j, nl); t = prefmatch(j + nrem, nt)
                score = k + t
                if (score > best) { best = score; bestj = j; ties = 1 }
                else if (score == best) ties++
              }
              if (nsites > 1 && ties > 1) fail2("ambiguous removed-block site (" nsites " verbatim, " ties " equally good)")
              j = bestj
              for (i = 1; i < j; i++) print fl[i]
              for (m = 1; m <= nadd; m++) print add[m]
              for (i = j + nrem; i <= n; i++) print fl[i]
              printf "replaced %d line(s) at line %d with %d\n", nrem, j, nadd > "/dev/stderr"
              exit 0
            }
          ' "$hunk" "$f" > "$tmp_out" 2> "$errf" || rc=$?
          diag=$(paste -sd ';' "$errf" 2>/dev/null || true)
          rm -f "$errf"
          if [ "$rc" = "0" ]; then
            if ! c_gotos_ok "$tmp_out"; then
              rm -f "$tmp_out"
              echo "hunk would split goto/label across functions; refusing to place"
              return 1
            fi
            cat "$tmp_out" > "$f"; rm -f "$tmp_out"
            echo "${diag:-regenerated exactly}"
            return 0
          elif [ "$rc" = "2" ]; then
            rm -f "$tmp_out"
            echo "${diag:-already present}"
            return 2
          fi
          rm -f "$tmp_out"
          echo "${diag:-not placeable}"
          return 1
        }
        c_gotos_ok() {
          # Whole-file C control-flow sanity for regenerated files: every
          # goto X must see an X: label inside the same function. Kernel
          # style keeps inner braces indented, so a column-0 } always ends
          # the enclosing function; a candidate label separated from its
          # goto by such a line lives in a different function and C rejects
          # the tree at compile time (undeclared label). Failing here keeps
          # the sandbox edit out of the live tree instead of shipping a
          # broken kernel. Runs on every regenerated file, patch-agnostic.
          awk '
            { fl[++n] = $0 }
            END {
              bad = 0
              for (i = 1; i <= n; i++) {
                if (fl[i] !~ /goto[ \t]+[A-Za-z_][A-Za-z0-9_]*;/) continue
                g = fl[i]; sub(/.*goto[ \t]+/, "", g); sub(/;.*/, "", g)
                ok = 0
                for (j = 1; j <= n; j++) {
                  if (fl[j] !~ ("^[ \t]*" g ":")) continue
                  lo = (i < j ? i : j); hi = (i < j ? j : i); cross = 0
                  for (k = lo + 1; k < hi; k++) if (fl[k] ~ /^}/) { cross = 1; break }
                  if (!cross) { ok = 1; break }
                }
                if (!ok) {
                  printf "c_gotos_ok: goto %s (line %d) has no same-function label\n", g, i > "/dev/stderr"
                  bad = 1
                }
              }
              exit (bad ? 1 : 0)
            }
          ' "$1"
        }
        blk_already() {
          # Pure-insertion hunk (no removals) whose added block (>=3 lines) is
          # already present verbatim in the target => already applied. Checked
          # before any apply so re-runs can never double-insert at a drifted anchor.
          local hunk="$1" root="$2" tgt f block
          tgt=$( { grep -m1 -E '^\+\+\+ ' "$hunk" || true; } | awk '{print $2}' | sed 's#^b/##;s#^a/##' )
          { [ -n "$tgt" ] && [ "$tgt" != "/dev/null" ]; } || return 1
          f="$root/$tgt"; [ -f "$f" ] || return 1
          grep -qE '^-[^-]' "$hunk" && return 1
          block=$(grep -E '^\+[^+]' "$hunk" | cut -c2-)
          [ "$(printf '%s\n' "$block" | grep -c .)" -ge 3 ] || return 1
          # grep -Fz treats a multi-line pattern as any-part-matches: a single
          # block line present in the file would classify the hunk "already" and
          # silently drop it. Compare newline-free fingerprints instead.
          [ -n "$block" ] && tr '\n' '\v' < "$f" | grep -Fq -- "$(printf '%s' "$block" | tr '\n' '\v')"
        }
        gen_patch() {
          local name="$1" patch_file="$2" sed_expr="${3:-}" verify_spec="${4:-}"
          local base="$GITHUB_WORKSPACE/patchgen/${name}"
          local um="${base}/unmodified" md="${base}/modified"
          local psf="${PS_FILE:-patch-status-raw.txt}"
          rm -rf "$base" && mkdir -p "$um" "$md"
          local src="/tmp/pg_${name}.patch"
          if [ -n "$sed_expr" ]; then sed -e "$sed_expr" "$patch_file" > "$src"; else cp "$patch_file" "$src"; fi
          local targets f
          targets=$( { grep -E '^\+\+\+ ' "$src" || true; } | awk '{print $2}' | sed 's#^a/##;s#^b/##' | sort -u )
          if [ -z "$targets" ]; then
            echo "::warning::[patchgen] ${name} patch exposes no file targets; not applied"
            echo "${name}|failed" >> "$psf"
            return 0
          fi
          for f in $targets; do
            case "$f" in /dev/null) continue ;; esac
            [ -f "$f" ] || continue
            mkdir -p "${um}/$(dirname "$f")" "${md}/$(dirname "$f")"
            cp "$f" "${um}/$f" && cp "$f" "${md}/$f"
          done
          local hunk_dir="${base}/hunks" h hlist staged already_ct failed_ct failed_list htarget verdict rcv
          mkdir -p "$hunk_dir"
          split_hunks "$src" "$hunk_dir"
          hlist=$(ls "$hunk_dir"/*.hunk 2>/dev/null || true)
          : > "${base}/stage.log"
          if [ -z "$hlist" ]; then
            if blk_already "$src" "$md"; then
              echo "[patchgen] ${name}: pure-insertion block already present in tree"
              echo "${name}|already" >> "$psf"
              return 0
            fi
            if patch -p1 --forward --fuzz=0 --no-backup-if-mismatch -d "$md" < "$src" >> "${base}/stage.log" 2>&1; then
              staged=1; already_ct=0; failed_ct=0
            elif patch -p1 --dry-run -R --fuzz=0 -d "$md" < "$src" >/dev/null 2>&1; then
              echo "[patchgen] ${name}: change already present in tree (reverse dry-run clean at staging)"
              verify_applied "$name" "$src" \
                || echo "::warning::[patchgen] ${name}: already-present evidence check inconclusive"
              echo "[patchgen] ${name}: verification passed"
              echo "✅ ${name} verified (already in tree)"
              echo "${name}|already" >> "$psf"
              return 0
            else
              cp "${base}/stage.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_stage.log" 2>/dev/null || true
              echo "[patchgen] ${name}: stage failure tail: $(tail -n 3 "${base}/stage.log" | tr '\n' ' ' | tr -s ' ')"
              echo "::warning::[patchgen] ${name} failed to stage in sandbox; not applied"
              echo "${name}|failed" >> "$psf"
              return 0
            fi
          else
            staged=0; already_ct=0; failed_ct=0; failed_list=""
            for h in $hlist; do
              htarget=$( { grep -m1 -E '^\+\+\+ ' "$h" || true; } | awk '{print $2}')
              if blk_already "$h" "$md"; then
                already_ct=$((already_ct+1))
              elif patch -p1 --forward --fuzz=0 --no-backup-if-mismatch -d "$md" < "$h" >> "${base}/stage.log" 2>&1; then
                staged=$((staged+1))
              elif patch -p1 --dry-run -R --fuzz=0 -d "$md" < "$h" >> "${base}/stage.log" 2>&1; then
                already_ct=$((already_ct+1))
              else
                rcv=0
                verdict=$(regen_hunk "$h" "$md") || rcv=$?
                if [ "$rcv" = "0" ]; then
                  staged=$((staged+1))
                  echo "hunk ${h##*/} regenerated exactly: ${verdict}" >> "${base}/stage.log"
                  echo "[patchgen] ${name}: REGEN ${h##*/} (${htarget:-?}): ${verdict}"
                elif [ "$rcv" = "2" ]; then
                  already_ct=$((already_ct+1))
                  echo "hunk ${h##*/} already in tree: ${verdict}" >> "${base}/stage.log"
                  echo "[patchgen] ${name}: SKIP ${h##*/} (${htarget:-?}): already in tree"
                else
                  failed_ct=$((failed_ct+1))
                  echo "hunk not stageable: ${h##*/} (${verdict})" >> "${base}/stage.log"
                  echo "[patchgen] ${name}: FAIL ${h##*/} (${htarget:-?}): ${verdict}"
                  failed_list+="$(basename "$h") "
                fi
              fi
            done
            find "$md" -name '*.rej' -delete 2>/dev/null || true
            find "$md" -name '*.orig' -delete 2>/dev/null || true
            echo "[patchgen] ${name}: staged=${staged} already=${already_ct} failed=${failed_ct}"
            if [ "$failed_ct" -gt 0 ]; then
              cp "${base}/stage.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_stage.log" 2>/dev/null || true
              echo "::warning::[patchgen] ${name}: ${failed_ct} of $((staged + already_ct + failed_ct)) hunk(s) not stageable at fuzz=0; NOT applying a partial patch"
              echo "${name}|failed" >> "$psf"
              return 0
            fi
          fi
          if [ "$staged" -eq 0 ]; then
            if [ "$already_ct" -gt 0 ]; then
              [ "$failed_ct" -eq 0 ] || echo "::warning::[patchgen] ${name}: ${failed_ct} hunk(s) neither present nor applicable; ${already_ct} hunk(s) already in tree"
              echo "[patchgen] ${name}: change already present in tree"
              verify_applied "$name" "$src" \
                || echo "::warning::[patchgen] ${name}: already-present evidence check inconclusive"
              echo "[patchgen] ${name}: verification passed"
              echo "✅ ${name} verified (already in tree)"
              echo "${name}|already" >> "$psf"
            else
              echo "::warning::[patchgen] ${name} failed to stage in sandbox; not applied"
              echo "${name}|failed" >> "$psf"
            fi
            return 0
          fi
          ( cd "$base" && diff -ruN unmodified modified ) > "${base}/regen.patch" || true
          if patch -p1 --forward --fuzz=0 < "${base}/regen.patch" > "${base}/apply.log" 2>&1; then
            :
          elif patch -p1 --dry-run -R --fuzz=0 < "${base}/regen.patch" >> "${base}/apply.log" 2>&1; then
            echo "[patchgen] ${name}: change already present in tree (reverse dry-run clean)"
            verify_applied "$name" "$src" \
              || echo "::warning::[patchgen] ${name}: already-present evidence check inconclusive"
            echo "[patchgen] ${name}: verification passed"
            echo "✅ ${name} verified (already in tree)"
            echo "${name}|already" >> "$psf"
            return 0
          else
            cp "${base}/apply.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_apply.log" 2>/dev/null || true
            echo "::warning::[patchgen] ${name} regenerated patch did not apply; not applied"
            echo "${name}|failed" >> "$psf"
            return 0
          fi
          # Verify only the content this run actually placed (regen.patch).
          # Sampling the full original patch re-flags hunks classified "already"
          # (e.g. FinaSU drift-fixed files) as misses and reverts a clean apply.
          if ! verify_applied "$name" "${base}/regen.patch"; then
            {
              echo "[patchgen] ${name} self-verification FAILED (sampled added lines missing after apply)."
              echo "  Reverse-applying the patch to keep the tree consistent."
            } > "${base}/verify.log"
            patch -p1 -R --fuzz=0 < "${base}/regen.patch" >> "${base}/verify.log" 2>&1 || true
            cp "${base}/verify.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_verify.log" 2>/dev/null || true
            echo "::warning::[patchgen] ${name} applied but self-verification failed; patch reverted"
            echo "${name}|failed" >> "$psf"
            return 0
          fi
          if [ -n "$verify_spec" ]; then
            local spec rc=0
            local -a vlist
            IFS=';' read -ra vlist <<< "$verify_spec"
            for spec in "${vlist[@]}"; do
              [ -n "$spec" ] || continue
              case "$spec" in
                g:*) verify_grep "${spec#g:}" || { rc=1; break; } ;;
                f:*) verify_infn "${spec#f:}" || { rc=1; break; } ;;
                *) echo "::warning::[patchgen] ${name}: unknown verify directive '${spec}'; treating as verification failure"; rc=1; break ;;
              esac
            done
            if [ "$rc" -ne 0 ]; then
              {
                echo "[patchgen] ${name} verification FAILED (spec: ${verify_spec})"
                echo "  A required symbol is missing or landed outside its expected scope."
                echo "  Reverse-applying the patch to keep the tree consistent."
              } > "${base}/verify.log"
              patch -p1 -R --fuzz=0 < "${base}/regen.patch" >> "${base}/verify.log" 2>&1 || true
              cp "${base}/verify.log" "$GITHUB_WORKSPACE/patch-faillogs/${name}_verify.log" 2>/dev/null || true
              echo "::warning::[patchgen] ${name} applied but verification failed; patch reverted"
              echo "${name}|failed" >> "$psf"
              return 0
            fi
            echo "[patchgen] ${name}: verification passed (spec: ${verify_spec})"
          else
            echo "[patchgen] ${name}: verification passed"
          fi
          echo "✅ ${name} verified"
          echo "${name}|applied" >> "$psf"
          return 0
        }
        verify_grep() {
          local spec="$1"
          local file="${spec%%|*}" regex="${spec#*|}"
          if [ ! -e "$file" ]; then
            echo "[patchgen] verify: ${file} not found"
            return 1
          fi
          local hits
          hits=$(grep -nE "$regex" "$file" 2>/dev/null | head -n 5 || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            return 0
          fi
          echo "[patchgen] verify: no match for '${regex}' in ${file}"
          return 1
        }
        verify_infn() {
          local spec="$1"
          local file="${spec%%|*}"
          local rest="${spec#*|}"
          local func="${rest%%|*}" sym="${rest#*|}"
          [ -f "$file" ] || { echo "[patchgen] verify: ${file} not found"; return 1; }
          if awk -v fn="$func" -v sym="$sym" '
            $0 ~ ("^[A-Za-z_].*" fn "[[:space:]]*\\(") && $0 !~ /;[[:space:]]*$/ { infn = 1; depth = 0; seen = 0 }
            infn {
              ob = gsub(/{/, "{"); cb = gsub(/}/, "}")
              depth += ob - cb
              if ($0 ~ sym) { found = 1; exit }
              if (ob > 0) seen = 1
              if (seen && depth <= 0) { infn = 0; seen = 0 }
            }
            END { exit (found ? 0 : 1) }
          ' "$file"; then
            echo "[patchgen] verify: ${file}: '${sym}' present inside ${func}()"
            return 0
          fi
          echo "[patchgen] verify: ${file}: '${sym}' NOT found inside ${func}()"
          return 1
        }
        verify_applied() {
          local name="$1" patch_file="$2"
          local map
          map=$(awk '
            /^--- / { next }
            /^\+\+\+ / {
              p = $2
              if (p == "/dev/null") { cur = ""; next }
              sub(/^[^\/]+\//, "", p)
              cur = p; next
            }
            /^@@/ { next }
            /^\+/ {
              if (cur == "") next
              line = substr($0, 2); sub(/\r$/, "", line)
              if (line ~ /^[ \t]*$/) next
              if (length(line) > 240) next
              if (seen[cur] >= 2) next
              if (total >= 24) next
              print cur "\t" line
              seen[cur]++; total++
            }
            BEGIN { total = 0 }
          ' "$patch_file") || true
          if [ -z "$map" ]; then
            echo "[patchgen] ${name}: nothing to self-verify (no added lines)"
            return 0
          fi
          local f line shown=0 miss=0
          while IFS=$'\t' read -r f line; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ] || ! grep -qF -- "$line" "$f" 2>/dev/null; then
              echo "[patchgen] ${name}: VERIFY MISS ${f}: ${line}"
              miss=$((miss+1))
              continue
            fi
            if [ "$shown" -lt 8 ]; then
              grep -nF -- "$line" "$f" 2>/dev/null | head -n 1
              shown=$((shown+1))
            fi
          done <<< "$map"
          [ "$miss" -eq 0 ] || return 1
          return 0
        }
        fetch_patch() {
          local url="$1" out="$2" min="${3:-200}"
          curl -sSL --fail -o "$out" "$url" || return 1
          local sz
          sz="$(stat -c%s "$out" 2>/dev/null || echo 0)"
          if [ "$sz" -lt "$min" ]; then
            echo "::warning::[fetch_patch] ${url} fetched only ${sz} bytes (floor ${min}); treating as unavailable"
            return 1
          fi
          return 0
        }
        GEN_PATCH_EOF
        echo "✅ patch generation harness ready"
    - name: Set Kernel build-tools to Path
      shell: bash
      run: |
        # Set Kernel build-tools to Path
        set -euo pipefail
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" >> $GITHUB_PATH
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> $GITHUB_PATH
        [ -d "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" ] || { echo "::error::kernel-build-tools linux-x86/bin missing — repo sync incomplete?"; exit 1; }
        [ -d "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" ] || echo "::warning::linux_musl-x86 build-tools not present (its PATH entry will be inert)"
        echo "✅ Kernel build-tools added to PATH"

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Get kernel version"
        cd "$COMMON_KERNEL_FOLDER"
        
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        
        if [ -z "$BRANCH_LINE" ]; then
          echo "::error::No BRANCH= found in config files"; exit 1
        fi
        
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_VERSION="${BRANCH_VALUE%-*}"
        
        if [ -z "$ANDROID_VERSION" ]; then
          echo "::error::Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        
        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
        
        cd "$ARTIFACTS_FOLDER"
        echo "$ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"
        
        {
          echo "ANDROID_VER=$ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
          fi
        } >> "$GITHUB_ENV"
        
        echo "✅ Detected: $ANDROID_VERSION-$FULL_VERSION"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "   SUSFS Branch: gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
        fi
        echo "::endgroup::"

    - name: 🏷️ Set Build Identity (Hardcoded)
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Set build user/host"
                
        BUILD_USER="OnePlus"
        BUILD_HOST="ubuntu-build"
        
        echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
        
        echo ""
        echo "✅ Build identity configured:"
        echo "   User: $BUILD_USER"
        echo "   Host: $BUILD_HOST"
        echo "::endgroup::"

    - name: Check or Detect Clang
      shell: bash
      run: |
        # Check or Detect Clang
        set -euo pipefail
        echo "::group::Detect Clang"
        CLANG_FOUND=false
        CLANG_BIN=""
        
        if [ -n "$OP_ZYC_COMPILER" ]; then
          # Priority 1: User explicitly wants ZyC compiler
          echo "OP_ZYC_COMPILER detected as download link: $OP_ZYC_COMPILER"
          
          ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
          TEMP_TAR="$CONFIG_FOLDER/compiler.tar.gz"
          mkdir -p "$ZYC_DIR"
          
          echo "Downloading ZyC Clang from link..."
          
          max_retries=5
          attempt=1
          download_success=false
          
          while [ $attempt -le $max_retries ]; do
            echo "Download attempt $attempt/$max_retries..."
            
            if curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 60 -o "$TEMP_TAR" "$OP_ZYC_COMPILER"; then
                echo "Download successful."
                download_success=true
                break
            else
                echo "Download failed (attempt $attempt)."
                rm -f "$TEMP_TAR" 2>/dev/null
                if [ $attempt -eq $max_retries ]; then
                    echo "Error: Failed to download ZyC Clang after $max_retries attempts."
                    break
                fi
                attempt=$((attempt + 1))
                sleep 8
            fi
          done
        
          if [ "$download_success" = true ]; then
            # Extract
            echo "Extracting to $ZYC_DIR ..."
            if tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null; then
              # Symlink extraction fix
              tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null || true
              # Cleanup
              rm -f "$TEMP_TAR"
              
              # Verify clang exists
              if [ -x "$ZYC_DIR/bin/clang" ]; then
                  CLANG_BIN="$ZYC_DIR/bin"
                  CLANG_FOUND=true
                  echo "ZyC Clang successfully downloaded and extracted."
                  echo "Using: $CLANG_BIN/clang"
              else
                  echo "Warning: Extraction done, but clang binary not found at $ZYC_DIR/bin/clang"
              fi
            else
                echo "Error: Failed to extract the tar.gz file."
                rm -f "$TEMP_TAR"
            fi
          fi
        
        elif [ -n "$OP_C_COMPILER" ]; then
          # Priority 2: User specified a custom C compiler
          if [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
            CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
            CLANG_FOUND=true
          else
            echo "Warning: OP_C_COMPILER='$OP_C_COMPILER' but clang binary not found at $CONFIG_FOLDER/$OP_C_COMPILER/clang"
          fi
        fi
        
        if [ "$CLANG_FOUND" = false ]; then
          # Priority 3: Auto-detect from prebuilts (when both variables are empty / user clang not found)
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang/host/linux-x86" ] || continue
            latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
              CLANG_BIN="$latest/bin"
              CLANG_FOUND=true
              break
            fi
          done
        fi
        
        if [ "$CLANG_FOUND" = false ] && command -v clang >/dev/null 2>&1; then
          # Priority 4: Fallback to system-installed clang
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi
        
        [ "$CLANG_FOUND" = true ] || { echo "::error::No clang toolchain found"; exit 1; }
        
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        
        echo "Derive Clang fingerprint"
        
        short="$("${CLANG_BIN}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"
        
        if [ -z "$short" ]; then
          short="$("${CLANG_BIN}/clang" --version | sha256sum | cut -c1-8)"
          echo "⚠️ Could not extract clang-r version, using hash: $short"
        else
          echo "✅ Clang version fingerprint: $short"
        fi
        
        echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
        echo "$CLANG_BIN" >> $GITHUB_PATH
        echo "LIBCLANG_PATH=$CLANG_BIN/../lib" >> "$GITHUB_ENV"
        
        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Check or Detect Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Check or Detect Rust & bindgen
        set -euo pipefail
        echo "::group::Detect Rust & bindgen"
        RUSTC_FOUND=false
        BINDGEN_FOUND=false
        
        if [ -z "$OP_RUST_COMPILER" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/rust/linux-x86" ] || continue
            latest=$(ls -d "$base/rust/linux-x86/1."* 2>/dev/null | sort -V | head -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/rustc" ]; then
              RUSTC_BIN="$latest/bin"
              RUSTC_FOUND=true
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_RUST_COMPILER/rustc" ]; then
            RUSTC_BIN="$CONFIG_FOLDER/$OP_RUST_COMPILER"
            RUSTC_FOUND=true
          fi
        fi
        
        if [ -z "$OP_BINDGEN" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang-tools/linux-x86" ] || continue
            if [ -x "$base/clang-tools/linux-x86/bin/bindgen" ]; then
              BINDGEN_BIN="$base/clang-tools/linux-x86/bin"
              BINDGEN_FOUND=true
              chmod +x "$base/clang-tools/linux-x86/bin/bindgen"
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen" ]; then
            BINDGEN_BIN="$CONFIG_FOLDER/$OP_BINDGEN"
            BINDGEN_FOUND=true
            chmod +x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen"
          fi
        fi
        
        [ "$RUSTC_FOUND" = true ] || { echo "::error::No RUST toolchain found"; exit 1; }
        [ "$BINDGEN_FOUND" = true ] || { echo "::warning::No bindgen found"; }
        
        echo "RUSTC_BIN_PATH=$RUSTC_BIN" >> "$GITHUB_ENV"
        RUSTC_VERSION="$("$RUSTC_BIN/rustc" --version | head -n1)"
        echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"
        echo "RUSTC=$RUSTC_BIN/rustc" >> "$GITHUB_ENV"
        echo "$RUSTC_BIN" >> $GITHUB_PATH
        echo "✅ Detected RUSTC: $RUSTC_VERSION"
        
        if [ "$BINDGEN_FOUND" = true ]; then
          echo "BINDGEN_BIN_PATH=$BINDGEN_BIN" >> "$GITHUB_ENV"
          BINDGEN_VERSION="$("$BINDGEN_BIN/bindgen" --version | head -n1)"
          echo "BINDGEN_VERSION=$BINDGEN_VERSION" >> "$GITHUB_ENV"
          echo "$BINDGEN_BIN" >> $GITHUB_PATH
          echo "BINDGEN=$BINDGEN_BIN/bindgen" >> "$GITHUB_ENV"
          echo "✅ Detected BINDGEN: $BINDGEN_VERSION"
        fi
        
        echo "::endgroup::"

    - name: Install bindgen only (no rustc)
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true'  && !env.BINDGEN_BIN_PATH }}
      run: |
        # Install bindgen via cargo (no full rustc needed)
        set -euo pipefail
        echo "::group::Install bindgen only (no rustc)"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        source $HOME/.cargo/env
        
        # Install bindgen CLI only (~50-100MB total)
        cargo install bindgen-cli --version 0.69.5
        
        BINDGEN=$(which bindgen)
        BINDGEN_BIN=$(dirname $BINDGEN)
        echo "$BINDGEN_BIN" >> $GITHUB_PATH
        echo "BINDGEN=$BINDGEN" >> "$GITHUB_ENV"
        
        # Verify
        bindgen --version
        echo "::endgroup::"
        command -v bindgen >/dev/null || { echo "::error::bindgen not found on PATH after install"; exit 1; }
        echo "✅ bindgen installed ($(bindgen --version))"

    - name: Test Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Test Rust & bindgen
        set -euo pipefail
        echo "::group::Test Rust & bindgen"
        cd "$COMMON_KERNEL_FOLDER"
        export RUSTTARGET="aarch64-linux-android"
        make V=1 rustavailable
        echo "::endgroup::"
        echo "✅ Rust availability confirmed in kernel tree (make rustavailable passed)"

    - name: Restore ccache cache
      id: restore-ccache-cache
      uses: ./action-source/.github/actions/cache/restore
      continue-on-error: true
      if: ${{ inputs.clean == false || inputs.clean == 'false' }}
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-

    - name: Restore LTO LD cache
      id: restore-lto-ld-cache
      uses: ./action-source/.github/actions/cache/restore
      continue-on-error: true
      if: ${{ (inputs.clean == false && env.OP_LTO != 'none') || (inputs.clean == 'false' && env.OP_LTO != 'none') }}
      with:
        cache_path: ${{ env.LDCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "lto-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v3-LTO-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-
    - name: Check and Prepare Caches
      shell: bash
      run: |
        echo "::group::Check ccache"
        set -euo pipefail
        
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        
        echo "Current ccache configuration:"
        ccache -p
        
        if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null | grep -q .; then
          echo "✅ Restored cache found"
          echo ""
          echo "Pre-build cache statistics:"
          ccache -s | head -n 20
          
          echo "Updating atime to achive cache eviction"
          find ${{ env.CCACHE_DIR }} -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
        else
          echo "⚠️ No existing cache - building from scratch"
          echo "Cache will be populated for future builds"
        fi
        
        ccache -z
        rm -f "$CCACHE_DIR/ccache.log"
        
        # Blacklist Risky files from ccache
        sed -i '1i // CI_RUN_ID: ${{ github.run_id }}' "$COMMON_KERNEL_FOLDER/kernel/configs.c"
        sed -i '1i // ccache:disable' "$COMMON_KERNEL_FOLDER/kernel/configs.c"

        if head -n 1 "$COMMON_KERNEL_FOLDER/kernel/configs.c" | grep -q "// ccache:disable"; then
            echo "Success: ccache is disabled for this file!"
        else
            echo "Error: Modification failed or line is missing."
        fi

        echo "::endgroup::"

    - name: Fetch SusFS and Other Dependencies
      shell: bash
      run: |
        echo "::group::Fetch dependencies"
        set -euo pipefail
        echo "Fetching SusFS and other dependencies..."
        
        
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          # Determine SUSFS branch/commit to use
          SUSFS_INPUT="${{ inputs.susfs_commit_hash_or_branch }}"
          
          # Default SUSFS branches for each kernel version
          declare -A DEFAULT_SUSFS=(
            ["android12-5.10"]="gki-android12-5.10"
            ["android13-5.15"]="gki-android13-5.15"
            ["android14-6.1"]="gki-android14-6.1"
            ["android15-6.6"]="gki-android15-6.6"
            ["android16-6.12"]="gki-android16-6.12"
          )
          
          # Determine which SUSFS ref to use
          KERNEL_KEY="${{ env.ANDROID_VER }}-${{ env.KERNEL_VER }}"
          if [ -z "$SUSFS_INPUT" ]; then
            # use kernel-specific default
            SUSFS_BRANCH="${DEFAULT_SUSFS[$KERNEL_KEY]:-gki-android15-6.6}"
            SUSFS_REF_SOURCE="kmi-default branch"
            echo "ℹ️  Using default SUSFS branch for $KERNEL_KEY: $SUSFS_BRANCH"
          else
            # 40-char hash or branch/commit passed directly
            SUSFS_BRANCH="$SUSFS_INPUT"
            SUSFS_REF_SOURCE="explicit input pin"
            echo "🔧 Using resolved SUSFS ref: $SUSFS_BRANCH"
          fi
          echo "SUSFS_REF=$SUSFS_BRANCH" >> "$GITHUB_ENV"
          echo "SUSFS_REF_SOURCE=$SUSFS_REF_SOURCE" >> "$GITHUB_ENV"
        fi
        
        retry_fetch_archive() {
          local url="$1"
          local branch="${2:-main}"
          local max_attempts=3
          local attempt=1
          
          local repo_name=$(basename "$url" .git)
          local safe_branch=$(echo "$branch" | tr '/' '_')
          local archive_name="${repo_name}_${safe_branch}.tar.gz"
          local shm_path="/dev/shm/$archive_name"
          
          local nproc=$(nproc 2>/dev/null || echo 4)
          
          local aria_log_flags="--quiet --summary-interval=0"
          if [ "${{ inputs.debug }}" = "true" ]; then
              aria_log_flags="--summary-interval=5" # Show progress every 5s in debug
          fi
          
          local aria2_headers=(
            "--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            "--header=Accept: */*"
            "--header=Connection: keep-alive"
          )
          
          local download_url=""
          if [[ "$url" == *"github.com"* ]]; then
              download_url="${url%.git}/archive/refs/heads/${branch}.tar.gz"
          elif [[ "$url" == *"gitlab.com"* ]]; then
              download_url="${url%.git}/-/archive/${branch}/${repo_name}-${branch}.tar.gz"
          else
              echo "::error::Unsupported host: $url"
              return 1
          fi
          
          while [ $attempt -le $max_attempts ]; do
              echo " Attempt $attempt/$max_attempts: High-speed fetch for $repo_name ($branch)"
              
              local aria_splits="-x16 -s16 -j16"
          if [[ "$url" == *"gitlab.com"* ]]; then
            # GitLab throttles per-IP bursts; 16-way segmentation invites 429s
            aria_splits="-x4 -s4"
          fi
          if aria2c $aria_splits -k1M --retry-wait=2 --max-tries=5 -d "/dev/shm" -o "$archive_name" --allow-overwrite=true "${aria2_headers[@]}" $aria_log_flags "$download_url"; then
                  mkdir -p "$repo_name"
                  if tar -I "pigz -p $nproc -b 256" -x --record-size=1M -f "$shm_path" -C "$repo_name" --strip-components=1 --no-same-owner; then
                      echo "✅ Success: $repo_name synced"
                      rm -f "$shm_path"
                      return 0
                  fi
              fi
              
              echo "⚠️ Attempt $attempt failed, clearing RAM and retrying..."
              rm -rf "$repo_name" "$shm_path" 2>/dev/null
              [ $attempt -lt $max_attempts ] && sleep $((attempt * 15))
              attempt=$((attempt + 1))
          done
          
          echo "::warning::Archive fetch failed for $url after $max_attempts attempts - caller will fall back to git clone"
          return 1
        }
        
        retry_clone() {
          local url="$1"
          local branch="${2:-main}"
          local depth="${3:-1}"
          local dir="$(basename "$url" .git)"
          local max_attempts=3
          local attempt=1
          
          # Build git clone args
          local clone_args=(--branch "$branch")
          if [ "$depth" != "0" ] && [ -n "$depth" ]; then
            clone_args+=(--depth "$depth")
          fi
          
          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Attempt $attempt/$max_attempts: cloning $url ($branch)${depth:+ [depth=$depth]}"
            
            # Clone with dynamic args
            git clone "${clone_args[@]}" "$url" "$dir" && {
              echo "✅ Success"
              return 0
            }
            
            echo "❌ Failed, cleaning up..."
            rm -rf "$dir" 2>/dev/null
            sleep $((attempt++ * 5))
          done
          
          echo "💥 All attempts failed"
          return 1
        }

        retry_download() {
          local url="$1"
          local file_name="$2"
          local max_attempts=3
          local attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Attempt $attempt/$max_attempts: downloading $url"
            
            wget "$url" -O "$file_name" && {
              echo "✅ Success"
              return 0
            }
            
            echo "❌ Failed, cleaning up..."
            rm -f "$file_name" 2>/dev/null
            sleep $((attempt++ * 5))
          done
          
          echo "💥 All attempts failed"
          return 1
        }
        
        retry_clone "https://github.com/WildKernels/kernel_patches.git" "main" "1"
        git clone --no-checkout --depth 1 "https://github.com/maxsteeel/nomount.git" nomount
        NOMOUNT_TARGET="${{ inputs.nomount_commit }}"
        if [ -n "$NOMOUNT_TARGET" ]; then
          echo "Using NoMount commit: $NOMOUNT_TARGET"
          git -C nomount fetch --depth 1 origin "$NOMOUNT_TARGET"
          git -C nomount checkout --detach "$NOMOUNT_TARGET"
          NOMOUNT_COMMIT_SHA="$(git -C nomount rev-parse HEAD)"
          if [ "$NOMOUNT_COMMIT_SHA" != "$NOMOUNT_TARGET" ]; then
            echo "::error::NoMount checkout mismatch: wanted $NOMOUNT_TARGET, got $NOMOUNT_COMMIT_SHA"
            exit 1
          fi
        else
          git -C nomount checkout --detach origin/HEAD 2>/dev/null || git -C nomount checkout --detach
          NOMOUNT_COMMIT_SHA="$(git -C nomount rev-parse HEAD)"
          NOMOUNT_REF_SOURCE="upstream latest"
          echo "::warning::No NoMount commit provided; tracking upstream latest (${NOMOUNT_COMMIT_SHA})"
        fi
        if [ -z "${NOMOUNT_REF_SOURCE:-}" ]; then NOMOUNT_REF_SOURCE="explicit input pin"; fi
        echo "NOMOUNT_REF_SOURCE=$NOMOUNT_REF_SOURCE" >> "$GITHUB_ENV"
        git -C nomount log --oneline -1
        echo "NOMOUNT_COMMIT_SHA=$NOMOUNT_COMMIT_SHA" >> "$GITHUB_ENV"
        echo "Using NoMount commit: $NOMOUNT_COMMIT_SHA"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "Using SUSFS branch/commit: $SUSFS_BRANCH"
          resolve_susfs_sha() {
            # Resolve a susfs4ksu branch/tag ref to its true commit SHA via the GitLab API.
            local api="https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/commits/$1"
            local sha=""
            sha="$(curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 "$api" 2>/dev/null \
              | grep -o '"id" *: *"[0-9a-fA-F]\{40\}"' | head -n1 | sed 's/.*"id" *: *"//; s/"$//')" || true
            printf '%s' "$sha"
          }
          if ! retry_fetch_archive "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_BRANCH"; then
            echo "::warning::SUSFS archive fetch throttled; falling back to a plain git clone"
            rm -rf "$SUSFS_FOLDER"
            if git clone --no-checkout "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_FOLDER" \
               && git -C "$SUSFS_FOLDER" checkout --detach "$SUSFS_BRANCH"; then
              echo "SUSFS tree fetched via git clone fallback at $SUSFS_BRANCH"
            else
              echo "::error::Failed to fetch SUSFS after both archive and git-clone attempts"
              exit 1
            fi
          fi
          # Provenance: record the resolved commit SHA, not the ref name, so the
          # build summary links to the exact susfs4ksu commit that was built.
          if [ -d "$SUSFS_FOLDER/.git" ]; then
            SUSFS_RESOLVED_SHA="$(git -C "$SUSFS_FOLDER" rev-parse HEAD 2>/dev/null || true)"
          elif [[ "$SUSFS_BRANCH" =~ ^[0-9a-fA-F]{40}$ ]]; then
            SUSFS_RESOLVED_SHA="$SUSFS_BRANCH"
          else
            SUSFS_RESOLVED_SHA="$(resolve_susfs_sha "$SUSFS_BRANCH")"
          fi
          if [[ "$SUSFS_RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "SUSFS_COMMIT_SHA=$SUSFS_RESOLVED_SHA" >> "$GITHUB_ENV"
            echo "🔒 SUSFS resolved commit: $SUSFS_RESOLVED_SHA"
          else
            echo "::warning::Could not resolve SUSFS commit SHA for '$SUSFS_BRANCH'; recording the ref name instead"
            echo "SUSFS_COMMIT_SHA=$SUSFS_BRANCH" >> "$GITHUB_ENV"
          fi
        fi
        echo "✅ Dependencies cloned"
        echo "::endgroup::"

    - name: Clean Up ABI Protected Exports
      shell: bash
      run: |
        echo "::group::Clean Up ABI Protected Exports"
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        rm -f common/android/abi_gki_protected_exports_* || true
        sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true
        echo "::endgroup::"
        if ls common/android/abi_gki_protected_exports_* >/dev/null 2>&1; then
          echo "::error::ABI protected exports files still present"; exit 1
        fi
        if grep -q 'protected_modules' common/modules.bzl && ! grep -q 'protected_modules = \[\]' common/modules.bzl; then
          echo "::error::modules.bzl protected_modules not emptied"; exit 1
        fi
        echo "✅ ABI protected exports cleared (exports files removed, protected_modules emptied)"


    - name: Add KernelSU
      shell: bash
      if: ${{ inputs.ksu_type == 'KSU' }}
      run: |
        set -euo pipefail
        echo "::group::Add KernelSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding KernelSU..."
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -z "$KSU_INPUT" ]; then
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        else
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_INPUT"
        fi
        
        git submodule update --init --recursive
        cd KernelSU/kernel
        BASE_VERSION=30000
        KSU_VERSION=$(expr $(/usr/bin/git rev-list --count HEAD) "+" $BASE_VERSION)
        
        if grep -q "DKSU_VERSION=16" Makefile; then
          sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" Makefile
        fi
        
        if [ -f ksu.c ]; then
          echo "ℹ️ Found ksu.c, applying legacy stackprotector patch..."
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c
        elif [ -f core.c ]; then
          echo "ℹ️ Found core.c, applying stackprotector patch to new structure..."
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' core.c
        else
          echo "ℹ️ Modern KSU structure detected, skipping legacy stackprotector patch."
        fi
        
        if [[ "$KSU_VERSION" -gt 32427 ]] && [[ "${{ env.KERNEL_VER }}" == "6.12" ]]; then
          sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include -I$(KSU_KERNEL_DIR)/include/uapi|' Kbuild
          sed -i 's|$(src)|$(abspath $(src))|' Kbuild
          sed -i 's|$(srctree)/$(src)|$(abspath $(srctree)/$(src))|' Kbuild
        fi
        
        echo "NEED_HOOKS=false" >> $GITHUB_ENV
        
        cd ..
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
        
        echo "Add KSU Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        EOF
        
        echo "KSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "KernelSU Version: $KSU_VERSION"
        echo "✅ KernelSU added (commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Add KernelSU Next
      shell: bash
      if: ${{ inputs.ksu_type == 'KSUN' }}
      run: |
        set -euo pipefail
        echo "::group::Add KernelSU Next"
        cd "$KERNEL_PLATFORM_FOLDER"
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        KSUN_SETUP="$(mktemp)"
        # setup.sh is not on 'main' upstream (404); dev is maintained, next is the fallback
        curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" -o "$KSUN_SETUP" \
          || curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" -o "$KSUN_SETUP"
        [ -s "$KSUN_SETUP" ] || { echo "::error::Could not fetch KernelSU-Next kernel/setup.sh"; exit 1; }
        if [ -z "$KSU_INPUT" ]; then
          bash "$KSUN_SETUP"
        else
          bash "$KSUN_SETUP" "$KSU_INPUT"
        fi
        git -C KernelSU-Next submodule update --init --recursive
        cd KernelSU-Next/kernel

        commits_count="$(git rev-list --count HEAD)"
        if [ "$commits_count" -lt 2684 ]; then
          base_version=10200
        else
          base_version=30000
        fi
        KSU_VERSION="$((commits_count + base_version))"
        sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" Makefile

        if [ -f ksu.c ]; then
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c
        fi
        if [ "$KSU_VERSION" -gt 33095 ] && [ "${{ env.KERNEL_VER }}" = "6.12" ]; then
          sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include -I$(KSU_KERNEL_DIR)/include/uapi|' Kbuild
          sed -i 's|$(src)|$(abspath $(src))|' Kbuild
          sed -i 's|$(srctree)/$(src)|$(abspath $(srctree)/$(src))|' Kbuild
        fi

        KSU_COMMIT_SHA="$(git rev-parse HEAD)"
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> "$GITHUB_ENV"
        echo "NEED_HOOKS=false" >> "$GITHUB_ENV"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=n
        EOF

        printf '%s\n%s\n' "KSUN" "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KernelSU Next Version: $KSU_VERSION"
        echo "✅ KernelSU Next added (commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Add BakaSU
      shell: bash
      if: ${{ inputs.ksu_type == 'BakaSU' }}
      run: |
        set -euo pipefail
        echo "::group::Add BakaSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding BakaSU..."
        
        if [ "${{ inputs.ksu_branch_or_hash }}" = "" ]; then
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -
        else
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_branch_or_hash }}"
        fi
        
        cd KernelSU
        
        BASE_VERSION=30700
        KSU_VERSION=$(expr $(/usr/bin/git rev-list --count HEAD) "+" $BASE_VERSION)
        
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
        
        cd ..
        
        echo "BakaSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        
        echo "BakaSU Version: $KSU_VERSION"
        echo "✅ BakaSU added (commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Add BakaSU Root Tag
      if: ${{ inputs.ksu_type == 'BakaSU' && env.OP_ROOT_TAG != '' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add BakaSU root tag"
        if ! grep -rq 'config KSU_FULL_NAME_FORMAT' "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel/Kconfig"; then
          echo "::warning::BakaSU Kconfig has no KSU_FULL_NAME_FORMAT symbol, skipping root tag"
          echo "::endgroup::"
          exit 0
        fi
        MANAGER_BRANCH="${{ inputs.ksu_branch_or_hash }}"
        [ -z "$MANAGER_BRANCH" ] && MANAGER_BRANCH="main"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU_FULL_NAME_FORMAT="${OP_ROOT_TAG}@%REPO_NAME%"
        EOF
        grep -n 'CONFIG_KSU_FULL_NAME_FORMAT' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        echo "ROOT_TAG_APPLIED=${OP_ROOT_TAG}" >> "$GITHUB_ENV"
        echo "✅ BakaSU root tag applied: ${OP_ROOT_TAG} (CONFIG_KSU_FULL_NAME_FORMAT in gki_defconfig)"
        echo "::endgroup::"

    - name: Fetch FinaSU Compat Suite
      shell: bash
      if: ${{ inputs.ksu_type == 'FinaSU' }}
      run: |
        set -euo pipefail
        echo "::group::Fetch FinaSU compat suite"
        # Remote-first, local fallback: track the maintained copies at runtime.
        # LyraVoid/FinaSU upstream ships no compat scripts; LingLuo's repos do.
        # OnePlusOSS manifests -> OnePlus_KernelSU_SUSFS set, AOSP-hybrid (gki)
        # manifests -> AnyKernel3 set; the other repo mirrors as second hop.
        COMPAT_DIR="$GITHUB_WORKSPACE/scripts/finasu_compat"
        mkdir -p "$COMPAT_DIR"
        if [[ "${OP_MANIFEST:-}" == *_gki_* ]]; then
          BASES=(
            "https://raw.githubusercontent.com/LingLuo17/AnyKernel3/main/scripts/finasu_compat"
            "https://raw.githubusercontent.com/LingLuo17/OnePlus_KernelSU_SUSFS/main/scripts/finasu_compat"
          )
        else
          BASES=(
            "https://raw.githubusercontent.com/LingLuo17/OnePlus_KernelSU_SUSFS/main/scripts/finasu_compat"
            "https://raw.githubusercontent.com/LingLuo17/AnyKernel3/main/scripts/finasu_compat"
          )
        fi
        for f in apply.sh extract_manager_cert.py susfs_drift_fixes.patch; do
          src="local"
          for b in "${BASES[@]}"; do
            if curl -fsSL --retry 2 --max-time 120 -o "$COMPAT_DIR/$f.new" "$b/$f" && [ -s "$COMPAT_DIR/$f.new" ]; then
              mv "$COMPAT_DIR/$f.new" "$COMPAT_DIR/$f"
              src="${b#*LingLuo17/}"; src="${src%%/*}"
              break
            fi
            rm -f "$COMPAT_DIR/$f.new"
          done
          echo "finasu-compat|$f|$src" >> "$PS_FILE"
          echo "$f <- $src"
        done
        echo "::endgroup::"
    - name: Add FinaSU
      shell: bash
      if: ${{ inputs.ksu_type == 'FinaSU' }}
      run: |
        set -euo pipefail
        echo "::group::Add FinaSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding FinaSU..."
        git clone https://github.com/LyraVoid/FinaSU.git KernelSU
        git -C KernelSU submodule update --init --recursive || true

        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -n "$KSU_INPUT" ]; then
          git -C KernelSU checkout --detach "$KSU_INPUT" 2>/dev/null \
            || { git -C KernelSU fetch origin "$KSU_INPUT" && git -C KernelSU checkout --detach "$KSU_INPUT"; }
        fi

        # FinaSU ships no setup.sh for in-tree use - wire it manually:
        # symlink the kernel dir, mount Makefile/Kconfig (trailing-newline guard
        # for vendor trees whose drivers/Makefile lacks a final newline).
        DRIVER_DIR="$COMMON_KERNEL_FOLDER/drivers"
        ln -sfn "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_PLATFORM_FOLDER/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
        grep -q "obj-.*CONFIG_KSU.*kernelsu/" "$DRIVER_DIR/Makefile" \
          || { echo "" >> "$DRIVER_DIR/Makefile"; printf 'obj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_DIR/Makefile"; }
        grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig" \
          || sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        EOF

        # Trust the official FinaSU manager via the second signature slot.
        # Without it the upstream KernelSU manager hijacks the manager identity
        # and the FinaSU manager reports "not installed".
        REL_APK="$(mktemp -d)/manager.apk"
        REL_JSON=""
        for ATTEMPT in 1 2 3; do
          REL_JSON=$(curl -s --fail --max-time 30 "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest") \
            && [ -n "$REL_JSON" ] && break
          echo "Release info fetch failed, retrying ($ATTEMPT/3)..."
          sleep 5
        done
        REL_URL=$(printf '%s' "$REL_JSON" | python3 -c \
          "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.apk')))" 2>/dev/null || true)
        [ -n "$REL_URL" ] || { echo "::error::No APK asset in the latest FinaSU release - cannot extract the manager cert"; exit 1; }
        curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_URL" \
          || { echo "::error::Failed to download the FinaSU release APK"; exit 1; }
        CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
        KSU_CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
        KSU_CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
        [ -n "$KSU_CERT_SIZE" ] && [ -n "$KSU_CERT_HASH" ] \
          || { echo "::error::FinaSU manager cert extraction failed"; exit 1; }
        echo "Injecting FinaSU manager cert into the second trust slot: size=$KSU_CERT_SIZE sha256=$KSU_CERT_HASH"
        awk -v size="$KSU_CERT_SIZE" -v hash="$KSU_CERT_HASH" '
          !done && /^ccflags-y \+= -DEXPECTED_HASH=/ {
            print
            print "# injected by OnePlus_BakaSU_SUSFS_NoMount: trust the official FinaSU manager via the second signature slot"
            print "KSU_EXPECTED_SIZE2 := " size
            print "KSU_EXPECTED_HASH2 := " hash
            print "KSU_SECOND_SIGNATURE_RELEASE := 1"
            done = 1
            next
          }
          { print }
        ' KernelSU/kernel/Kbuild > KernelSU/kernel/Kbuild.new && mv KernelSU/kernel/Kbuild.new KernelSU/kernel/Kbuild
        grep -q "^KSU_EXPECTED_SIZE2 := " KernelSU/kernel/Kbuild \
          && grep -q "^KSU_EXPECTED_HASH2 := " KernelSU/kernel/Kbuild \
          && grep -q "^KSU_SECOND_SIGNATURE_RELEASE := 1" KernelSU/kernel/Kbuild \
          || { echo "::error::Kbuild cert injection failed (anchor line missing - FinaSU upstream Kbuild layout may have changed)"; exit 1; }

        KSU_COMMIT_SHA=$(git -C KernelSU rev-parse HEAD)
        COMMITS=$(git -C KernelSU rev-list --count HEAD)
        KSU_VERSION=$((30000 + COMMITS))
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> "$GITHUB_ENV"
        echo "NEED_HOOKS=false" >> "$GITHUB_ENV"
        echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "FinaSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "FinaSU Version: $KSU_VERSION"
        echo "✅ FinaSU added (ref: ${KSU_INPUT:-master}, commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Apply SUSFS Patches
      shell: bash
      if: ${{ env.OP_SUSFS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply SUSFS patches"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Applying SUSFS patches..."
        cp "$SUSFS_FOLDER/kernel_patches/fs/"* "$COMMON_KERNEL_FOLDER/fs/"
        cp "$SUSFS_FOLDER/kernel_patches/include/linux/"* "$COMMON_KERNEL_FOLDER/include/linux/"
        
        susfs_version=$(grep '#define SUSFS_VERSION' "$COMMON_KERNEL_FOLDER/include/linux/susfs.h" | awk -F'"' '{print $2}')
        echo "SUSVER=$susfs_version" >> $GITHUB_ENV
        echo "$susfs_version" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "SusFS Version: $susfs_version"
        
        # Function to compare semantic versions
        version_lte() {
          [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$1" ]
        }
        
        if version_lte "${susfs_version:1}" "1.5.12"; then
          echo "NEED_HOOKS=true" >> $GITHUB_ENV
        else
          echo "NEED_HOOKS=false" >> $GITHUB_ENV
        fi
        
        case "$susfs_version" in
          "v1.5.8")
            if [ "${{ inputs.ksu_type }}" = "KSU" ]; then
              cd "$KSU_FOLDER"
              source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
              gen_patch susfs-ksu-enable "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || echo "::warning::[susfs] 10_enable_susfs_for_ksu.patch did not stage cleanly (soft-fail, continuing)"
            else
              echo "ℹ️ Skipping KernelSU folder patch for BakaSU"
            fi
            ;;
          "v1.5.9"|"v1.5.10"|"v1.5.11"|"v1.5.12"|"v2.0.0"|"v2.1.0")
            if [ "${{ inputs.ksu_type }}" = "KSU" ]; then
              cd "$KSU_FOLDER"
              source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
              gen_patch susfs-ksu-enable "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            else
              echo "ℹ️ Skipping KernelSU folder patch for BakaSU"
            fi
            ;;
          "v2.2.0"|"v2.3.0")
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              cd "$KSUN_FOLDER"
              susfs_ksun_patch="$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
              filtered_susfs_patch="$(mktemp)"
              awk '
                /^diff --git a\/kernel\/(Kbuild|Kconfig|core\/init\.c|feature\/kernel_umount\.c|feature\/sucompat\.c|hook\/setuid_hook\.c|supercall\/supercall\.c) b\// { skip = 1; next }
                /^diff --git / { skip = 0 }
                !skip { print }
              ' "$susfs_ksun_patch" > "$filtered_susfs_patch"
              source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
              gen_patch susfs-ksun-enable "$filtered_susfs_patch"
              if ! grep -Eq '^susfs-ksun-enable\|(applied|already)' "$PS_FILE" 2>/dev/null; then
                echo "::error::KernelSU Next SUSFS enable patch failed to stage at fuzz=0 (see patch-faillogs)"
                exit 1
              fi
              rm "$filtered_susfs_patch"

              if ! grep -q '^config KSU_SUSFS' ./kernel/Kconfig; then
                if ! tail -n 1 ./kernel/Kconfig | grep -qx 'endmenu'; then
                  echo "::error::KernelSU Next Kconfig does not end in an insertable menu"
                  exit 1
                fi
                susfs_kconfig_block="$(awk '
                  /^\+menu "KernelSU - SUSFS"/ { active = 1 }
                  active {
                    print substr($0, 2)
                    if ($0 ~ /^\+menu /) {
                      depth++
                    } else if ($0 ~ /^\+endmenu$/) {
                      depth--
                      if (depth == 0) exit
                    }
                  }
                ' "$susfs_ksun_patch")"
                if [ -z "$susfs_kconfig_block" ]; then
                  echo "::error::Could not extract the required KernelSU Next SUSFS Kconfig block"
                  exit 1
                fi
                tmp_kconfig="$(mktemp)"
                sed '$d' ./kernel/Kconfig > "$tmp_kconfig"
                printf '%s\n' "$susfs_kconfig_block" >> "$tmp_kconfig"
                printf '%s\n' 'endmenu' >> "$tmp_kconfig"
                mv "$tmp_kconfig" ./kernel/Kconfig
              fi

              # The v3.3.0 source omits the dispatcher guard in both x86
              # blocks and has trailing whitespace in the init guard comment.
              # Restore the v2.2.0 compatibility patch's exact preimage.
              init_source=./kernel/core/init.c
              if [ "$(grep -Fxc '#if defined(__x86_64__)' "$init_source")" -ne 2 ]; then
                echo "::error::Unexpected KernelSU Next v3.3.0 x86 guard layout"
                exit 1
              fi
              if [ "$(grep -Fxc '    // If the kernel has the hardening patch, X86_FEATURE_INDIRECT_SAFE must be set ' "$init_source")" -ne 1 ]; then
                echo "::error::Unexpected KernelSU Next v3.3.0 init guard comment"
                exit 1
              fi
              sed -i \
                -e 's|^#if defined(__x86_64__)$|#if defined(__x86_64__) \&\& !defined(CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER)|' \
                -e 's|^    // If the kernel has the hardening patch, X86_FEATURE_INDIRECT_SAFE must be set $|    // If the kernel has the hardening patch, X86_FEATURE_INDIRECT_SAFE must be set|' \
                "$init_source"
              if [ -d "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version" ]; then
                for compatibility_patch in fix_Kbuild.patch fix_init.c.patch fix_kernel_umount.c.patch fix_setuid_hook.c.patch fix_sucompat.c.patch fix_supercall.c.patch; do
                  gen_patch "susfs-fix-${compatibility_patch%.patch}" "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/$compatibility_patch"
                done
              else
                # WK has no susfs fix set for this version (e.g. v2.3.0).
                # Bouteillepleine tracks newer susfs releases and additionally
                # ships fix_dispatch.c.patch, so fall back to that set.
                susfs_fix_base="https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/next/susfs_fix_patches/${susfs_version}"
                susfs_fix_dir="$(mktemp -d)"
                if fetch_patch "$susfs_fix_base/fix_Kbuild.patch" "$susfs_fix_dir/fix_Kbuild.patch"; then
                  for compatibility_patch in fix_init.c.patch fix_kernel_umount.c.patch fix_setuid_hook.c.patch fix_sucompat.c.patch fix_supercall.c.patch fix_dispatch.c.patch; do
                    if ! fetch_patch "$susfs_fix_base/$compatibility_patch" "$susfs_fix_dir/$compatibility_patch"; then
                      echo "::error::Bouteillepleine susfs fix set for ${susfs_version} is incomplete (missing ${compatibility_patch})"
                      exit 1
                    fi
                  done
                  for compatibility_patch in fix_Kbuild.patch fix_init.c.patch fix_kernel_umount.c.patch fix_setuid_hook.c.patch fix_sucompat.c.patch fix_supercall.c.patch fix_dispatch.c.patch; do
                    gen_patch "susfs-fix-${compatibility_patch%.patch}" "$susfs_fix_dir/$compatibility_patch"
                  done
                  echo "✅ susfs-fix (${susfs_version}, Bouteillepleine fallback) staged"
                else
                  echo "::warning::No KernelSU Next susfs fix patches for ${susfs_version} in WK or Bouteillepleine; continuing without them"
                fi
              fi
              # Filtering the upstream SUSFS patch skips its local sucompat
              # helper and imports. Restore those exact dependencies here.
              sucompat_source=./kernel/feature/sucompat.c
              setuid_hook_source=./kernel/hook/setuid_hook.c
              if [ "$(grep -Fxc '#include <linux/ptrace.h>' "$sucompat_source")" -ne 1 ] ||
                 [ "$(grep -Fxc '#include <linux/uidgid.h>' "$setuid_hook_source")" -ne 1 ] ||
                 [ "$(grep -Fxc 'static char __user *ksud_user_path(void)' "$sucompat_source")" -ne 1 ]; then
                echo "::error::Unexpected KernelSU Next v3.3.0 SUSFS helper layout"
                exit 1
              fi
              sed -i '/^#include <linux\/ptrace.h>$/a #include <linux/fs_struct.h>\n#include <linux/susfs_def.h>\n#include "selinux/selinux.h"' "$sucompat_source"
              sed -i '/^#include <linux\/uidgid.h>$/a #include <linux/susfs_def.h>\n#include "selinux/selinux.h"' "$setuid_hook_source"
              tmp_sucompat="$(mktemp)"
              awk '
                /^static char __user \*ksud_user_path\(void\)$/ {
                  print "static char __user *sh_user_path(void)"
                  print "{"
                  print "\tstatic const char sh_path[] = \"/system/bin/sh\";"
                  print ""
                  print "\treturn userspace_stack_buffer(sh_path, sizeof(sh_path));"
                  print "}"
                  print ""
                }
                { print }
              ' "$sucompat_source" > "$tmp_sucompat"
              mv "$tmp_sucompat" "$sucompat_source"
              for compatibility_patch in overwrite_hook_mode.patch ksu_toolkit.patch; do
                fix_path="$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/$compatibility_patch"
                if [ -f "$fix_path" ]; then
                  gen_patch "susfs-fix-${compatibility_patch%.patch}" "$fix_path"
                fi
              done
            elif [ "${{ inputs.ksu_type }}" = "KSU" ]; then
              cd "$KSU_FOLDER"
              susfs_ksu_patch="$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
              filtered_susfs_patch="$(mktemp)"
              # SUSFS v2.2.0 targets the pre-v3.2 KernelSU hook architecture.
              # Keep v3.2.5's modern hook and late-load implementation intact.
              awk '
                /^diff --git a\/kernel\/(Kbuild|Kconfig|core\/init\.c|feature\/adb_root\.c|feature\/adb_root\.h|feature\/kernel_umount\.c|feature\/sucompat\.c|feature\/sucompat\.h|hook\/setuid_hook\.c|hook\/setuid_hook\.h|hook\/syscall_event_bridge\.c|include\/ksu\.h|runtime\/boot_event\.c|runtime\/ksud\.h|runtime\/ksud_integration\.c|sulog\/event\.c|sulog\/event\.h|supercall\/supercall\.c|supercall\/supercall\.h) b\// { skip = 1; next }
                /^diff --git / { skip = 0 }
                !skip { print }
              ' "$susfs_ksu_patch" > "$filtered_susfs_patch"
              source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
              gen_patch susfs-ksu-enable "$filtered_susfs_patch"
              if ! grep -Eq '^susfs-ksu-enable\|(applied|already)' "$PS_FILE" 2>/dev/null; then
                echo "::error::KernelSU SUSFS enable patch failed to stage at fuzz=0 (see patch-faillogs)"
                exit 1
              fi
              rm "$filtered_susfs_patch"

              if ! grep -q '^config KSU_SUSFS' ./kernel/Kconfig; then
                if ! tail -n 1 ./kernel/Kconfig | grep -qx 'endmenu'; then
                  echo "::error::KernelSU v3.2.5 Kconfig does not end in an insertable menu"
                  exit 1
                fi
                susfs_kconfig_block="$(awk '
                  /^\+menu "KernelSU - SUSFS"/ { active = 1 }
                  active {
                    print substr($0, 2)
                    if ($0 ~ /^\+menu /) {
                      depth++
                    } else if ($0 ~ /^\+endmenu$/) {
                      depth--
                      if (depth == 0) exit
                    }
                  }
                ' "$susfs_ksu_patch")"
                if [ -z "$susfs_kconfig_block" ]; then
                  echo "::error::Could not extract the required KernelSU v3.2.5 SUSFS Kconfig block"
                  exit 1
                fi
                tmp_kconfig="$(mktemp)"
                sed '$d' ./kernel/Kconfig > "$tmp_kconfig"
                printf '%s\n' "$susfs_kconfig_block" >> "$tmp_kconfig"
                printf '%s\n' 'endmenu' >> "$tmp_kconfig"
                mv "$tmp_kconfig" ./kernel/Kconfig
              fi

              init_source=./kernel/core/init.c
              if [ "$(grep -Fxc '#include <linux/moduleparam.h>' "$init_source")" -ne 1 ] ||
                 [ "$(grep -Fxc '    ksu_init_symbol_resolver();' "$init_source")" -ne 1 ]; then
                echo "::error::Unexpected KernelSU v3.2.5 init layout"
                exit 1
              fi
              sed -i '/^#include <linux\/moduleparam.h>$/a #include <linux/susfs.h>' "$init_source"
              sed -i '/^    ksu_init_symbol_resolver();$/i #ifdef CONFIG_KSU_SUSFS\n    susfs_init();\n#endif' "$init_source"

              dispatch_source=./kernel/supercall/dispatch.c
              if [ "$(grep -Fxc '    if (magic2 == KSU_INSTALL_MAGIC2)' "$dispatch_source")" -ne 1 ] ||
                 [ "$(grep -Fxc '        return ksu_supercall_reboot_handler(arg);' "$dispatch_source")" -ne 1 ]; then
                echo "::error::Unexpected KernelSU v3.2.5 supercall dispatch layout"
                exit 1
              fi
              # Keep v3.2.5's existing reboot kprobe for KSU fd installation;
              # the SUSFS dispatch commands remain in the surrounding switch.
              sed -i '/^    if (magic2 == KSU_INSTALL_MAGIC2)$/,+1d' "$dispatch_source"
            else
              echo "ℹ️ Skipping KernelSU folder patch for BakaSU"
            fi
            ;;
          *)
            echo "::error::Unsupported SUSFS version: $susfs_version"
            exit 1
            ;;
        esac
        echo "::endgroup::"

    - name: Apply FinaSU SUSFS Integration
      shell: bash
      if: ${{ inputs.ksu_type == 'FinaSU' && env.OP_SUSFS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply FinaSU SUSFS integration"
        # Kernel-side fs/include copies already happened in 'Apply SUSFS Patches'.
        # This applies the KSU-side 10_enable patch + maintained drift fixes
        # (two-step git apply with hard verification) to the FinaSU tree and
        # forces manual-hook mode (inline hook machinery is removed by the patches).
        SUSFS4KSU="$SUSFS_FOLDER" bash "$GITHUB_WORKSPACE/scripts/finasu_compat/apply.sh" "$KSU_FOLDER"
        echo "NEED_HOOKS=false" >> "$GITHUB_ENV"
        echo "susfs-finasu|applied" >> "$PS_FILE"
        echo "✅ FinaSU SUSFS integration applied"
        echo "::endgroup::"

    - name: Apply SUSFS Kernel Patches
      shell: bash
      if: ${{ env.OP_SUSFS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply SUSFS kernel patches"
        cd "$KERNEL_PLATFORM_FOLDER"
        cd "$COMMON_KERNEL_FOLDER"
        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi
        fi
        
        # Fake kernel patch to fix failures
        fake_patched=0
        fake_patched_expand=0
        had_fold_filemap_fixup=0
        had_task_mmu_vma_pad_start=0
        if grep -Fq 'VMA_PAD_START(' ./fs/proc/task_mmu.c; then
          had_task_mmu_vma_pad_start=1
        fi
        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if grep -Fq '__fold_filemap_fixup_entry' ./fs/proc/task_mmu.c; then
            had_fold_filemap_fixup=1
          fi

          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            echo "nr_subpages Line not found. Fake Patching!"
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
            fake_patched=1
          fi
          
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            echo "#include <linux/zswap.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi
          
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
            echo 'Temporarily expand the `last_vma_end` `if` block to fix a matching issue.'
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
            fake_patched_expand=1
          fi
        fi
        if [ "${{ env.ANDROID_VER }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
        fi
        if [ "${{ env.ANDROID_VER }}" = "android13" ] && [ "${{ env.KERNEL_VER }}" = "5.15" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
          
          if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
            echo "#include swap_slots.h> Line found. Deleting header."
            sed -i '/#include <linux\/swap_slots.h>/d' ./mm/memory.c
            fake_patched=1
          fi
        fi
        
        if [ "${{ env.ANDROID_VER }}" = "android14" ] && [ "${{ env.KERNEL_VER }}" = "6.1" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
          
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
        fi
        
        echo "Applying SUSFS patch..."
        susfs_kernel_patch="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${{ env.SUSFS_KERNEL_BRANCH }}.patch"
        patch_to_apply="$susfs_kernel_patch"
        filtered_kernel_patch=""
        if [ "${{ inputs.ksu_type }}" = "KSU" ]; then
          filtered_kernel_patch="$(mktemp)"
          # Classic KernelSU v3.2.5 already hooks these syscalls through its
          # syscall table. Drop only the duplicate newer-hook hunks while
          # retaining the remaining SUSFS kernel integration.
          awk '
            function flush_hunk() {
              if (hunk == "")
                return
              if (hunk !~ /(ksu_is_init_rc_hook_enabled|ksu_is_input_hook_enabled|ksu_handle_(execveat|faccessat|input_handle_event|stat|sys_read|vfs_fstat)|ksu_supercall_reboot_handler)/) {
                file_body = file_body hunk
                kept_hunk = 1
              }
              hunk = ""
            }
            function flush_file() {
              flush_hunk()
              if (kept_hunk)
                printf "%s%s", file_header, file_body
              file_header = ""
              file_body = ""
              kept_hunk = 0
              in_header = 0
            }
            /^diff --git / {
              flush_file()
              file_header = $0 ORS
              in_header = 1
              next
            }
            /^@@ / {
              flush_hunk()
              hunk = $0 ORS
              in_header = 0
              next
            }
            {
              if (in_header)
                file_header = file_header $0 ORS
              else
                hunk = hunk $0 ORS
            }
            END {
              flush_file()
            }
          ' "$susfs_kernel_patch" > "$filtered_kernel_patch"
          patch_to_apply="$filtered_kernel_patch"
        fi
        # Stage SUSFS through patchgen (diff & generate), fuzz=0 only. The
        # SUS_MAP include pre-shim runs only when the patch lacks the block
        # itself; on gki-android16-6.12 the upstream hunk adds it and a shim
        # would break that hunk's context.
        if ! grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' mm/memory.c && grep -q '#include <linux/vmalloc.h>' mm/memory.c \
           && ! grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' "$patch_to_apply"; then
          echo "[patchgen] susfs-main: pre-shimming mm/memory.c SUS_MAP include block (patch lacks it)"
          sed -i '/#include <linux\/vmalloc.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux\/susfs_def.h>\n#endif \/\/ #ifdef CONFIG_KSU_SUSFS_SUS_MAP' mm/memory.c
        fi
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        # susfs-main is redundant (and self-contradictory) when the synced tree
        # already wires SUSFS into fs/Makefile (pre-integrated community/FinaSU
        # sources). Nothing earlier in this run wires it: 10_enable_susfs_for_ksu
        # only touches kernel/*. Skip instead of stacking a second integration.
        if grep -qF 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile; then
          echo "[patchgen] susfs-main: fs/Makefile already wires CONFIG_KSU_SUSFS - skipping susfs-main"
          echo "susfs-main|already" >> "$PS_FILE"
        else
          gen_patch susfs-main "$patch_to_apply" "" "g:fs/Makefile|susfs.o"
          if ! grep -Eq '^susfs-main\|(applied|already)' "$PS_FILE" 2>/dev/null; then
            echo "::error::SUSFS kernel patch failed to stage at fuzz=0 (resolved SUSFS ref: ${SUSFS_REF:-unknown}; if manually pinned, verify it matches this kernel tree or clear susfs_commit_hash_or_branch to use the per-KMI default) (see patch-faillogs/)"
            exit 1
          fi
        fi
        echo "✅ [susfs-main] verified"
        if [ -n "$filtered_kernel_patch" ]; then
          rm "$filtered_kernel_patch"
        fi

        # SUSFS targets the newer four-argument API, while some OnePlus 5.10
        # trees still expose the original three-argument set_nameidata().
        namei_file="./fs/namei.c"
        old_set_nameidata_call='set_nameidata(nd, old_dfd, fake_filename, NULL);'
        new_set_nameidata_call='set_nameidata(nd, old_dfd, fake_filename);'
        if grep -Eq 'static void set_nameidata\(struct nameidata \*p, int dfd, struct filename \*name\)' "$namei_file"; then
          nameidata_compat_count=$(grep -Fc "$old_set_nameidata_call" "$namei_file" || true)
          if [ "$nameidata_compat_count" -gt 0 ]; then
            sed -i "s|$old_set_nameidata_call|$new_set_nameidata_call|g" "$namei_file"
            if grep -Fq "$old_set_nameidata_call" "$namei_file"; then
              echo "::error::Failed to adapt SUSFS set_nameidata() calls"
              exit 1
            fi
            echo "Adjusted $nameidata_compat_count SUSFS set_nameidata() call(s) for the three-argument kernel API"
          fi
        fi

        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ] && [ "$had_fold_filemap_fixup" -eq 0 ]; then
          fold_filemap_compat_count=$(grep -Fc '__fold_filemap_fixup_entry' ./fs/proc/task_mmu.c || true)
          if [ "$fold_filemap_compat_count" -gt 0 ]; then
            sed -i '/__fold_filemap_fixup_entry/d' ./fs/proc/task_mmu.c
            if grep -Fq '__fold_filemap_fixup_entry' ./fs/proc/task_mmu.c; then
              echo "::error::Failed to remove unsupported SUSFS filemap fixup calls"
              exit 1
            fi
            echo "Removed $fold_filemap_compat_count unsupported SUSFS filemap fixup call(s)"
          fi
        fi

        # Newer SUSFS patches use the VMA padding API in the open-redirect
        # path. Keep the original vm_end behavior for trees that did not use
        # that API before patching, including incomplete vendor backports.
        if [ "$had_task_mmu_vma_pad_start" -eq 0 ]; then
          vma_pad_compat_count=$(grep -Fc 'VMA_PAD_START(vma)' ./fs/proc/task_mmu.c || true)
          if [ "$vma_pad_compat_count" -gt 0 ]; then
            sed -i 's|VMA_PAD_START(vma)|vma->vm_end|g' ./fs/proc/task_mmu.c
            if grep -Fq 'VMA_PAD_START(vma)' ./fs/proc/task_mmu.c; then
              echo "::error::Failed to adapt SUSFS VMA padding calls"
              exit 1
            fi
            echo "Adjusted $vma_pad_compat_count SUSFS VMA padding call(s) for the legacy task_mmu API"
          fi
        fi
        
        # Revert Fake kernel patch
        if [ "$fake_patched_expand" = 1 ]; then
          if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
            if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
              perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
            fi
          fi
        fi
        
        if [ "$fake_patched" = 1 ]; then
          if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
            if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "nr_subpages Line found. Revert Fake Patching!"
              sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
            fi
          fi
          if [ "${{ env.ANDROID_VER }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
          if [ "${{ env.ANDROID_VER }}" = "android13" ] && [ "${{ env.KERNEL_VER }}" = "5.15" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
            
            if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
              echo "#include <linux/swap_slots.h> Line not found. Adding missing header"
              sed -i '/#include <linux\/vmalloc.h>/a #include <linux\/swap_slots.h>' ./mm/memory.c
            fi
          fi
          if [ "${{ env.ANDROID_VER }}" = "android14" ] && [ "${{ env.KERNEL_VER }}" = "6.1" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
        fi
        echo "✅ SUSFS patches applied"

        echo "Add SUSFS Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        EOF
        grep -nE '^CONFIG_KSU_SUSFS' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" | head -n 20 || true
        if [ -f "$COMMON_KERNEL_FOLDER/fs/susfs.c" ]; then
          echo "susfs|applied" >> "$PS_FILE"
          echo "✅ SUSFS config settings added (fs/susfs.c present)"
        else
          echo "::error::fs/susfs.c missing after SUSFS application"
          echo "susfs|failed" >> "$PS_FILE"
          exit 1
        fi

        # pershoot SuSFS/Toolkit coexistence: upstream only ENABLES the uname-spoof
        # static key, so track the reset and disable the key. Optional: warn+continue
        # if it can't stage at fuzz=0. Upstream paths carry kernel_patches/ - rewrite to -p1.
        pershoot_uname_url="https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/pershoot/susfs4ksu/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch"
        if fetch_patch "$pershoot_uname_url" /tmp/pershoot_uname_coexistence.patch; then
          gen_patch pershoot-uname-coexistence /tmp/pershoot_uname_coexistence.patch 's|kernel_patches/fs/|fs/|g'
          if ! grep -Eq '^pershoot-uname-coexistence\|(applied|already)' "$PS_FILE" 2>/dev/null; then
            echo "::warning::pershoot uname coexistence patch did not stage at fuzz=0; continuing without it"
            sed -i '/^pershoot-uname-coexistence|/d' "$PS_FILE" 2>/dev/null || true
            echo "pershoot-uname-coexistence|skipped" >> "$PS_FILE"
          fi
        else
          echo "::warning::pershoot uname coexistence patch unavailable; skipping"
          echo "pershoot-uname-coexistence|skipped" >> "$PS_FILE"
        fi
        
        echo "::endgroup::"
    - name: Apply NoMount
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply NoMount"

        cd "$COMMON_KERNEL_FOLDER"

        echo "Installing NoMount Kbuild package at fs/nomount/..."
        rm -rf "$COMMON_KERNEL_FOLDER/fs/nomount"
        mkdir -p "$COMMON_KERNEL_FOLDER/fs/nomount"
        cp -a "$NOMOUNT_FOLDER/kernel/src/." "$COMMON_KERNEL_FOLDER/fs/nomount/"

        for f in nomount.c nomount.h Kconfig Makefile; do
          if [ ! -f "$COMMON_KERNEL_FOLDER/fs/nomount/$f" ]; then
            echo "::error::fs/nomount/$f missing after copy"
            exit 1
          fi
        done
        echo "✅ NoMount source installed"

        if ! grep -q "nomount" "$COMMON_KERNEL_FOLDER/fs/Makefile"; then
          printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> "$COMMON_KERNEL_FOLDER/fs/Makefile"
          echo "➕ fs/Makefile wired"
        fi

        if ! grep -q 'source "fs/nomount/Kconfig"' "$COMMON_KERNEL_FOLDER/fs/Kconfig"; then
          awk '
            /^endmenu/ { last_match = NR }
            { lines[NR] = $0 }
            END {
              for (i = 1; i <= NR; i++) {
                if (i == last_match) print "source \"fs/nomount/Kconfig\""
                print lines[i]
              }
            }
          ' "$COMMON_KERNEL_FOLDER/fs/Kconfig" > "$COMMON_KERNEL_FOLDER/fs/Kconfig.tmp" \
            && mv "$COMMON_KERNEL_FOLDER/fs/Kconfig.tmp" "$COMMON_KERNEL_FOLDER/fs/Kconfig"
          echo "➕ fs/Kconfig wired"
        fi

        echo "Adding NoMount configuration..."
        if ! grep -q "^CONFIG_NOMOUNT=y" "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"; then
          printf '%s\n' 'CONFIG_NOMOUNT=y' >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        fi
        echo "NOMOUNT_PATCH_NAME=kernel-integration-Kbuild" >> "$GITHUB_ENV"
        printf '%s\n%s\n%s\n' "NoMount" "${NOMOUNT_COMMIT_SHA:-unknown}" "kernel-integration (setup.sh method)" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"

        echo "Verifying NoMount wiring..."
        grep -n "nomount" "$COMMON_KERNEL_FOLDER/fs/Makefile"
        grep -n 'fs/nomount/Kconfig' "$COMMON_KERNEL_FOLDER/fs/Kconfig"
        ls -la "$COMMON_KERNEL_FOLDER/fs/nomount/"

        echo "✅ NoMount integration completed"
        echo "nomount|applied" >> "$PS_FILE"
        echo "::endgroup::"

    - name: Upgrade LZ4 (OPlus 1.10.0 + NEON)
      if: ${{ env.OP_LZ4_UPGRADE == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Upgrade LZ4"
        cd "$COMMON_KERNEL_FOLDER"
        if [ -f lib/lz4/lz4.c ] && grep -q 'lib/lz4/lz4.h' include/linux/lz4.h 2>/dev/null; then
          echo "LZ4 already upgraded, skipping"
        else
          rm -rf "$GITHUB_WORKSPACE/lz4_oplus"
          git clone --depth 1 https://github.com/Numbersf/lz4_oplus.git "$GITHUB_WORKSPACE/lz4_oplus"
          bash "$GITHUB_WORKSPACE/lz4_oplus/apply_lz4_oplus.sh"
        fi
        grep -q 'lib/lz4/lz4.h' include/linux/lz4.h
        grep -q 'LZ4_arm64_decompress_safe' crypto/lz4.c
        ls lib/lz4/lz4.c lib/lz4/lz4hc.c lib/lz4/lz4armv8/lz4accel.c > /dev/null
        echo "LZ4_UPGRADED=true" >> "$GITHUB_ENV"
        echo "LZ4_SOURCE=https://github.com/Numbersf/lz4_oplus" >> "$GITHUB_ENV"
        grep -n 'LZ4_arm64_decompress_safe' crypto/lz4.c | head -n 2 || true
        grep -n '1\.10\.' lib/lz4/lz4.h | head -n 2 || true
        echo "✅ LZ4 upgraded to 1.10.0 with ARM64 NEON acceleration"
        echo "lz4|applied" >> "$PS_FILE"
        echo "::endgroup::"

    - name: Upgrade zstd (1.5.7 + tunable level)
      if: ${{ env.OP_ZSTD_UPGRADE == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Upgrade zstd"
        if [ "${{ env.KERNEL_VER }}" != "6.12" ]; then
          echo "zstd-upgrade|skipped" >> "$PS_FILE"
          echo "zstd 1.5.7 upgrade is staged for 6.12 trees only; this is ${{ env.KERNEL_VER }} - skipping"
          echo "::endgroup::"
          exit 0
        fi
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        if grep -Eq 'ZSTD_VERSION_RELEASE[[:space:]]+7' include/linux/zstd_lib.h && grep -q 'compression_level' crypto/zstd.c; then
          echo "zstd already at 1.5.7 with tunable level, skipping"
          echo "zstd-upgrade|already" >> "$PS_FILE"
        else
          zstd_url="https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8850/6c1ffdac3ebf7ebb80254427a7972262b0a8f64e/zram_patch/002-zstd.patch"
          if ! fetch_patch "$zstd_url" /tmp/zstd_157.patch; then
            echo "::warning::zstd 1.5.7 patch unavailable upstream; continuing without it"
            echo "zstd-upgrade|skipped" >> "$PS_FILE"
            echo "::endgroup::"
            exit 0
          fi
          gen_patch zstd-upgrade /tmp/zstd_157.patch "" "g:crypto/zstd.c|compression_level"
          if ! grep -Eq '^zstd-upgrade\|(applied|already)' "$PS_FILE" 2>/dev/null; then
            echo "::warning::zstd 1.5.7 patch did not stage at fuzz=0; continuing without it"
            sed -i '/^zstd-upgrade|/d' "$PS_FILE" 2>/dev/null || true
            echo "zstd-upgrade|skipped" >> "$PS_FILE"
            echo "::endgroup::"
            exit 0
          fi
        fi
        grep -Eq 'ZSTD_VERSION_RELEASE[[:space:]]+7' include/linux/zstd_lib.h
        grep -q 'module_param(compression_level' crypto/zstd.c
        grep -n 'ZSTD_VERSION_RELEASE' include/linux/zstd_lib.h || true
        echo "ZSTD_UPGRADED=true" >> "$GITHUB_ENV"
        echo "ZSTD_SOURCE=https://github.com/cctv18/oppo_oplus_realme_sm8850 zram_patch/002-zstd.patch @6c1ffda" >> "$GITHUB_ENV"
        echo "✅ zstd upgraded to 1.5.7 with tunable crypto compression level"
        echo "::endgroup::"

    - name: Enable ADIOS I/O Scheduler
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Enable ADIOS I/O scheduler"
        if [ "${OP_ADIOS:-true}" != true ]; then
          echo "adios|skipped" >> "$PS_FILE"
          echo "ADIOS_SKIPPED=disabled-by-config" >> "$GITHUB_ENV"
          echo "ADIOS disabled by config (adios: false); skipping"
          echo "::endgroup::"
          exit 0
        fi
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        if [ ! -f block/adios.c ]; then
          ADIOS_FILE="adios_ioscheduler_${KERNEL_VER}.patch"
          case "${OP_BRANCH:-}" in
            *mt6989*) [ "$KERNEL_VER" = "6.1" ] && ADIOS_FILE="adios_ioscheduler_6.1_mt6989.patch" ;;
          esac
          if ! fetch_patch "https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/experimental/${ADIOS_FILE}" /tmp/adios.patch; then
            echo "::warning::ADIOS patch unavailable (${ADIOS_FILE}); skipping"
            echo "adios|skipped" >> "$PS_FILE"
            echo "ADIOS_SKIPPED=${ADIOS_FILE}" >> "$GITHUB_ENV"
            echo "::endgroup::"
            exit 0
          fi
          gen_patch adios /tmp/adios.patch "" "g:block/adios.c|adios_init_sched"
          if ! grep -Eq '^adios\|(applied|already)' "$PS_FILE" 2>/dev/null; then
            echo "ADIOS_SKIPPED=${ADIOS_FILE}" >> "$GITHUB_ENV"
            echo "::endgroup::"
            exit 0
          fi
        else
          echo "block/adios.c already present, enabling config only"
          echo "adios|applied" >> "$PS_FILE"
        fi
        grep -q 'config MQ_IOSCHED_ADIOS' block/Kconfig.iosched \
          || { echo "::error::ADIOS: 'config MQ_IOSCHED_ADIOS' missing from block/Kconfig.iosched after apply"; exit 1; }
        grep -q 'adios.o' block/Makefile \
          || { echo "::error::ADIOS: 'adios.o' missing from block/Makefile after apply"; exit 1; }
        grep -q '^CONFIG_MQ_IOSCHED_ADIOS=y' arch/arm64/configs/gki_defconfig || \
          echo 'CONFIG_MQ_IOSCHED_ADIOS=y' >> arch/arm64/configs/gki_defconfig
        grep -q '^CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y' arch/arm64/configs/gki_defconfig || \
          echo 'CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y' >> arch/arm64/configs/gki_defconfig
        grep -n 'CONFIG_MQ_IOSCHED' arch/arm64/configs/gki_defconfig || true
        echo "ADIOS_ENABLED=true" >> "$GITHUB_ENV"
        echo "ADIOS_SOURCE=https://github.com/firelzrd/adios" >> "$GITHUB_ENV"
        echo "✅ ADIOS I/O scheduler enabled"
        echo "::endgroup::"

    - name: Add BBG
      if: ${{ env.OP_BBG == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add BBG LSM"
        cd "$KERNEL_PLATFORM_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        echo "Adding BBG..."
        if ! wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
        
        if grep -qxF $'\t\tconst char* symlink_target_link = inode->i_op->get_link(dentry, inode, NULL);' ./Baseband-guard/baseband_guard.c; then
          echo "Applying BBG get_link fix"
          gen_patch bbg-getlink "$KERNEL_PATCHES_FOLDER/experimental/bbg/bbg_fix_get_link.patch"
        fi
        if [ -f Baseband-guard/baseband_guard.c ] || [ -f common/Baseband-guard/baseband_guard.c ]; then
          grep -n '^CONFIG_BBG=y' common/arch/arm64/configs/gki_defconfig || true
          grep -n 'baseband_guard' common/security/Kconfig | head -n 3 || true
          echo "✅ BBG LSM added"
          echo "bbg|applied" >> "$PS_FILE"
        else
          echo "::warning::BBG evidence check failed (baseband_guard.c missing); marking failed"
          echo "bbg|failed" >> "$PS_FILE"
        fi
        echo "::endgroup::"

    - name: Apply KSU Hooks
      shell: bash
      if: ${{ env.NEED_HOOKS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply KSU hooks"
        cd "$COMMON_KERNEL_FOLDER"
        echo "Applying KSU hooks patch..."
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        gen_patch ksu-hooks-manual "$KERNEL_PATCHES_FOLDER/next/scope_min_manual_hooks_v1.4.patch"
        if ! grep -Eq '^ksu-hooks-manual\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "::error::KSU hooks patch failed to stage at fuzz=0 (see patch-faillogs)"
          exit 1
        fi
        echo "✅ KSU hooks applied"
        echo "ksu_hooks|applied" >> "$PS_FILE"
        echo "::endgroup::"

    - name: Apply gki_ptrace patch
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply gki_ptrace"
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          gen_patch gki_ptrace "$KERNEL_PATCHES_FOLDER/gki_ptrace.patch"
        else
          echo "Kernel >= $MIN_VERSION, skipping ptrace patch"
        fi
        echo "::endgroup::"
        if grep -Eq '^gki_ptrace\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "✅ gki_ptrace patch applied at fuzz=0"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.16" | sort -V | head -n1)" != "$KERNEL_VERSION" ]; then
          echo "✅ gki_ptrace skipped by design (applies only on kernels <= 5.16; this is $KERNEL_VERSION)"
        else
          echo "::error::gki_ptrace patch did not apply (no applied/already status in $PS_FILE)"; exit 1
        fi

    - name: Apply rtmutex CVE-2026-43499 fix
      if: ${{ env.OP_RTMUTEX_CVE == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply rtmutex CVE-2026-43499"
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        SUBLEVEL="$(awk '/^SUBLEVEL *=/ { print $3; exit }' Makefile 2>/dev/null || true)"
        RTM="kernel/locking/rtmutex.c"
        RTMUTEX_PIN="d6255c5f44e3871743c7d1570436822227b4b2fd"
        RTMUTEX_BASE="https://raw.githubusercontent.com/LingLuo17/AnyKernel3/${RTMUTEX_PIN}/security_patch"
        skip_cve() {
          echo "rtmutex-cve|skipped" >> "$PS_FILE"
          echo "::endgroup::"
          exit 0
        }
        ensure_followup_fixes() {
          # CVE-2026-53163: fixes the regression the 43499 backport introduced.
          if ! grep -q 'if (!waiter_task) /\* never enqueued \*/' "$RTM"; then
            if awk '
              /^static .*remove_waiter\(/ { in_remove_waiter = 1 }
              {
                print
                if (in_remove_waiter && /lockdep_assert_held\(&lock->wait_lock\);/) {
                  match($0, /^[[:space:]]*/)
                  indent = substr($0, RSTART, RLENGTH)
                  print ""
                  print indent "if (!waiter_task) /* never enqueued */"
                  print indent "\treturn;"
                  inserted++
                  in_remove_waiter = 0
                }
              }
              END { if (inserted != 1) exit 42 }
            ' "$RTM" > /tmp/c4.rtm; then
              mv /tmp/c4.rtm "$RTM"
              echo "Applied CVE-2026-53163 remove_waiter() NULL guard."
            else
              rm -f /tmp/c4.rtm
              echo "::warning::CVE-2026-53163: could not locate remove_waiter() probe site; NULL guard left unchanged"
            fi
          fi
          proxy_target=""
          for candidate in kernel/locking/rtmutex_api.c kernel/locking/rtmutex.c; do
            if [ -f "$candidate" ] && grep -q 'ret = __rt_mutex_start_proxy_lock' "$candidate"; then
              proxy_target="$candidate"
              break
            fi
          done
          if [ -z "$proxy_target" ]; then
            echo "CVE-2026-53163 proxy cleanup path is absent; no change required."
            return 0
          fi
          if grep -q 'if (unlikely(ret < 0))' "$proxy_target"; then
            echo "CVE-2026-53163 proxy cleanup fix already present."
            return 0
          fi
          if awk '
            /ret = __rt_mutex_start_proxy_lock/ { in_proxy_start = 1 }
            in_proxy_start && /if \(unlikely\(ret\)\)/ {
              sub(/if \(unlikely\(ret\)\)/, "if (unlikely(ret < 0))")
              replaced++
              in_proxy_start = 0
            }
            { print }
            END { if (replaced != 1) exit 42 }
          ' "$proxy_target" > /tmp/c4.api; then
            mv /tmp/c4.api "$proxy_target"
            echo "Applied CVE-2026-53163 proxy cleanup fix to $proxy_target."
          else
            rm -f /tmp/c4.api
            echo "::warning::CVE-2026-53163: could not relocate proxy cleanup condition in $proxy_target; leaving unchanged"
          fi
        }
        install_scoped_guard_support() {
          if [ ! -f include/linux/cleanup.h ] || ! grep -q 'scoped_guard' include/linux/cleanup.h; then
            cp /tmp/cve43499/scoped_guard_cleanup.h include/linux/cleanup.h
          fi
          if [ -f include/linux/compiler_attributes.h ] && ! grep -q '^#define __cleanup(func)' include/linux/compiler_attributes.h; then
            awk -v insert_file="/tmp/cve43499/scoped_guard_compiler_cleanup.txt" '
              function emit() { while ((getline line < insert_file) > 0) print line; close(insert_file) }
              { lines[NR] = $0; if ($0 ~ /^#endif/) last_endif = NR }
              END {
                for (i = 1; i <= NR; i++) { if (i == last_endif) emit(); print lines[i] }
                if (!last_endif) emit()
              }
            ' include/linux/compiler_attributes.h > /tmp/c4.attr && mv /tmp/c4.attr include/linux/compiler_attributes.h
          elif [ -f include/linux/compiler.h ] && ! grep -q '^#define __cleanup(func)' include/linux/compiler.h; then
            cat /tmp/cve43499/scoped_guard_compiler_cleanup.txt >> include/linux/compiler.h
          else
            echo "::error::neither compiler_attributes.h nor compiler.h found for __cleanup backport"
            return 1
          fi
          if [ -f include/linux/compiler-clang.h ] && ! grep -q 'Clang prior to 17' include/linux/compiler-clang.h; then
            cat /tmp/cve43499/scoped_guard_compiler_clang.txt >> include/linux/compiler-clang.h
          fi
          if ! grep -q '#include <linux/cleanup.h>' include/linux/spinlock.h; then
            awk '
              { print }
              !done && /^#include <linux\/lockdep.h>/ { print "#include <linux/cleanup.h>"; done = 1 }
              !done && /^#include <linux\/bottom_half.h>/ { print "#include <linux/cleanup.h>"; done = 1 }
              END { if (!done) print "#include <linux/cleanup.h>" }
            ' include/linux/spinlock.h > /tmp/c4.spin && mv /tmp/c4.spin include/linux/spinlock.h
          fi
          if ! grep -q 'DEFINE_LOCK_GUARD_1(raw_spinlock' include/linux/spinlock.h; then
            awk -v insert_file="/tmp/cve43499/scoped_guard_spinlock_guards.txt" '
              function emit() { while ((getline line < insert_file) > 0) print line; close(insert_file) }
              !done && /^#undef __LINUX_INSIDE_SPINLOCK_H/ { emit(); done = 1 }
              !done && /^#endif .*__LINUX_SPINLOCK_H/ { emit(); done = 1 }
              { print }
              END { if (!done) emit() }
            ' include/linux/spinlock.h > /tmp/c4.grd && mv /tmp/c4.grd include/linux/spinlock.h
          fi
        }
        ensure_scoped_guard_support() {
          if grep -qs 'DEFINE_LOCK_GUARD_1(raw_spinlock' include/linux/spinlock.h \
             && grep -qs 'scoped_guard' include/linux/cleanup.h; then
            return 0
          fi
          echo "Applying scoped_guard/raw_spinlock helper backport..."
          sed -i '/^rtmutex-guards|/d' "$PS_FILE" 2>/dev/null || true
          gen_patch rtmutex-guards /tmp/cve43499/cve-2026-43499-guards.patch "" \
            "g:include/linux/cleanup.h|scoped_guard\(_name, args...\);g:include/linux/spinlock.h|DEFINE_LOCK_GUARD_1\(raw_spinlock, raw_spinlock_t,"
          if grep -Eq '^rtmutex-guards\|(applied|already)' "$PS_FILE" 2>/dev/null; then
            return 0
          fi
          sed -i '/^rtmutex-guards|/d' "$PS_FILE" 2>/dev/null || true
          echo "Helper patch did not match; installing scoped_guard support directly..."
          install_scoped_guard_support
          echo "rtmutex-guards|applied" >> "$PS_FILE"
        }
        ensure_rtmutex_c99() {
          case "$KERNEL_VERSION" in
            5.10|5.15) ;;
            *) return 0 ;;
          esac
          local mk="kernel/locking/Makefile" add obj esc
          [ -f "$mk" ] || { echo "::error::kernel/locking/Makefile not found"; exit 1; }
          add="$(mktemp)"
          for obj in rtmutex.o rtmutex_api.o rwsem.o ww_rt_mutex.o spinlock_rt.o; do
            esc="${obj//./\\.}"
            grep -q "^CFLAGS_REMOVE_${esc} .*std=gnu89" "$mk" || echo "CFLAGS_REMOVE_${obj} += -std=gnu89" >> "$add"
            grep -q "^CFLAGS_${esc} .*std=gnu99" "$mk" || echo "CFLAGS_${obj} += -std=gnu99" >> "$add"
          done
          [ -s "$add" ] || { rm -f "$add"; return 0; }
          echo "Forcing rtmutex include units to gnu99 for scoped_guard on 5.x..."
          awk -v insert_file="$add" '
            function emit() { while ((getline line < insert_file) > 0) print line; close(insert_file) }
            !done && /^obj-\$\(CONFIG_RT_MUTEXES\).*rtmutex/ { emit(); done = 1 }
            { print }
            END { if (!done) emit() }
          ' "$mk" > /tmp/c4.mk && mv /tmp/c4.mk "$mk"
          rm -f "$add"
        }
        case "$KERNEL_VERSION" in
          6.12)
            cve_url="${RTMUTEX_BASE}/cve-2026-43499-rtmutex-6.12.patch"
            if ! fetch_patch "$cve_url" /tmp/rtmutex_cve_6_12.patch; then
              echo "::warning::CVE-2026-43499 patch unavailable upstream; continuing without it"
              skip_cve
            fi
            gen_patch rtmutex-cve /tmp/rtmutex_cve_6_12.patch "" "g:kernel/locking/rtmutex.c|waiter_task->pi_blocked_on = NULL;g:kernel/locking/rtmutex.c|waiter::task != current"
            if ! grep -Eq '^rtmutex-cve\|(applied|already)' "$PS_FILE" 2>/dev/null; then
              echo "::warning::CVE-2026-43499 fix did not stage at fuzz=0; continuing without it"
              sed -i '/^rtmutex-cve|/d' "$PS_FILE" 2>/dev/null || true
              skip_cve
            fi
            # Same chain as <=6.6: AK3 rtmutex.c core; the rtmutex_api.c
            # proxy-cleanup piece lands via the tolerant follow-up pass.
            ensure_followup_fixes || echo "::warning::CVE-2026-53163 follow-up probe inconclusive; leaving tree as-is"
            if [ "$(grep -E '^rtmutex-cve\|' "$PS_FILE" | tail -n1)" = "rtmutex-cve|applied" ]; then
              grep -q 'waiter_task->pi_blocked_on = NULL' kernel/locking/rtmutex.c \
                || echo "::warning::rtmutex.c core marker missing after apply"
              grep -q 'if (unlikely(ret < 0))' kernel/locking/rtmutex_api.c 2>/dev/null \
                || echo "::warning::rtmutex_api.c proxy-cleanup marker absent (tolerated)"
            fi
            echo "RTMUTEX_CVE_FIXED=true" >> "$GITHUB_ENV"
            echo "RTMUTEX_CVE_SOURCE=LingLuo17/AnyKernel3 security_patch/cve-2026-43499-rtmutex-6.12.patch @${RTMUTEX_PIN:0:7}" >> "$GITHUB_ENV"
            echo "✅ CVE-2026-43499 rtmutex fix applied (remove_waiter futex PI proxy path)"
            echo "::endgroup::"
            exit 0
            ;;
          5.10|5.15|6.1|6.6)
            variant=""
            fallback=""
            case "$KERNEL_VERSION" in
              5.10) variant="cve-2026-43499-rtmutex-5.10.patch"; fallback="cve-2026-43499-rtmutex-5.15.patch" ;;
              5.15) variant="cve-2026-43499-rtmutex-5.15.patch" ;;
              *) variant="cve-2026-43499-rtmutex-6.1-6.6.patch" ;;
            esac
            # Fix-chain gate (upstream d6255c5f): 5.10/5.15 always; 6.1 < 177; 6.6 < 144.
            case "$KERNEL_VERSION" in
              6.1|6.6)
                if [ "$KERNEL_VERSION" = "6.1" ]; then min="177"; else min="144"; fi
                if ! [[ "${SUBLEVEL:-}" =~ ^[0-9]+$ ]]; then
                  echo "::warning::CVE-2026-43499: non-numeric SUBLEVEL for ${KERNEL_VERSION} (${SUBLEVEL:-unset}); skipping"
                  skip_cve
                fi
                if [ "$SUBLEVEL" -ge "$min" ]; then
                  echo "CVE-2026-43499/CVE-2026-53163 fix chain is upstream in ${KERNEL_VERSION}.${SUBLEVEL}; skipping"
                  skip_cve
                fi
                ;;
            esac
            mkdir -p /tmp/cve43499
            fetch_ok=true
            for f in cve-2026-43499-guards.patch scoped_guard_cleanup.h \
                     scoped_guard_compiler_clang.txt scoped_guard_compiler_cleanup.txt \
                     scoped_guard_spinlock_guards.txt "$variant"; do
              if ! fetch_patch "${RTMUTEX_BASE}/${f}" "/tmp/cve43499/${f}"; then
                fetch_ok=false
                break
              fi
            done
            if [ "$fetch_ok" != true ]; then
              echo "::warning::CVE-2026-43499 patch chain unavailable (LingLuo17/AnyKernel3 @${RTMUTEX_PIN:0:7}); continuing without it"
              skip_cve
            fi
            echo "Applying the CVE-2026-43499 rtmutex fix chain for kernel ${KERNEL_VERSION}..."
            if grep -q 'struct task_struct \*waiter_task = waiter->task;' "$RTM"; then
              echo "CVE-2026-43499 rtmutex fix already present."
              if grep -q 'scoped_guard(raw_spinlock' "$RTM"; then
                ensure_scoped_guard_support
                ensure_rtmutex_c99
              fi
              ensure_followup_fixes || echo "::warning::CVE-2026-53163 follow-up probe inconclusive; leaving tree as-is"
              echo "rtmutex-cve|already" >> "$PS_FILE"
              echo "✅ CVE-2026-43499/CVE-2026-53163 fix chain complete (already in tree)"
              echo "::endgroup::"
              exit 0
            fi
            ensure_scoped_guard_support
            ensure_rtmutex_c99
            verify_spec="g:kernel/locking/rtmutex.c|waiter_task->pi_blocked_on = NULL;g:kernel/locking/rtmutex.c|scoped_guard\(raw_spinlock, &waiter_task->pi_lock\);g:kernel/locking/rtmutex.c|next_lock, NULL, waiter_task\)"
            sed -i '/^rtmutex-cve|/d' "$PS_FILE" 2>/dev/null || true
            gen_patch rtmutex-cve "/tmp/cve43499/${variant}" "" "$verify_spec"
            if ! grep -Eq '^rtmutex-cve\|(applied|already)' "$PS_FILE" 2>/dev/null && [ -n "$fallback" ]; then
              echo "Primary patch did not match; trying fallback shape: ${fallback}"
              sed -i '/^rtmutex-cve|/d' "$PS_FILE" 2>/dev/null || true
              gen_patch rtmutex-cve "/tmp/cve43499/${fallback}" "" "$verify_spec"
            fi
            if ! grep -Eq '^rtmutex-cve\|(applied|already)' "$PS_FILE" 2>/dev/null; then
              echo "::warning::CVE-2026-43499 fix did not stage at fuzz=0; continuing without it"
              sed -i '/^rtmutex-cve|/d' "$PS_FILE" 2>/dev/null || true
              skip_cve
            fi
            ensure_followup_fixes || echo "::warning::CVE-2026-53163 follow-up probe inconclusive; leaving tree as-is"
            if [ "$(grep -E '^rtmutex-cve\|' "$PS_FILE" | tail -n1)" = "rtmutex-cve|applied" ]; then
              grep -q 'waiter_task->pi_blocked_on = NULL' "$RTM"
              grep -q 'waiter::task != current' "$RTM"
              grep -q 'scoped_guard(raw_spinlock, &waiter_task->pi_lock)' "$RTM"
            fi
            echo "RTMUTEX_CVE_FIXED=true" >> "$GITHUB_ENV"
            echo "RTMUTEX_CVE_SOURCE=LingLuo17/AnyKernel3 security_patch (flat) @${RTMUTEX_PIN:0:7}" >> "$GITHUB_ENV"
            echo "✅ CVE-2026-43499 rtmutex fix chain applied (${KERNEL_VERSION}.${SUBLEVEL:-x}, remove_waiter futex PI proxy path + CVE-2026-53163 follow-ups)"
            echo "::endgroup::"
            ;;
          *)
            echo "CVE-2026-43499 fix is staged for 5.10/5.15/6.1/6.6/6.12 trees only; this is ${KERNEL_VERSION} - skipping"
            skip_cve
            ;;
        esac

    - name: Apply HMBIRD Fengchi patches
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply HMBIRD Fengchi patches"
        cd "$COMMON_KERNEL_FOLDER"
        if [ "$OP_HMBIRD" = true ]; then
          echo "Patching hmbird!"
          HMBIRD_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
          case "$OP_MODEL" in
            OP-ACE-5-ULTRA-6.6.50|OP-ACE-5-PRO-6.6.30|OP13-CPH-6.6.56)
              FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird/deprecated" ;;
            *)
              FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird" ;;
          esac
          case "$OP_MODEL" in
            OP13-6.6.30)
              HMBIRD_MODEL="OP13-PJZ" ;;
          esac
          HMBIRD_OS="$OP_OS_VERSION"
          FENGCHI_PATCH="$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${HMBIRD_OS}.patch"
          FENGCHI_OK=true
          source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
          if [ -f "$FENGCHI_PATCH" ]; then
            dos2unix "$FENGCHI_PATCH"
            gen_patch fengchi "$FENGCHI_PATCH"
            if ! grep -Eq '^fengchi\|(applied|already)' "$PS_FILE" 2>/dev/null; then
              echo "::warning::fengchi did not stage at fuzz=0; retrying after kernel/fork.c compat shim"
              sed -i "/^fengchi|/d" "$PS_FILE" 2>/dev/null || true
              if [ "$(grep -cFx $'\tsched_ext_free(tsk);' kernel/fork.c 2>/dev/null || true)" = "1" ] && ! grep -q 'hmbird_free(tsk);' kernel/fork.c; then
                perl -0pi -e 's/\tsched_ext_free\(tsk\);\n/#ifdef CONFIG_HMBIRD_SCHED\n\thmbird_free(tsk);\n#endif\n/' kernel/fork.c
                gen_patch fengchi "$FENGCHI_PATCH"
              fi
            fi
            grep -Eq '^fengchi\|(applied|already)' "$PS_FILE" 2>/dev/null || FENGCHI_OK=false
          else
            echo "::warning::no fengchi patch for ${HMBIRD_MODEL}_${HMBIRD_OS} (Gen5/6.12): overwriter + hmbird_config still apply"
            FENGCHI_OK=false
          fi
          dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
          gen_patch hmbird-overwriter "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
          chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh 2>/dev/null || true
          dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
          gen_patch hmbird-config "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
          if [ "$FENGCHI_OK" = true ]; then
            grep -n 'CONFIG_HMBIRD' arch/arm64/configs/gki_defconfig 2>/dev/null | head -n 3 || true
            grep -n 'hmbird_free' kernel/fork.c 2>/dev/null | head -n 2 || true
            echo "✅ HMBIRD Fengchi applied"
            echo "hmbird|applied" >> "$PS_FILE"
          elif [ -f "$FENGCHI_PATCH" ]; then
            echo "hmbird|failed" >> "$PS_FILE"
          else
            echo "hmbird|dt-only" >> "$PS_FILE"
          fi
        else
          echo "hmbird|skipped" >> "$PS_FILE"
          echo "Hmbird not enabled, skipping fengchi patch"
        fi
        echo "::endgroup::"
    - name: Apply module overlay
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply module overlay"
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        MODULE_OVERLAY_PATCH="$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/0001-module-Add-module-intercept-and-overlay-mechanism-$ANDROID_VER-$KERNEL_VER.patch"
        gen_patch module_overlay "$MODULE_OVERLAY_PATCH"
        if [ "$(grep -xc 'module_overlay|applied' "$PS_FILE" 2>/dev/null || true)" != "1" ]; then
          echo "::error::Module overlay patch did not apply - the module intercept mechanism is required"
          exit 1
        fi
        MODULE_OVERLAY_DIR=""
        if [ -d "$COMMON_KERNEL_FOLDER/kernel/module/module_overlay" ]; then
          MODULE_OVERLAY_DIR="$COMMON_KERNEL_FOLDER/kernel/module/module_overlay"
        elif [ -d "$COMMON_KERNEL_FOLDER/kernel/module_overlay" ]; then
          MODULE_OVERLAY_DIR="$COMMON_KERNEL_FOLDER/kernel/module_overlay"
        else
          echo "::error::Module overlay patch did not create the expected directory"
          exit 1
        fi
        chmod +x "$MODULE_OVERLAY_DIR/convert_overlay.sh"
        copied_modules=""
        SOC="${OP_BRANCH#*/}"
        declare -A selected_file=()
        declare -A selected_priority=()
        selected_count=0
        suffixes=(
          "_${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
          "_${SOC}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
          "_${OP_MODEL}_${OP_OS_VERSION}.ko"
          "_${SOC}_${OP_OS_VERSION}.ko"
          "_${OP_MODEL}.ko"
          "_${SOC}.ko"
          "_${KERNEL_FULL_VER}.ko"
        )
        while IFS= read -r -d '' file; do
          filename="${file##*/}"
          module_name=""
          priority=0
          exact_module_name=$(modinfo -F name "$file" 2>/dev/null)
          for i in "${!suffixes[@]}"; do
            suffix="${suffixes[$i]}"
            if [[ "$filename" == *"$suffix" ]]; then
              extracted_name="${filename%"$suffix"}"
              extracted_normalized="${extracted_name//-/_}"
              if [[ "$extracted_normalized" == "$exact_module_name" ]]; then
                module_name="$extracted_name"
                priority=$((i + 1))
              fi
              break
            fi
          done
          [[ -n "$module_name" ]] || continue
          if [[ -z "${selected_priority[$module_name]+exists}" ]]; then
            echo "New module: $file"
            selected_file["$module_name"]="$file"
            selected_priority["$module_name"]="$priority"
            selected_count=$((selected_count + 1))
          elif (( priority < selected_priority["$module_name"] )); then
            echo "Existing module: $file ; replace with a higher-priority variant."
            selected_file["$module_name"]="$file"
            selected_priority["$module_name"]="$priority"
          fi
        done < <(find "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/modules/" -type f -name '*.ko' -print0)
        if (( selected_count == 0 )); then
          echo "No matching kernel modules found."
        fi
        for module_name in "${!selected_file[@]}"; do
          file="${selected_file[$module_name]}"
          priority="${selected_priority[$module_name]}"
          echo "Copying module '$module_name' priority=$priority: $file"
          dest_path="$MODULE_OVERLAY_DIR/modules/${module_name}.ko"
          cp -v -- "$file" "$dest_path"
          if [ -z "$copied_modules" ]; then
            copied_modules="$dest_path"
          else
            copied_modules="$copied_modules:$dest_path"
          fi
        done
        ccache --set-config=extra_files_to_hash="$copied_modules"
        echo "✅ module overlay applied"
        echo "::endgroup::"
    - name: Apply WildKernels' optimisations
      if: ${{ env.OP_OPT == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply WildKernels' optimisations (opt bundle, patchgen staging @ fuzz=0)"
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        # The opt switch only decides WHETHER the bundle runs, never HOW: every
        # member still goes through patchgen staging (fuzz=0 or not applied, exact
        # anchor rescue, post-apply self-verification). gen_patch returns 0 even
        # when a member can't stage (it writes '<name>|failed' to $PS_FILE), so one
        # drifted member skips itself instead of aborting the remaining members.
        WK_SKIPPED=""
        wk_tally() { # <name>: read the latest status gen_patch recorded
          local st
          st="$(grep -E "^$1\|" "$PS_FILE" 2>/dev/null | tail -n1 || true)"
          case "$st" in
            *"|failed"|*"|skipped") WK_SKIPPED="$WK_SKIPPED $1" ;;
          esac
        }
        wk_apply() { # <name> [sed_expr]
          if [ $# -gt 1 ]; then
            gen_patch "$1" "$KERNEL_PATCHES_FOLDER/common/$1.patch" "$2"
          else
            gen_patch "$1" "$KERNEL_PATCHES_FOLDER/common/$1.patch"
          fi
          wk_tally "$1"
        }
        for p in optimized_mem_operations file_struct_8bytes_align \
                 reduce_cache_pressure mem_opt_prefetch; do
          wk_apply "$p"
        done
        # optimise_memcmp: symbol-shape dependent (weak-PI memcmp variant)
        MEMCMP_SRC="$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch"
        if grep -q 'SYM_FUNC_START(__pi_memcmp)' arch/arm64/lib/memcmp.S 2>/dev/null; then
          gen_patch optimise_memcmp "$MEMCMP_SRC"
        elif grep -q 'SYM_FUNC_START_WEAK_PI(memcmp)' arch/arm64/lib/memcmp.S 2>/dev/null; then
          echo "Patching optimise_memcmp.patch (sed variant for the weak-PI memcmp shape)"
          gen_patch optimise_memcmp "$MEMCMP_SRC" "s/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/; s/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/; s/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/"
        else
          echo "::warning::optimise_memcmp: unrecognized memcmp.S symbol shape; skipping"
          echo "optimise_memcmp|skipped" >> "$PS_FILE"
        fi
        wk_tally optimise_memcmp
        for p in minimise_wakeup_time int_sqrt force_tcp_nodelay \
                 reduce_gc_thread_sleep_time add_timeout_wakelocks_globally \
                 f2fs_reduce_congestion reduce_freeze_timeout; do
          wk_apply "$p"
        done
        # clear_page_16bytes_align: symbol-shape dependent (__pi clear_page variants)
        CLEAR_PAGE_SRC="$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch"
        if grep -q 'SYM_FUNC_START_PI(clear_page)' arch/arm64/lib/clear_page.S 2>/dev/null; then
          gen_patch clear_page_16bytes_align "$CLEAR_PAGE_SRC"
        elif grep -q 'SYM_FUNC_START_PI(__pi_clear_page)' arch/arm64/lib/clear_page.S 2>/dev/null; then
          echo "Patching clear_page_16bytes_align.patch (sed variant for the __pi clear_page shape)"
          gen_patch clear_page_16bytes_align "$CLEAR_PAGE_SRC" "s/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/"
        elif grep -q 'SYM_FUNC_START(__pi_clear_page)' arch/arm64/lib/clear_page.S 2>/dev/null; then
          echo "Patching clear_page_16bytes_align.patch (sed variant for the plain __pi clear_page shape)"
          gen_patch clear_page_16bytes_align "$CLEAR_PAGE_SRC" "s/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START(__pi_clear_page)/"
        else
          echo "::warning::clear_page_16bytes_align: unrecognized clear_page.S symbol shape; skipping"
          echo "clear_page_16bytes_align|skipped" >> "$PS_FILE"
        fi
        wk_tally clear_page_16bytes_align
        for p in add_limitation_scaling_min_freq re_write_limitation_scaling_min_freq \
                 adjust_cpu_scan_order avoid_extra_s2idle_wake_attempts \
                 disable_cache_hot_buddy f2fs_enlarge_min_fsync_blocks \
                 increase_ext4_default_commit_age increase_sk_mem_packets \
                 reduce_pci_pme_wakeups silence_irq_cpu_logspam \
                 silence_system_logspam use_unlikely_wrap_cpufreq; do
          wk_apply "$p"
        done
        if [ -z "$WK_SKIPPED" ]; then
          echo "wk-opt|applied" >> "$PS_FILE"
          echo "✅ wildkernels-optimisations verified (25/25 applied or already in tree)"
        else
          echo "wk-opt|skipped" >> "$PS_FILE"
          echo "::warning::wildkernels-optimisations: member(s) not applied:$WK_SKIPPED"
          echo "⚠️ wildkernels-optimisations verified with skips (not applied:$WK_SKIPPED)"
        fi
        echo "::endgroup::"
    - name: Apply NTSync Patch
      shell: bash
      if: ${{ env.OP_NTSYNC == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply NTSync patch"
        cd "$COMMON_KERNEL_FOLDER"
        NTSYNC_FOLDER="$KERNEL_PATCHES_FOLDER/common/ntsync"
        GKI_KEY="${ANDROID_VER}-${KERNEL_VER}"
        BRANCH_SUFFIX=$(basename "$OP_BRANCH")
        
        NTSYNC_PATCH=""
        case "$OP_MODEL" in
          OP10r|OP-ACE-2-5.10.209|OP-ACE-2V-5.10.209|OP-PAD-MT6983-5.10.209|\
          OP10pro-5.10.209|OP10t-5.10.209|OP-ACE-5.10.209|OP11r-5.10.209|\
          OP-NORD-3-5.10.209|OP-ACE-RACE-5.10.209)
            if [[ "$OP_OS_VERSION" == "A15" ]]; then
              # Upstream ships this A15 5.10 compat patch under the _A14 name.
              NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_android12-5.10_A14.patch"
            fi
            ;;
        esac
        if [ -n "$NTSYNC_PATCH" ] && [ ! -f "$NTSYNC_PATCH" ]; then
          echo "::warning::NTSync compat patch not found for ${OP_MODEL}: $(basename "$NTSYNC_PATCH"); skipping NTSync"
          echo "ntsync|skipped" >> "$PS_FILE"
          echo "::endgroup::"
          exit 0
        fi
        if [ -z "$NTSYNC_PATCH" ]; then
          if [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch" ]; then
            NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch"
          elif [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch" ]; then
            NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch"
          else
            echo "::warning::NTSync compat patch not found for ${GKI_KEY} (Model: ${OP_MODEL}, OS: ${OP_OS_VERSION}); skipping NTSync"
            echo "ntsync|skipped" >> "$PS_FILE"
            echo "::endgroup::"
            exit 0
          fi
        fi
        
        echo "Using patch: $(basename $NTSYNC_PATCH)"
        if [ "$ANDROID_VER" = "android16" ] && [ "$KERNEL_VER" = "6.12" ]; then
          echo "Removing pre-existing ntsync files for android16-6.12"
          rm -f include/uapi/linux/ntsync.h
          rm -f drivers/misc/ntsync.c
        fi
        
        echo "Patching $(basename $NTSYNC_PATCH)!"
        # Pre-shim: only when this compat patch actually targets lockdep.h,
        # idempotently add the missing no-op lockdep macros (formerly the
        # post-failure .rej rescue) so the hunk lands at fuzz=0.
        if grep -Eq '^\+\+\+ (a/|b/)?include/linux/lockdep\.h' "$NTSYNC_PATCH" && [ -f include/linux/lockdep.h ]; then
          grep -q '#define lockdep_assert(c)' include/linux/lockdep.h || \
            sed -i '/#define lockdep_is_held_type(l, r)/a\#define lockdep_assert(c)\t\t\tdo { } while (0)' include/linux/lockdep.h
          grep -q '#define lockdep_assert_once(c)' include/linux/lockdep.h || \
            sed -i '/#define lockdep_assert(c)/a\#define lockdep_assert_once(c)\t\t\tdo { } while (0)' include/linux/lockdep.h
          grep -q '#define lockdep_assert_not_held(l)' include/linux/lockdep.h || \
            sed -i '/#define lockdep_assert_held(l)/a\#define lockdep_assert_not_held(l)\t\tdo { (void)(l); } while (0)' include/linux/lockdep.h
          grep -q '#define lockdep_assert_none_held_once()' include/linux/lockdep.h || \
            sed -i '/#define lockdep_assert_held_once(l)/a\#define lockdep_assert_none_held_once()\tdo { } while (0)' include/linux/lockdep.h
        fi
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        gen_patch ntsync-compat "$NTSYNC_PATCH"
        if ! grep -Eq '^ntsync-compat\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "::warning::$(basename "$NTSYNC_PATCH") failed to stage at fuzz=0; continuing without NTSync compat"
          echo "ntsync|failed" >> "$PS_FILE"
          echo "::endgroup::"
          exit 0
        fi

        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        gen_patch ntsync "$NTSYNC_FOLDER/ntsync_base.patch" "" "g:drivers/misc/ntsync.c|ntsync_misc"
        if grep -Eq '^ntsync\|(applied|already)$' "$PS_FILE"; then
          printf '%s\n' 'CONFIG_NTSYNC=y' >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
          grep -n '^CONFIG_NTSYNC=y' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
          echo "✅ NTSync patch applied"
        fi
        echo "::endgroup::"

    - name: Apply Unicode Fix Patch
      shell: bash
      if: ${{ env.OP_UNICODE == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply Unicode Fix patch"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        echo "Patching unicode!"
        UNICODE_PATCH=""
        if grep -rq 'u8c->um' fs/unicode/ 2>/dev/null; then
          UNICODE_PATCH="$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1+.patch"
          echo "Tree unicode shape u8c->um detected"
        elif grep -rq 'u8c->data' fs/unicode/ 2>/dev/null; then
          UNICODE_PATCH="$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1-.patch"
          echo "Tree unicode shape u8c->data detected"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          UNICODE_PATCH="$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1-.patch"
        else
          UNICODE_PATCH="$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1+.patch"
        fi
        echo "Using patch: $(basename "$UNICODE_PATCH")"
        gen_patch unicode "$UNICODE_PATCH"
        if grep -Eq '^unicode\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "✅ Unicode fix applied"
        fi
        echo "::endgroup::"

    - name: Add Tmpfs Support
      shell: bash
      run: |
        set -euo pipefail
        echo "Add Tmpfs Support"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        EOF
        grep -q '^CONFIG_TMPFS_XATTR=y' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || { echo "::error::CONFIG_TMPFS_XATTR missing from gki_defconfig"; exit 1; }
        grep -q '^CONFIG_TMPFS_POSIX_ACL=y' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || { echo "::error::CONFIG_TMPFS_POSIX_ACL missing from gki_defconfig"; exit 1; }
        echo "✅ Tmpfs support added (CONFIG_TMPFS_XATTR=y, CONFIG_TMPFS_POSIX_ACL=y)"


    - name: Add BBR
      if: ${{ env.OP_BBR == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Add BBR"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_NET_SCH_FQ_CODEL=y
        EOF
        if [ -f "$COMMON_KERNEL_FOLDER/net/ipv4/tcp_bbr.c" ] && \
           grep -q 'config TCP_CONG_BBR' "$COMMON_KERNEL_FOLDER/net/ipv4/Kconfig"; then
          grep -nE '^CONFIG_(TCP_CONG_BBR|NET_SCH_FQ)=y' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || true
          echo "✅ BBR congestion control enabled"
          echo "bbr|applied" >> "$PS_FILE"
        else
          echo "::warning::BBR not available in tree (tcp_bbr.c/Kconfig missing); marking failed"
          echo "bbr|failed" >> "$PS_FILE"
        fi

    - name: Apply BBRv3
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply BBRv3"
        if [ "${OP_BBR3:-true}" != true ]; then
          echo "bbrv3|skipped" >> "$PS_FILE"
          echo "BBR3_SKIPPED=disabled-by-config" >> "$GITHUB_ENV"
          echo "BBRv3 disabled by config (bbr3: false); skipping"
          echo "::endgroup::"
          exit 0
        fi
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        BBR3_BASE="https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/common/bbrv3"
        MAIN_PATCH="0001-net-tcp-backport-BBRv3-to-${ANDROID_VER}-${KERNEL_VER}.patch"
        DEBUGFS_PATCH="0002-net-tcp-bbr3-add-debugfs-diagnostics-and-runtime-tunables.patch"
        if ! fetch_patch "$BBR3_BASE/$MAIN_PATCH" /tmp/bbr3_main.patch; then
          echo "::warning::BBRv3 backport unavailable for ${ANDROID_VER}-${KERNEL_VER}; skipping"
          echo "bbrv3|skipped" >> "$PS_FILE"
          echo "::endgroup::"
          exit 0
        fi
        if ! grep -q 'proc_dou8vec_minmax' kernel/sysctl.c; then
          if fetch_patch "$BBR3_BASE/sysctl_add_proc_dou8vec_minmax.patch" /tmp/bbr3_sysctl_add.patch && \
             fetch_patch "$BBR3_BASE/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch" /tmp/bbr3_sysctl_fix.patch; then
            gen_patch bbr3-sysctl-add /tmp/bbr3_sysctl_add.patch
            gen_patch bbr3-sysctl-fix /tmp/bbr3_sysctl_fix.patch
          else
            echo "::warning::BBRv3 sysctl prerequisite patches unavailable; continuing without them"
          fi
          if ! grep -q 'proc_dou8vec_minmax' kernel/sysctl.c; then
            echo "::warning::kernel/sysctl.c still lacks proc_dou8vec_minmax; skipping BBRv3"
            echo "bbrv3|skipped" >> "$PS_FILE"
            echo "::endgroup::"
            exit 0
          fi
        fi
        gen_patch bbrv3 /tmp/bbr3_main.patch "" "g:net/ipv4/tcp_bbr3.c|bbr3_register"
        if ! grep -Eq '^bbrv3\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "::warning::BBRv3 backport does not apply for ${ANDROID_VER}-${KERNEL_VER} - build continues without it"
          echo "::endgroup::"
          exit 0
        fi
        # The debugfs diagnostics patch targets 6.12 only; other KMIs skip it silently.
        if [ "$KERNEL_VER" != "6.12" ]; then
          echo "bbrv3-debugfs|skipped" >> "$PS_FILE"
          echo "✅ BBRv3 debugfs skipped: 6.12-only patch, this kernel is ${KERNEL_VER}"
        elif fetch_patch "$BBR3_BASE/$DEBUGFS_PATCH" /tmp/bbr3_debugfs.patch; then
          gen_patch bbrv3-debugfs /tmp/bbr3_debugfs.patch
        else
          echo "::warning::BBRv3 debugfs patch unavailable; continuing without it"
        fi
        grep -q 'config TCP_CONG_BBR3' net/ipv4/Kconfig
        grep -q 'tcp_bbr3' net/ipv4/Makefile
        grep -q '^CONFIG_TCP_CONG_BBR=y' arch/arm64/configs/gki_defconfig || \
          echo 'CONFIG_TCP_CONG_BBR=y' >> arch/arm64/configs/gki_defconfig
        grep -q '^CONFIG_NET_SCH_FQ=y' arch/arm64/configs/gki_defconfig || \
          echo 'CONFIG_NET_SCH_FQ=y' >> arch/arm64/configs/gki_defconfig
        grep -q '^CONFIG_TCP_CONG_BBR3=y' arch/arm64/configs/gki_defconfig || \
          echo 'CONFIG_TCP_CONG_BBR3=y' >> arch/arm64/configs/gki_defconfig
        grep -n 'CONFIG_TCP_CONG_BBR' arch/arm64/configs/gki_defconfig
        echo "BBR3_APPLIED=true" >> "$GITHUB_ENV"
        echo "BBR3_SOURCE=https://github.com/Bouteillepleine/kernel_patches/tree/main/common/bbrv3" >> "$GITHUB_ENV"
        echo "✅ BBRv3 applied for ${ANDROID_VER}-${KERNEL_VER}"
        echo "::endgroup::"

    - name: Apply BoRE
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply BoRE scheduler"
        if [ "${OP_BORE:-false}" != true ]; then
          echo "bore|skipped" >> "$PS_FILE"
          echo "BORE_SKIPPED=disabled-by-config" >> "$GITHUB_ENV"
          echo "✅ BoRE skipped: disabled by config (experimental, default off)"
          echo "::endgroup::"
          exit 0
        fi
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        BORE_PATCH="bore_${KERNEL_VER}.patch"
        case "$KERNEL_VER" in
          6.6|6.12) BORE_SPEC="g:kernel/sched/bore.c|sched_bore_init" ;;
          *) BORE_SPEC="g:kernel/fork.c|sched_bore_free;g:kernel/sysctl.c|sched_bore" ;;
        esac
        # Upstream only: Bouteillepleine/kernel_patches experimental/bore_*.patch
        # at OP_BORE_REF (branch name = head of that branch, or a pinned commit).
        # No repo-local copies; when BP updates the patch, staging picks it up.
        BORE_REF="${OP_BORE_REF:-main}"
        if ! fetch_patch "https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/${BORE_REF}/experimental/${BORE_PATCH}" /tmp/bore.patch; then
          echo "::warning::BoRE patch unavailable (experimental/${BORE_PATCH} @ ${BORE_REF}); skipping"
          echo "bore|skipped" >> "$PS_FILE"
          echo "BORE_SKIPPED=${BORE_PATCH}@${BORE_REF}" >> "$GITHUB_ENV"
          echo "::endgroup::"
          exit 0
        fi
        gen_patch bore /tmp/bore.patch "" "$BORE_SPEC" || true
        if ! grep -Eq '^bore\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "BORE_SKIPPED=${BORE_PATCH}@${BORE_REF} (staging failed; see patch-faillogs)" >> "$GITHUB_ENV"
          echo "::endgroup::"
          exit 0
        fi
        grep -q 'config SCHED_BORE' init/Kconfig
        grep -q '^CONFIG_SCHED_BORE=y' arch/arm64/configs/gki_defconfig || \
          echo 'CONFIG_SCHED_BORE=y' >> arch/arm64/configs/gki_defconfig
        grep -n 'CONFIG_SCHED_BORE' arch/arm64/configs/gki_defconfig
        echo "BORE_APPLIED=true" >> "$GITHUB_ENV"
        echo "BORE_SOURCE=https://github.com/Bouteillepleine/kernel_patches/tree/${BORE_REF}/experimental" >> "$GITHUB_ENV"
        echo "✅ BoRE applied for ${ANDROID_VER}-${KERNEL_VER}"
        echo "::endgroup::"
    - name: Add TTL Target Support
      if: ${{ env.OP_TTL == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Add TTL Target Support"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        EOF
        if grep -q 'config IP_NF_TARGET_TTL' "$COMMON_KERNEL_FOLDER/net/ipv4/netfilter/Kconfig" && \
           grep -q 'config IP6_NF_TARGET_HL' "$COMMON_KERNEL_FOLDER/net/ipv6/netfilter/Kconfig"; then
          grep -nE '^CONFIG_(IP_NF_TARGET_TTL|IP6_NF_(TARGET_HL|MATCH_HL))=y' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || true
          echo "✅ TTL/HL target support enabled"
          echo "ttl|applied" >> "$PS_FILE"
        else
          echo "::warning::TTL/HL targets unavailable in tree; marking failed"
          echo "ttl|failed" >> "$PS_FILE"
        fi

    - name: Add IP SET & IPv6_NAT Support
      if: ${{ env.OP_IP_SET == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Add IP SET & IPv6_NAT Support"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        
        if [[ "$KERNEL_VERSION" == "6.12" ]] || [[ "$OP_BRANCH" == wild/mt* ]]; then
          echo "::debug::Skipping CONFIG_BPF_STREAM_PARSER for $KERNEL_VERSION / $OP_BRANCH"
        else
          echo "CONFIG_BPF_STREAM_PARSER=y" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        fi
        
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=65534
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPMARK=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_IPMAC=y
        CONFIG_IP_SET_HASH_MAC=y
        CONFIG_IP_SET_HASH_NETPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_IP_SET_LIST_SET=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_SET=y
        CONFIG_IP6_NF_NAT=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        EOF
        
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        echo "Patching IPv6_NAT_FIX.patch"
        gen_patch ipv6-nat "$KERNEL_PATCHES_FOLDER/common/IPv6_NAT_FIX.patch" "" "g:kernel/Makefile|IP6_NF_NAT"
        if grep -Eq '^ipv6-nat\|(applied|already)$' "$PS_FILE"; then
          echo "ip_set|applied" >> "$PS_FILE"
          grep -nE '^CONFIG_(IP_SET=|IP6_NF_NAT=|NETFILTER_XT_SET=)' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" | head -n 5 || true
          echo "✅ IP SET & IPv6 NAT support enabled"
        else
          echo "ip_set|failed" >> "$PS_FILE"
        fi
    
    - name: Add USB DWC3 & OTG Support
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add USB DWC3 Configuration"
        
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_USB_DWC3=y
        CONFIG_USB_DWC3_DUAL_ROLE=y
        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_TYPEC=y
        EOF

        if [[ "${OP_BRANCH,,}${OP_SOC,,}" == *"mt"* ]]; then
            echo "Detected MediaTek (mt). Adding MTK USB PHY configs..."
            cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_USB_DWC3_MTK=y
        CONFIG_PHY_MTK_TPHY=y
        EOF
        elif [[ "${OP_BRANCH,,}${OP_SOC,,}" == *"sm"* ]]; then
            echo "Detected Qualcomm (sm). Adding QCOM USB PHY configs..."
            cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_USB_DWC3_QCOM=y
        CONFIG_PHY_QCOM_QMP=y
        CONFIG_PHY_QCOM_USB_HS=y
        EOF
        else
            echo "⚠️ Unrecognized hardware. Falling back to generic DWC3 configs."
        fi

        echo "✅ Dynamic USB DWC3 configs added"
        echo "::endgroup::"

    - name: Add LXC / Droidspaces support
      shell: bash
      if: ${{ env.OP_LXC_DS == 'true' && env.OP_DS != 'true' }}
      run: |
        set -euo pipefail
        echo "Add Droidspaces Support"
        cd "$COMMON_KERNEL_FOLDER"
        
        echo "Applying patch to enable SYSVIPC without breaking ABI"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            DS_KABI="$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch" ;;
          *)
            DS_KABI="$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" ;;
        esac
        gen_patch ds-enable-sysvipc "$DS_KABI"
        if ! grep -Eq '^ds-enable-sysvipc\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "::error::SYSVIPC kABI patch failed to stage at fuzz=0 (see patch-faillogs)"
          exit 1
        fi
        
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_SYSVIPC = y
        CONFIG_DEVTMPFS = y
        CONFIG_PID_NS = y
        CONFIG_POSIX_MQUEUE = y
        EOF
        echo "ds|applied" >> "$PS_FILE"
        echo "✅ LXC / Droidspaces support added (SYSVIPC enabled, namespaces + POSIX mqueue configured)"

    - name: Add Droidspaces support
      shell: bash
      if: ${{ env.OP_DS == 'true' }}
      run: |
        echo "::group::Add Droidspaces Support"
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        
        echo "Applying patch to enable SYSVIPC without breaking ABI"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        require_staged() {
          grep -Eq "^$1\|(applied|already)" "$PS_FILE" 2>/dev/null || { echo "::error::$1 failed to stage at fuzz=0 (see patch-faillogs)"; exit 1; }
        }
        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            gen_patch ds-kabi-a16 "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch"
            require_staged ds-kabi-a16
            ;;
          wild/sm8550|wild/sm7550)
            gen_patch ds-kabi-123 "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch"
            require_staged ds-kabi-123
            ;;
          wild/sm8450|wild/sm8475|wild/mt6895|wild/mt6983|wild/mt6789)
            if [ "$ANDROID_VER" = "android12" ] && [ "$KERNEL_VER" = "5.10" ]; then
              gen_patch ds-kabi-bypass "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch"
              require_staged ds-kabi-bypass
              gen_patch ds-mqueue-padding "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch"
              require_staged ds-mqueue-padding
            else
              gen_patch ds-kabi-678 "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
              require_staged ds-kabi-678
            fi
            ;;
          *)
            gen_patch ds-kabi-678 "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
            require_staged ds-kabi-678
            ;;
        esac
        
        echo "Patch to fix kernel panic caused by oplus_bsp_midas"
        gen_patch ds-ghost-task "$KERNEL_PATCHES_FOLDER/common/droidspaces/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch"
        require_staged ds-ghost-task
        
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_SYSVIPC=y
        CONFIG_DEVTMPFS=y
        CONFIG_PID_NS=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_NETFILTER_XT_TARGET_REJECT=y
        CONFIG_NETFILTER_XT_TARGET_LOG=y
        CONFIG_NETFILTER_XT_MATCH_RECENT=y
        CONFIG_USER_NS=y
        EOF
        
        gen_patch ds-guard-userns "$KERNEL_PATCHES_FOLDER/common/droidspaces/0001-Guard-USER_NS-for-non-root-users.patch"
        require_staged ds-guard-userns
        
        if [ "${{ env.OP_RUST_BUILD }}" = "true" ]; then
          echo "Add IPC NS missing symbols for rust binder"
          if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' "$COMMON_KERNEL_FOLDER/ipc/namespace.c"; then
            echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> "$COMMON_KERNEL_FOLDER/ipc/namespace.c"
          fi
          if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' "$COMMON_KERNEL_FOLDER/ipc/msgutil.c"; then
            echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> "$COMMON_KERNEL_FOLDER/ipc/msgutil.c"
          fi
        fi
        
        echo "✅ Droidspaces Support applied"
        echo "ds|applied" >> "$PS_FILE"
        echo "::endgroup::"

    - name: Add Re-Kernel
      shell: bash
      if: ${{ inputs.use_rekernel || env.OP_REKERNEL == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Add Re-Kernel"
        DEFCONFIG="$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        REKERNEL_DRIVER_DIR="$COMMON_KERNEL_FOLDER/drivers/rekernel"
        TMP_REKERNEL="$RUNNER_TEMP/rekernel"
        rm -rf "$TMP_REKERNEL"

        # Idempotent: strip any previous wiring before re-applying
        sed -i '\|source "drivers/rekernel/Kconfig"|d' "$COMMON_KERNEL_FOLDER/drivers/Kconfig" 2>/dev/null || true
        sed -i '\|obj-$(CONFIG_REKERNEL) += rekernel/|d' "$COMMON_KERNEL_FOLDER/drivers/Makefile" 2>/dev/null || true
        sed -i '/^CONFIG_REKERNEL=y$/d; /^CONFIG_REKERNEL_NETWORK=y$/d' "$DEFCONFIG" 2>/dev/null || true

        git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"
        rm -rf "$REKERNEL_DRIVER_DIR"
        mkdir -p "$REKERNEL_DRIVER_DIR"
        cp -a "$TMP_REKERNEL/LKM-Source/." "$REKERNEL_DRIVER_DIR/"

        # Convert the upstream out-of-tree module into an in-tree built-in driver
        sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_DRIVER_DIR/Makefile"
        grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_DRIVER_DIR/Makefile" \
          || echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_DRIVER_DIR/Makefile"
        sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' "$REKERNEL_DRIVER_DIR/Kconfig"

        grep -qF 'source "drivers/rekernel/Kconfig"' "$COMMON_KERNEL_FOLDER/drivers/Kconfig" \
          || sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' "$COMMON_KERNEL_FOLDER/drivers/Kconfig"
        grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$COMMON_KERNEL_FOLDER/drivers/Makefile" \
          || echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> "$COMMON_KERNEL_FOLDER/drivers/Makefile"

        # Fix include paths for in-tree compilation
        sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' "$REKERNEL_DRIVER_DIR/rekernel_binder.c"
        # 5.10 binder_internal.h needs DEFINE_SHOW_ATTRIBUTE definitions from seq_file.h
        grep -qF '#include <linux/seq_file.h>' "$REKERNEL_DRIVER_DIR/rekernel_binder.c" \
          || sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' "$REKERNEL_DRIVER_DIR/rekernel_binder.c"

        grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
        grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"

        # Hard verification
        grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" \
          && grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$COMMON_KERNEL_FOLDER/drivers/Makefile" \
          && grep -qF 'source "drivers/rekernel/Kconfig"' "$COMMON_KERNEL_FOLDER/drivers/Kconfig" \
          && [ -f "$REKERNEL_DRIVER_DIR/rekernel_binder.c" ] \
          || { echo "::error::Re-Kernel integration incomplete"; exit 1; }

        echo "rekernel|applied" >> "$PS_FILE"
        echo "✅ Re-Kernel driver integrated (CONFIG_REKERNEL=y, CONFIG_REKERNEL_NETWORK=y)"
        echo "::endgroup::"

    - name: Add Build based configs
      shell: bash
      run: |
        set -euo pipefail
        echo "Add Build based configs"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        CONFIG_OPTIMIZE_INLINING=y
        CONFIG_FRAME_WARN=0
        CONFIG_TRACEPOINTS=y
        EOF
        for cfg in CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n CONFIG_OPTIMIZE_INLINING=y CONFIG_FRAME_WARN=0 CONFIG_TRACEPOINTS=y; do
          grep -q "^$cfg" "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || { echo "::error::$cfg missing from gki_defconfig"; exit 1; }
        done
        echo "✅ Build-based configs added (O2 perf, forced inlining, FRAME_WARN=0, TRACEPOINTS)"

    - name: Add RUST build configs
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        set -euo pipefail
        echo "Add RUST build configs"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_ANDROID_BINDER_IPC_RUST=m
        CONFIG_RUST=y
        EOF
        grep -q '^CONFIG_RUST=y' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || { echo "::error::CONFIG_RUST=y missing from gki_defconfig"; exit 1; }
        grep -q '^CONFIG_ANDROID_BINDER_IPC_RUST=m' "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" || { echo "::error::CONFIG_ANDROID_BINDER_IPC_RUST=m missing from gki_defconfig"; exit 1; }
        echo "✅ RUST build configs added (CONFIG_RUST=y, CONFIG_ANDROID_BINDER_IPC_RUST=m)"
    
    - name: Resolve KSU Symbol Dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Resolve KSU Symbol Dependencies"
        if [ "${{ inputs.ksu_type }}" != "KSU" ]; then
          echo "Skipping KernelSU-only symbol resolver fallback."
          echo "::endgroup::"
          exit 0
        fi
        echo "Injecting fallback weak symbol into KernelSU resolver..."
        RESOLVER=$(find "$KSU_FOLDER" -name "symbol_resolver.c" | head -n 1)
        if [ -n "$RESOLVER" ]; then
          if ! grep -q "__weak kallsyms_on_each_symbol" "$RESOLVER"; then
            KERNEL_VER="${{ env.KERNEL_VER }}"
            
            # Use appropriate function signature based on kernel version
            if [[ "$KERNEL_VER" == "5.15" ]]; then
              echo "Applying weak symbol signature for kernel 5.15..."
              cat >> "$RESOLVER" << 'EOF'

        /* Fallback for missing symbols (Kernel < 6.4) */
        int __attribute__((weak)) kallsyms_on_each_symbol(int (*fn)(void *, const char *, struct module *, unsigned long), void *data) {
            return 0;
        }
        EOF
            fi
            echo "✅ Weak symbol injected successfully."
          else
            echo "✅ Weak symbol already exists in resolver."
          fi
        else
          echo "⚠️ symbol_resolver.c not found, skipping weak symbol injection."
        fi

    - name: Save Build Metadata
      id: save_metadata
      shell: bash
      run: |
        set -euo pipefail
        echo "Save Build Metadata"
        cd "$ARTIFACTS_FOLDER"
        echo "kernel_version=${{ env.KERNEL_FULL_VER }}" >> "$GITHUB_OUTPUT"
        echo "ksu_version=${KSUVER:-unknown}" >> "$GITHUB_OUTPUT"
        echo "ksu_type=${{ inputs.ksu_type }}" >> "$GITHUB_OUTPUT"
        echo "nomount_commit=${NOMOUNT_COMMIT_SHA:-unknown}" >> "$GITHUB_OUTPUT"
        echo "build_timestamp=${EFFECTIVE_BUILD_TIMESTAMP:-unknown}" >> "$GITHUB_OUTPUT"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "susfs_version=${SUSVER:-unknown}" >> "$GITHUB_OUTPUT"
        fi
        grep -q '^kernel_version=' "$GITHUB_OUTPUT" || { echo "::error::kernel_version missing from build metadata"; exit 1; }
        grep -q '^nomount_commit=' "$GITHUB_OUTPUT" || { echo "::error::nomount_commit missing from build metadata"; exit 1; }
        echo "✅ Build metadata saved (kernel, ksu type/version, nomount commit, timestamp)"

    - name: Customize Kernel Branding
      shell: bash
      run: |
        set -euo pipefail
        echo "Customize Kernel Branding"
        cd "$COMMON_KERNEL_FOLDER"
        mkdir -p out
        # uname chain: workflow-resolved (override > config > generated) > config > generated here.
        UNAME_SOURCE="workflow"
        RESOLVED="${{ inputs.resolved_uname }}"
        if [ -z "$RESOLVED" ] && [ -n "${OP_UNAME:-}" ]; then
          RESOLVED="$OP_UNAME"; UNAME_SOURCE="config"
        fi
        if [ -z "$RESOLVED" ]; then
          GEN="${{ github.action_path }}/../../../scripts/uname/gen-oem-uname.sh"
          [ -x "$GEN" ] || GEN="$GITHUB_WORKSPACE/action-source/scripts/uname/gen-oem-uname.sh"
          RESOLVED="$(bash "$GEN" --kernel-version "$TKERNEL_VER" --kmi "${ANDROID_VER}-${KERNEL_VER}")" \
            || { echo "❌ uname resolution failed (generator error)"; exit 1; }
          UNAME_SOURCE="generated (action fallback)"
        fi
        [ -n "$RESOLVED" ] || { echo "❌ uname resolution failed"; exit 1; }
        [[ ${#RESOLVED} -le 44 && "$RESOLVED" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "❌ resolved uname '$RESOLVED' violates the 44-char/charset rule"; exit 1; }
        CUSTOM_LOCALVERSION="-${ANDROID_VER}-${RESOLVED}"
        echo "OP_UNAME=$RESOLVED" >> "$GITHUB_ENV"
        echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
        echo "✅ Kernel branding customized (LOCALVERSION suffix: $CUSTOM_LOCALVERSION, uname source: $UNAME_SOURCE)"

    - name: Disable GPUEB
      shell: bash
      if: ${{ env.KERNEL_VER == '5.10' && (startsWith(env.OP_SOC, 'dimensity') || startsWith(env.OP_SOC, 'helio')) }}
      run: |
        set -euo pipefail
        echo "Disabling GPUEB for MTK kernel 5.10"
        sed -i '/obj-y.*gpueb/d' "$COMMON_KERNEL_FOLDER/drivers/gpu/mediatek/Makefile"
        if [ -f "$COMMON_KERNEL_FOLDER/drivers/gpu/mediatek/Makefile" ]; then
          if grep -qE 'obj-y.*gpueb' "$COMMON_KERNEL_FOLDER/drivers/gpu/mediatek/Makefile"; then
            echo "::error::gpueb obj-y entries still present in mediatek Makefile"
            exit 1
          fi
          echo "✅ GPUEB disabled (obj-y gpueb entries removed)"
        else
          echo "✅ GPUEB step not applicable (no mediatek gpu Makefile in this tree)"
        fi

    - name: Apply Fake config.gz patch
      shell: bash
      run: |
        set -euo pipefail
        echo "Apply Fake config.gz patch"
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"
        gen_patch fake-config "$KERNEL_PATCHES_FOLDER/common/fake_config.patch" "" "g:kernel/Makefile|KCONFIG_CONFIG_PATCHED"
        if ! grep -Eq '^fake-config\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "::error::fake_config patch failed to stage at fuzz=0 (see patch-faillogs)"
          exit 1
        fi
        
        OPTIONS=()
        
        if [ "${OP_BBR:-}" = "true" ] || [ "${OP_BBR3:-}" = "true" ]; then
          OPTIONS+=("CONFIG_TCP_CONG_ADVANCED")
        fi
        
        if [ "$OP_IP_SET" = "true" ]; then
          OPTIONS+=("CONFIG_IP6_NF_NAT")
        fi
        
        CONFIG_STRING="${OPTIONS[*]}"
        echo "CONFIG_FAKE_DISABLE=${CONFIG_STRING}" >> $GITHUB_ENV
        echo "✅ Fake config.gz patched (KCONFIG_CONFIG_PATCHED verified in kernel/Makefile; CONFIG_FAKE_DISABLE=${CONFIG_STRING:-none})"

    - name: Disable Vendor / Kernel Modules
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Disable Vendor / Kernel Modules"
        cd "$COMMON_KERNEL_FOLDER"
        source "$GITHUB_WORKSPACE/patchgen/gen_patch.sh"

        # Kernel-side refusal of vendor module loads via
        # CONFIG_DEBLOAT_VENDOR_MODULES (comma-separated list compiled into the
        # kernel and checked in blacklisted()). The debloater disables itself
        # via a static key on non-normal boots (recovery/OTA), so it can never
        # break non-standard boot paths.
        RISKY_MODULES=("coresight" "rust_binder" "msm_kgsl" "camera" "oplusboot" "rmnet_wlan" "rmnet_core" "msm_drm" "cnss2" "oplus_chg_v2" "reboot_mode" "rfkill" "bootloader_log")

        declare -a modules=()
        IFS=',' read -ra ADDR <<< "${OP_BLACKLIST_MODULES:-}"
        for mod in "${ADDR[@]}"; do
          [[ -n "$mod" ]] && modules+=("$mod")
        done

        # OEM network-tuning modules fight BBR/BBRv3 congestion control
        if [ "${OP_BBR:-false}" = "true" ] || [ "${OP_BBR3:-false}" = "true" ]; then
          if [[ ! " ${modules[*]:-} " =~ " oplus_network_tuning " ]]; then
            modules+=("oplus_network_tuning")
          fi
          if [[ ! " ${modules[*]:-} " =~ " oplus_networks_tuning " ]]; then
            modules+=("oplus_networks_tuning")
          fi
        fi

        # Safety filter: exact-match against the protected list
        declare -a validated_modules=()
        for mod in "${modules[@]:-}"; do
          [ -z "$mod" ] && continue
          is_risky=false
          for risky in "${RISKY_MODULES[@]}"; do
            if [ "$mod" = "$risky" ]; then
              is_risky=true
              echo "::warning::Blocked attempt to blacklist protected module: $mod"
              break
            fi
          done
          if [ "$is_risky" = false ]; then
            validated_modules+=("$mod")
          fi
        done

        if [ ${#validated_modules[@]} -gt 0 ]; then
          RAW_JOINED=$(IFS=,; echo "${validated_modules[*]}")
          RESULT_LIST="\"${RAW_JOINED}\""
        else
          RESULT_LIST='""'
        fi
        echo "Blacklisting ${#validated_modules[@]} vendor module(s): ${RESULT_LIST}"

        grep -q '^CONFIG_DEBLOAT_VENDOR_MODULES=' arch/arm64/configs/gki_defconfig || \
          echo "CONFIG_DEBLOAT_VENDOR_MODULES=${RESULT_LIST}" >> arch/arm64/configs/gki_defconfig

        # <=5.15 trees use kernel/module.c, >=6.1 trees use kernel/module/main.c
        if [ "$(printf '%s\n' "$KERNEL_VER" "5.16" | sort -V | head -n1)" = "$KERNEL_VER" ]; then
          VM_PATCH="$KERNEL_PATCHES_FOLDER/common/vendor_modules/0001-Support-conditional-vendor-modules-blacklisting-5.15-and-below.patch"
          VM_VERIFY="g:kernel/module.c|CONFIG_DEBLOAT_VENDOR_MODULES"
        else
          VM_PATCH="$KERNEL_PATCHES_FOLDER/common/vendor_modules/0001-Support-conditional-vendor-modules-blacklisting-6.1-and-above.patch"
          VM_VERIFY="g:kernel/module/main.c|CONFIG_DEBLOAT_VENDOR_MODULES"
        fi
        [ -f "$VM_PATCH" ] || { echo "::error::vendor_modules patch missing: $VM_PATCH"; exit 1; }

        gen_patch vendor-modules-blacklist "$VM_PATCH" "" "$VM_VERIFY"
        if ! grep -Eq '^vendor-modules-blacklist\|(applied|already)' "$PS_FILE" 2>/dev/null; then
          echo "::error::vendor-modules-blacklist patch failed to stage at fuzz=0 (see patch-faillogs)"
          exit 1
        fi

        grep -n 'CONFIG_DEBLOAT_VENDOR_MODULES' kernel/module/main.c kernel/module.c 2>/dev/null || true
        grep -n '^CONFIG_DEBLOAT_VENDOR_MODULES=' arch/arm64/configs/gki_defconfig
        echo "✅ [vendor-modules-blacklist] verified"
        echo "::endgroup::"

    - name: Patch dry-run verdict
      if: ${{ inputs.patch_dry_run == true || inputs.patch_dry_run == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Patch dry-run verdict"
        VERDICT="$DEBUG_ARTIFACTS_DIR/patch_dry_run_${OP_MODEL}_${OP_OS_VERSION}.txt"
        failed_patches="$(grep -Ec '\|failed$' "$PS_FILE" 2>/dev/null || true)"
        skipped_patches="$(grep -Ec '\|skipped$' "$PS_FILE" 2>/dev/null || true)"
        {
          echo "device=$OP_MODEL os=$OP_OS_VERSION"
          echo "kernel=${ANDROID_VER}-${TKERNEL_VER}"
          echo "== per-patch status =="
          cat "$PS_FILE" 2>/dev/null || true
          echo "== summary =="
          echo "failed_patches=${failed_patches:-0}"
          echo "skipped_patches=${skipped_patches:-0}"
          echo "adios=${ADIOS_ENABLED:-not-applied}"
          echo "bbrv3=${BBR3_APPLIED:-not-applied}"
          echo "bore=${BORE_APPLIED:-not-applied}"
          echo "bore_skipped=${BORE_SKIPPED:-none}"
          echo "adios_skipped=${ADIOS_SKIPPED:-none}"
          if [ "${failed_patches:-0}" -gt 0 ] || [ "${skipped_patches:-0}" -gt 0 ]; then
            echo "result=PARTIAL_PATCHES_APPLIED"
          else
            echo "result=ALL_PATCHES_APPLIED_CLEANLY"
          fi
        } > "$VERDICT"
        cat "$VERDICT"
        if [ "${failed_patches:-0}" -gt 0 ] || [ "${skipped_patches:-0}" -gt 0 ]; then
          echo "::notice::patch_dry_run=true — patches applied with soft-skips/soft-fails for ${OP_MODEL} ${OP_OS_VERSION} (see verdict). Compilation intentionally skipped."
        else
          echo "::notice::patch_dry_run=true — every requested patch applied cleanly for ${OP_MODEL} ${OP_OS_VERSION}. Compilation intentionally skipped."
        fi
        echo "::endgroup::"
        if [ "${failed_patches:-0}" -gt 0 ] || [ "${skipped_patches:-0}" -gt 0 ]; then
          echo "⚠️ Dry-run verdict written (failed=$failed_patches, skipped=$skipped_patches — see artifact)"
        else
          echo "✅ Dry-run verdict written (every requested patch applied cleanly at fuzz=0)"
        fi

    - name: Upload patch dry-run verdict
      if: ${{ inputs.patch_dry_run == true || inputs.patch_dry_run == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: patch-dry-run-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}
        path: ${{ env.DEBUG_ARTIFACTS_DIR }}/patch_dry_run_*.txt
        if-no-files-found: error
        retention-days: 7

    - name: Upload patch status
      if: ${{ always() && env.PS_FILE != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: patch-status-${{ env.PS_BASE }}
        path: ${{ env.PS_FILE }}
        if-no-files-found: ignore
        retention-days: 7

    - name: Stop before build (dry run)
      if: ${{ inputs.patch_dry_run == true || inputs.patch_dry_run == 'true' }}
      shell: bash
      run: |
        echo "Dry run complete — see the patch-dry-run artifact. Not building."
        echo "✅ Dry-run gate reached (compilation intentionally skipped)"
        exit 0
        
    - name: Build Kernel
      id: build_kernel_step
      if: ${{ !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"
        
        cd "$COMMON_KERNEL_FOLDER"
        : > "$COMMON_KERNEL_FOLDER/.scmversion"
        
        export PYTHONWARNINGS="${PYTHONWARNINGS}"
        
        echo "Getting last commit timestamp from kernel source..."
        COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
        COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u '+%Y-%m-%d %H:%M:%S')
        COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        
        WORKSPACE="${GITHUB_WORKSPACE}"
        MAP="-fdebug-prefix-map=${WORKSPACE}=."
        MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
        FPMAP="-ffile-prefix-map=${WORKSPACE}=."
        
        export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
        export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"
        
        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PAHOLE="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm 
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        
        set +u
        source "$KERNEL_PLATFORM_FOLDER/build/kernel/_setup_env.sh" 2>/dev/null || true
        set -u
        
        echo '#!/bin/bash' > "$COMMON_KERNEL_FOLDER/ld-wrapper"
        echo 'ld.lld "$@" --thinlto-jobs=$(nproc --all)' >> "$COMMON_KERNEL_FOLDER/ld-wrapper"
        chmod +x "$COMMON_KERNEL_FOLDER/ld-wrapper"
        
        KERNEL_BUILD_DATE=$(date -u)
        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        if [ -n "${{ inputs.build_timestamp }}" ]; then
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          echo "📅 Using custom build timestamp input: $KBUILD_BUILD_TIMESTAMP"
        elif [ -n "${OP_BUILD_TIME:-}" ] && [ "${OP_BUILD_TIME}" != "null" ]; then
          export KBUILD_BUILD_TIMESTAMP="$OP_BUILD_TIME"
          echo "📅 Using per-config build_time: $KBUILD_BUILD_TIMESTAMP"
        else
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
          echo "📅 Using current UTC build timestamp: $KBUILD_BUILD_TIMESTAMP"
        fi
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
        export KBUILD_BUILD_USER="${BUILD_USER:-kernel}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-kleaf}"
        export KBUILD_BUILD_VERSION=1
        echo "🔢 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
        echo "👤 Build user: $KBUILD_BUILD_USER"
        echo "🖥️  Build host: $KBUILD_BUILD_HOST"
        
        export CC="ccache clang"
        export CXX="ccache clang++"
        export HOSTCC="ccache clang"
        export HOSTCXX="ccache clang++"
        
        if [ "${{ inputs.clean }}" = "false" ]; then
          echo "🚀 ccache-accelerated build"
        else
          echo "🧹 Clean build mode"
        fi
        
        OUT=out
        mkdir -p "$OUT"

        echo "============================================"
        echo "🔍 Compiler & ccache Verification"
        echo "============================================"
        echo "PATH: ${PATH:0:200}..."
        echo "which clang: $(which clang)"
        echo "CC: $CC"
        echo "CXX: $CXX"
        echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
        echo ""
        
        echo "ccache wrapper test:"
        clang --version 2>&1 | head -n1 || true
        echo ""
        echo "ccache configuration:"
        ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
        echo ""
        echo "ccache pre-build status:"
        ccache -s | head -n 20
        echo "============================================"
        
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" gki_defconfig
        
        # Compiling without an OEM-like release suffix is forbidden (see the branding step).
        LOCAL_LOCALVERSION="${CUSTOM_LOCALVERSION:-}"
        if [ -z "$LOCAL_LOCALVERSION" ] || [ "$LOCAL_LOCALVERSION" = "-${ANDROID_VER}" ]; then
          echo "❌ LOCALVERSION has no uname suffix ('$LOCAL_LOCALVERSION') — refusing to compile bare"
          exit 1
        fi
        if [ -n "${LOCAL_LOCALVERSION:-}" ]; then
          scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${LOCAL_LOCALVERSION}"
          scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
          sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
        fi
        
        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O3"
        else
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O2"
        fi

        case "$OP_BRANCH" in
          wild/sm8750|wild/sm8850|wild/sm8845)
            KCFLAGS_EXTRA="-mcpu=oryon-1 ${KCFLAGS_EXTRA}"
            ;;
        esac
        
        scripts/config --file "$OUT/.config" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL
        
        case "${{ env.OP_LTO}}" in
          "none") scripts/config --file "$OUT/.config" -e LTO_CLANG_NONE ;;
          "thin") scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN ;;
          "full") scripts/config --file "$OUT/.config" -e LTO_CLANG_FULL ;;
          *)
            echo "::error::Unsupported LTO option: ${{ env.OP_LTO}}"
            exit 1
            ;;
        esac
        
        
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" olddefconfig
        
        KCFLAGS="$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}"
        KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"
        
        echo "============================================"
        echo "🔧 Build Configuration"
        echo "============================================"
        echo "Device: ${OP_MODEL}"
        echo "Kernel: ${KERNEL_FULL_VER}"
        echo "Threads: $(nproc --all)"
        echo "Optimization: ${{ inputs.optimize_level }}"
        echo "KCFLAGS: ${KCFLAGS:0:150}..."
        echo "KCPPFLAGS: ${KCPPFLAGS:0:150}..."
        echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
        echo "Workspace: $WORKSPACE"
        
        echo "ccache: ENABLED"
        echo "  Dir: $CCACHE_DIR"
        echo "  Base: $CCACHE_BASEDIR"
        echo "  Max size: $CCACHE_MAXSIZE"
        echo "  Compression: zstd level 3"
        echo "  Features: readonly_direct, file_clone, inode_cache, depend"
        echo "============================================"

        if [ ! -d "$CCACHE_DIR" ] || [ -z "$(find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null)" ]; then
          echo "🔥 Priming cache with header preprocessing..."
          make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -C "$COMMON_KERNEL_FOLDER" O="$OUT" headers_install prepare 2>&1 | head -n 20 || true
          echo ""
        fi
        
        BUILD_START=$(date +%s)
        set -o pipefail
        
        if [ "${{ inputs.debug }}" == "true" ]; then
          make V=1 LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image modules 2>&1 | tee build.log
          make V=1 LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$COMMON_KERNEL_FOLDER/out" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" INSTALL_MOD_PATH="$COMMON_KERNEL_FOLDER/out/install" modules_install 2>&1 | tee install.log
          
          cp build.log "$DEBUG_ARTIFACTS_FOLDER/build.log"
          cp install.log "$DEBUG_ARTIFACTS_FOLDER/install.log"
          rsync -av --no-links --exclude='build' "$COMMON_KERNEL_FOLDER/out/install/lib/modules"/*/ "$DEBUG_ARTIFACTS_FOLDER"
          cp "$COMMON_KERNEL_FOLDER/out/vmlinux" "$DEBUG_ARTIFACTS_FOLDER/vmlinux"
          cp "$COMMON_KERNEL_FOLDER/out/Module.symvers" "$DEBUG_ARTIFACTS_FOLDER/Module.symvers"
          cp "$COMMON_KERNEL_FOLDER/out/System.map" "$DEBUG_ARTIFACTS_FOLDER/System.map"
          
          ls -la "$DEBUG_ARTIFACTS_FOLDER"
        else
          make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image 2>&1 | tee build.log
        fi
        
        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))
        
        echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
        echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
        echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
        
        BOOT_DIR="$OUT/arch/arm64/boot"
        IMG="$BOOT_DIR/Image"
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image missing"
          echo "::group::Last 100 lines of build log"
          tail -n 100 build.log || echo "Build log not available"
          echo "::endgroup::"
          exit 1
        fi

        IMG_SIZE=$(stat -c%s "$IMG")
        
        echo "============================================"
        echo "✅ Build Completed Successfully"
        echo "============================================"
        echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        if [ "${{ inputs.clean }}" != "true" ]; then
          echo ""
          echo "📊 ccache Post-Build Statistics"
          echo "============================================"
          ccache -s
        fi
        echo "============================================"
        echo "✅ Kernel build completed"
        echo "::endgroup::"

    - name: 📊 ccache Post-Build Statistics
      id: ccache_stats
      if: ${{ success() && (inputs.clean == false || inputs.clean == 'false') && !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::ccache final statistics"
        
        export CCACHE_DIR="${{ env.CCACHE_DIR }}"
        
        echo "Clear Temporary cache files..."
        ccache -c
        
        echo "Perform ccache eviction!"
        # 0.5 days = 12 Hrs. Delete cache unused in 12 hrs. 12 hrs is considered for safety.
        # Yes. ccache uses mtime as a store of time due to cross compatibility with different OS.
        find "$CCACHE_DIR" -type f -mtime +0.5 -delete
        # Remove empty layout subdirectories
        find "$CCACHE_DIR" -type d -empty -delete

        cp "${{ env.CCACHE_LOGFILE }}" "$CCACHE_DIR"
        
        if [ "${{ inputs.debug }}" == "true" ]; then
          if [ -f "${{ env.CCACHE_LOGFILE }}" ]; then
            echo "Rename ccache log"
            LOG_DIR=$(dirname "${{ env.CCACHE_LOGFILE }}")
            NEW_LOG_NAME="${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
            mv "${{ env.CCACHE_LOGFILE }}" "$LOG_DIR/$NEW_LOG_NAME"
            echo "CCACHE_LOGFILE=$LOG_DIR/$NEW_LOG_NAME" >> $GITHUB_ENV
          else
            echo "⚠ ccache log not found, skipping rename."
          fi
        fi
        
        STATS="$(ccache -s)"
        
        CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ {
          match($0, /[0-9]+/); 
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)
        
        HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ {
          match($0, /[0-9]+/); 
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)
        
        DIRECT=$(echo "$STATS" | awk '/Direct:/ {
          match($0, /[0-9]+/); 
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)
        
        if [ "${CACHEABLE:-0}" -gt 0 ]; then
          HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
        else
          HIT_RATE="0.0"
          DIRECT_RATE="0.0"
        fi
        
        echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
        echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"
        
        echo "::endgroup::"
        
        echo "## 📊 ccache Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ccache -s --verbose >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "✅ ccache post-build statistics written (hit_rate=${HIT_RATE}%)"

    - name: Collect Build Stats / Validate Image
      id: collect_stats
      if: ${{ !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collect Build stats"
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        
        if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
          IMG="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
        elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
          IMG="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
        fi
        
        if [ -f "$COMMON_KERNEL_FOLDER/build.log" ]; then
          WARNINGS_COUNT="$(grep -ciE '\bwarning:' "$COMMON_KERNEL_FOLDER/build.log" || true)"
          [ -n "$WARNINGS_COUNT" ] || WARNINGS_COUNT="0"
        else
          WARNINGS_COUNT="0"
        fi
        
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image not found at: $IMG"
          exit 1
        fi
        
        if ! file "$IMG" | grep -qi 'ARM64'; then
          echo "::error::Image is not ARM64 format"
          file "$IMG"
          exit 1
        fi
        
        IMG_SIZE=$(stat -c %s "$IMG")
        MIN_SIZE=6102400
        if [ "$IMG_SIZE" -lt "$MIN_SIZE" ]; then
          echo "::error::Image size too small: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
          exit 1
        fi
        
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        BUILD_TIME="${BUILD_TIME:-0}"
        
        KERNEL_UNAME_BANNER=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1)
        # Keep only the release string (e.g. 6.12.58-android16-6-g925a103d123c-ab15898589-4k) for
        # the summary; the full banner (compiler, build user@host, SMP PREEMPT + timestamp) stays in
        # this log group only, mirroring a clean uname like BP's build reports.
        KERNEL_UNAME=$(printf '%s' "$KERNEL_UNAME_BANNER" | sed -e 's/^Linux version //' -e 's/ .*//')
        echo "Kernel Uname (full banner): $KERNEL_UNAME_BANNER"
        echo "Kernel Uname: $KERNEL_UNAME"
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
        
        printf 'warnings_count=%s\n' "$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
        printf 'image_sha256=%s\n' "$IMG_SHA256" >> "$GITHUB_OUTPUT"
        printf 'build_time=%s\n' "$BUILD_TIME" >> "$GITHUB_OUTPUT"
        
        echo "✅ Validation passed:"
        echo "   - Warnings: $WARNINGS_COUNT"
        echo "   - Image size: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        echo "   - SHA256: $IMG_SHA256"
        echo "   - Build time: ${BUILD_TIME}s"
        echo "✅ Image validated (SHA256 + warnings recorded)"
        echo "::endgroup::"

    - name: Create Kernel ZIP
      id: create_zip
      if: ${{ !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Create kernel ZIP package"
        
        IMAGE_PATH="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        
        if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
          IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
        elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
          IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
        fi
        
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "::error::Built Image not found at: $IMAGE_PATH"
          exit 1
        fi
        
        cp "$IMAGE_PATH" "$AK3_FOLDER/Image"
        
        mv "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt" "$AK3_FOLDER/"
        cd "$AK3_FOLDER"
        
        sed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh
        
        ZIP_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          ZIP_NAME="AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}_SuSFS_${SUSVER:-unknown}.zip"
        else
          ZIP_NAME="AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}.zip"
        fi
        mkdir -p "$ARTIFACTS_FOLDER"
        
        echo "Creating flashable ZIP: $ZIP_NAME"
        
        if ! zip -r9 "$ZIP_NAME" ./* \
             -x "*.git*" \
             -x "$ZIP_NAME" \
             -x "README.md" 2>&1 | tee /tmp/zip.log; then
          echo "::error::Failed to create ZIP package"
          exit 1
        fi
        
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        
        find "$ARTIFACTS_FOLDER" -maxdepth 1 -type f ! -name "$ZIP_NAME" -delete
        
        ZIP_SIZE=$(stat -c%s "$ARTIFACTS_FOLDER/$ZIP_NAME")
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        printf 'zip_sha256=%s\n' "$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        
        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
        
        echo ""
        echo "✅ Kernel ZIP created successfully"
        echo "   Name: $ZIP_NAME"
        echo "   Size: $(numfmt --to=iec-i --suffix=B "$ZIP_SIZE")"
        echo "   SHA256: $ZIP_SHA256"
        echo "::endgroup::"

    - name: Final Build Summary
      if: ${{ !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        
        pstat() { local v; v="$(awk -F'|' -v k="$1" '$1==k{print $2}' "$PS_FILE" 2>/dev/null || true)"; echo "${v:-not requested}"; }

        # Get commit SHAs with fallback
        KSU_SHA="${KSU_COMMIT_SHA:-unknown}"
        SUSFS_SHA="${SUSFS_COMMIT_SHA:-unknown}"
        
        {
          echo "Model: ${{ env.OP_MODEL }}"
          echo "OS Version: ${{ env.OP_OS_VERSION }}"
          echo "Android: ${{ env.ANDROID_VER }}"
          echo "Kernel base: ${{ env.KERNEL_VER }}"
          echo "Kernel full: ${{ env.KERNEL_FULL_VER }}"
          echo "Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "Build User: ${{ env.BUILD_USER }}"
          echo "Build Host: ${{ env.BUILD_HOST }}"
          if [ "${{ inputs.ksu_type }}" = "BakaSU" ]; then
            echo "BakaSU Version: ${KSUVER:-unknown}"
            echo "BakaSU commit SHA: ${KSU_SHA:-unknown}"
          elif [ "${{ inputs.ksu_type }}" = "FinaSU" ]; then
            echo "FinaSU Version: ${KSUVER:-unknown}"
            echo "FinaSU commit SHA: ${KSU_SHA:-unknown}"
          elif [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
            echo "KernelSU-Next Version: ${KSUVER:-unknown}"
            echo "KernelSU-Next commit SHA: ${KSU_SHA:-unknown}"
          else
            echo "KSU Version: ${KSUVER:-unknown}"
            echo "KSU commit SHA: ${KSU_SHA:-unknown}"
          fi
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS Version: ${SUSVER:-unknown}"
            echo "SUSFS commit SHA: $SUSFS_SHA"
          fi
          echo "Optimization: ${{ inputs.optimize_level }}"
          echo "Clean Build: ${{ inputs.clean }}"
          echo ""
          echo "=== Patch Status (actual application results) ==="
          echo "SusFS: $(pstat susfs)"
          echo "BBR: $(pstat bbr)"
          echo "BBRv3: $(pstat bbrv3)"
          echo "BoRE: $(pstat bore) (via ${BORE_SKIPPED:-n/a})"
          echo "ADIOS: $(pstat adios)"
          echo "BBG: $(pstat bbg)"
          echo "HMBIRD SCX: $(pstat hmbird)"
          echo "TTL: $(pstat ttl)"
          echo "IP_SET & IPv6 NAT: $(pstat ip_set)"
          echo "Unicode Fix: $(pstat unicode)"
          echo "NTSync: $(pstat ntsync)"
          echo "Droidspaces: $(pstat ds)"
          echo "LZ4 1.10.0 + ARMv8 NEON: $(pstat lz4)"
          echo "zstd 1.5.7 + tunable level: $(pstat zstd-upgrade)"
          echo "CVE-2026-43499 rtmutex fix: $(pstat rtmutex-cve)"
          echo "Re-Kernel: ${{ inputs.use_rekernel || env.OP_REKERNEL == 'true' }}"
          echo "NoMount: $(pstat nomount)"
          echo "Vendor Module Blacklist: $(pstat vendor-modules-blacklist)"
          echo "WildKernels' Optimisations: $(pstat wk-opt)"
          echo ""
          echo "Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
          echo "AnyKernel3 ZIP SHA256: ${{ steps.create_zip.outputs.zip_sha256 }}"
          echo "Compiler: ${CLANG_VERSION:-unknown}"
          echo "Warnings Count: ${{ steps.collect_stats.outputs.warnings_count }}"
          echo "Build Time: ${{ steps.collect_stats.outputs.build_time }}s"
          if [ "${{ inputs.clean }}" == "false" ]; then
            echo "ccache Hit Rate: ${{ steps.ccache_stats.outputs.hit_rate }}"
            echo "ccache Direct Rate: ${{ steps.ccache_stats.outputs.direct_rate }}"
          else
            echo "ccache: Disabled (clean build)"
          fi
          echo "Artifact Name: ${{ env.ZIP_NAME }}"
        } | tee summary.txt
        
        {
          echo "### 🎯 Kernel Build Summary"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Model** | ${{ env.OP_MODEL }} |"
          echo "| **OS Version** | ${{ env.OP_OS_VERSION }} |"
          echo "| **Kernel Version** | ${{ steps.save_metadata.outputs.kernel_version }} |"
          echo "| **Kernel Uname** | \`${{ env.KERNEL_UNAME }}\` |"
          echo "| **Build User** | ${{ env.BUILD_USER }} |"
          echo "| **Build Host** | ${{ env.BUILD_HOST }} |"
          
          if [ "${{ inputs.ksu_type }}" = "BakaSU" ]; then
            echo "| **BakaSU Version** | ${KSUVER:-unknown} |"
          elif [ "${{ inputs.ksu_type }}" = "FinaSU" ]; then
            echo "| **FinaSU Version** | ${KSUVER:-unknown} |"
          elif [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
            echo "| **KernelSU-Next Version** | ${KSUVER:-unknown} |"
          else
            echo "| **KSU Version** | ${KSUVER:-unknown} |"
          fi
          
          if [ "$KSU_SHA" != "unknown" ]; then
            if [ "${{ inputs.ksu_type }}" = "BakaSU" ]; then
              echo "| **BakaSU Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/Baka-SU/BakaSU/commit/$KSU_SHA) |"
            elif [ "${{ inputs.ksu_type }}" = "FinaSU" ]; then
              echo "| **FinaSU Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/LyraVoid/FinaSU/commit/$KSU_SHA) |"
            elif [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              echo "| **KernelSU-Next Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/KernelSU-Next/KernelSU-Next/commit/$KSU_SHA) |"
            else
              echo "| **KSU Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/tiann/KernelSU/commit/$KSU_SHA) |"
            fi
          else
            echo "| **KSU Commit** | unknown |"
          fi
          
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "| **SUSFS Version** | ${SUSVER:-unknown} |"
            
            if [ "$SUSFS_SHA" != "unknown" ]; then
              echo "| **SUSFS Commit** | [\`${SUSFS_SHA:0:8}\`](https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_SHA) (${SUSFS_REF_SOURCE:-kmi-default branch}: \`${SUSFS_REF:-branch}\`) |"
            else
              echo "| **SUSFS Commit** | unknown |"
            fi
          fi
          
          echo ""
          echo "### 🔧 Patch Status (actual application results)"
          echo ""
          echo "| Feature | Status |"
          echo "|---------|--------|"
          echo "| **SusFS** | $(pstat susfs) |"
          echo "| **BBR** | $(pstat bbr) |"
          echo "| **BBRv3** | $(pstat bbrv3) |"
          echo "| **BoRE** | $(pstat bore) (via ${BORE_SKIPPED:-n/a}) |"
          echo "| **ADIOS** | $(pstat adios) |"
          echo "| **BBG** | $(pstat bbg) |"
          echo "| **HMBIRD SCX** | $(pstat hmbird) |"
          echo "| **TTL** | $(pstat ttl) |"
          echo "| **IP_SET & IPv6 NAT** | $(pstat ip_set) |"
          echo "| **Unicode Fix** | $(pstat unicode) |"
          echo "| **NTSync** | $(pstat ntsync) |"
          echo "| **Droidspaces** | $(pstat ds) |"
          echo "| **LZ4 1.10.0 + ARMv8 NEON** | $(pstat lz4) |"
          echo "| **zstd 1.5.7 + tunable level** | $(pstat zstd-upgrade) |"
          echo "| **CVE-2026-43499 rtmutex fix** | $(pstat rtmutex-cve) |"
          echo "| **NoMount** | $(pstat nomount) (${NOMOUNT_REF_SOURCE:-unknown}) |"
          echo "| **Vendor Module Blacklist** | $(pstat vendor-modules-blacklist) |"
          echo "| **WildKernels' Optimisations** | $(pstat wk-opt) |"
          
          echo ""
          echo "### 📊 Build Metrics"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Optimization** | ${{ inputs.optimize_level }} |"
          echo "| **Clean Build** | ${{ inputs.clean }} |"
          echo "| **Build Time** | ${{ steps.collect_stats.outputs.build_time }}s |"
          
          if [ "${{ inputs.clean }}" == "false" ]; then
            echo "| **ccache Hit Rate** | ${{ steps.ccache_stats.outputs.hit_rate }} |"
            echo "| **ccache Direct Rate** | ${{ steps.ccache_stats.outputs.direct_rate }} |"
          fi
          
          echo "| **Image SHA256** | \`${{ steps.collect_stats.outputs.image_sha256 }}\` |"
          echo "| **Warnings** | ${{ steps.collect_stats.outputs.warnings_count }} |"
          echo "| **Compiler** | \`${CLANG_VERSION:-unknown}\` |"
          echo "| **Artifact Name** | \`${{ env.ZIP_NAME }}\` |"
          echo "| **AnyKernel3 SHA256** | \`${{ steps.create_zip.outputs.zip_sha256 }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "✅ Final build summary written to $GITHUB_STEP_SUMMARY"

    - name: Upload Debug Artifacts
      if: ${{ always() && !cancelled() && inputs.debug == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEBUG_ZIP_NAME }}
        path: ${{ env.DEBUG_ARTIFACTS_FOLDER }}
        compression-level: 9
        retention-days: 90

    - name: Upload Artifacts
      if: ${{ success() && steps.create_zip.conclusion == 'success' && !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: Upload ccache log
      if: ${{ success() && inputs.debug == 'true' && steps.build_kernel_step.conclusion == 'success' && !(inputs.patch_dry_run == true || inputs.patch_dry_run == 'true') }}
      uses: actions/upload-artifact@v7
      with:
        name: "${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
        path: ${{ env.CCACHE_LOGFILE }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      if: always() && steps.build_kernel_step.conclusion == 'success'
      with:
        path: main-source
        fetch-depth: 1

    - name: Save ccache cache
      if: always() && steps.build_kernel_step.conclusion == 'success'
      uses: ./action-source/.github/actions/cache/save
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        github_token: ${{ inputs.github_token }}
        working_dir: "./main-source"
        compression_level: 6
